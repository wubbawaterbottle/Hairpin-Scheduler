<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Hairpin — Scheduler</title>
<script>(function(){var t="dark";try{t=localStorage.getItem("hairpinTheme")||"dark"}catch(e){}if(t!=="light")document.documentElement.setAttribute("data-theme","dark")})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="task-manager.css">
<style>
/* ═══ THEME TOKENS (2026-10-16): light = design.md, [data-theme=dark] = the old slate & ocean ═══ */
:root{--bg:#f9fafb;--bg-rgb:249 250 251;--bg-2:#ffffff;--bg-2-rgb:255 255 255;--we:#f6f6f7;--we-rgb:246 246 247;--surface:#ffffff;--surface-rgb:255 255 255;--surface-2:#ffffff;--surface-2-rgb:255 255 255;--raise:#f4f4f5;--raise-rgb:244 244 245;--hover:#f4f4f5;--hover-rgb:244 244 245;--sel-bg:#eff6ff;--sel-bg-rgb:239 246 255;--line-soft:#f0f0f2;--line-soft-rgb:240 240 242;--line:#e4e4e7;--line-rgb:228 228 231;--line-2:#d4d4d8;--line-2-rgb:212 212 216;--line-3:#a1a1aa;--line-3-rgb:161 161 170;--ink:#18181b;--ink-rgb:24 24 27;--ink-hi:#18181b;--ink-hi-rgb:24 24 27;--ink-2:#3f3f46;--ink-2-rgb:63 63 70;--ink-3:#52525b;--ink-3-rgb:82 82 91;--muted:#71717a;--muted-rgb:113 113 122;--faint:#a1a1aa;--faint-rgb:161 161 170;--faint-2:#a1a1aa;--faint-2-rgb:161 161 170;--accent:#2563eb;--accent-rgb:37 99 235;--accent-hi:#3b82f6;--accent-hi-rgb:59 130 246;--accent-lo:#1d4ed8;--accent-lo-rgb:29 78 216;--accent-line:#93c5fd;--accent-line-rgb:147 197 253;--on-accent:#ffffff;--on-accent-rgb:255 255 255;--green:#059669;--green-rgb:5 150 105;--green-hi:#047857;--green-hi-rgb:4 120 87;--red:#dc2626;--red-rgb:220 38 38;--red-hi:#b91c1c;--red-hi-rgb:185 28 28;--red-line:#fca5a5;--red-line-rgb:252 165 165;--amber:#d97706;--amber-rgb:217 119 6;--amber-hi:#92400e;--amber-hi-rgb:146 64 14;--orange:#ea580c;--orange-rgb:234 88 12;--orange-hi:#c2410c;--orange-hi-rgb:194 65 12;--purple:#7c3aed;--purple-rgb:124 58 237;--purple-hi:#6d28d9;--purple-hi-rgb:109 40 217;--on-purple:#ffffff;--on-purple-rgb:255 255 255;--teal:#0d9488;--teal-rgb:13 148 136;--teal-hi:#0f766e;--teal-hi-rgb:15 118 110;--teal-line:#99f6e4;--teal-line-rgb:153 246 228;--cream:#ca8a04;--cream-rgb:234 179 8;--cream-ink:#a16207;--cream-ink-rgb:161 98 7;--tint-rgb:0 0 0;--shadow-rgb:24 24 27;--shadow-k:.22;--scheme:light;color-scheme:light}
:root[data-theme=dark]{--bg:#0f151b;--bg-rgb:15 21 27;--bg-2:#121a22;--bg-2-rgb:18 26 34;--we:#10171e;--we-rgb:16 23 30;--surface:#151d26;--surface-rgb:21 29 38;--surface-2:#19222c;--surface-2-rgb:25 34 44;--raise:#1d2731;--raise-rgb:29 39 49;--hover:#1a242e;--hover-rgb:26 36 46;--sel-bg:#182430;--sel-bg-rgb:24 36 48;--line-soft:#202a35;--line-soft-rgb:32 42 53;--line:#243140;--line-rgb:36 49 64;--line-2:#33445a;--line-2-rgb:51 68 90;--line-3:#4a6178;--line-3-rgb:74 97 120;--ink:#e3eaf1;--ink-rgb:227 234 241;--ink-hi:#dcebf6;--ink-hi-rgb:220 235 246;--ink-2:#c3cfdb;--ink-2-rgb:195 207 219;--ink-3:#a9c4d8;--ink-3-rgb:169 196 216;--muted:#8497a8;--muted-rgb:132 151 168;--faint:#647789;--faint-rgb:100 119 137;--faint-2:#4e6479;--faint-2-rgb:78 100 121;--accent:#4f9fd8;--accent-rgb:79 159 216;--accent-hi:#5eaee4;--accent-hi-rgb:94 174 228;--accent-lo:#3d88c2;--accent-lo-rgb:61 136 194;--accent-line:#3b6f9a;--accent-line-rgb:59 111 154;--on-accent:#06121c;--on-accent-rgb:6 18 28;--green:#4a9e6e;--green-rgb:74 158 110;--green-hi:#9cd5b4;--green-hi-rgb:156 213 180;--red:#c94040;--red-rgb:201 64 64;--red-hi:#ed7777;--red-hi-rgb:237 119 119;--red-line:#7e3434;--red-line-rgb:126 52 52;--amber:#c49b2a;--amber-rgb:196 155 42;--amber-hi:#ead58e;--amber-hi-rgb:234 213 142;--orange:#d4772a;--orange-rgb:212 119 42;--orange-hi:#ef9b52;--orange-hi-rgb:239 155 82;--purple:#9b7bff;--purple-rgb:155 123 255;--purple-hi:#c9b8ff;--purple-hi-rgb:201 184 255;--on-purple:#15102a;--on-purple-rgb:21 16 42;--teal:#45c4b0;--teal-rgb:69 196 176;--teal-hi:#8fe3d4;--teal-hi-rgb:143 227 212;--teal-line:#2c5c5a;--teal-line-rgb:44 92 90;--cream:#d9c98f;--cream-rgb:217 201 143;--cream-ink:#b8ab84;--cream-ink-rgb:184 171 132;--tint-rgb:255 255 255;--shadow-rgb:0 0 0;--shadow-k:1;--scheme:dark;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
button,input,textarea,select{font-family:inherit}
.header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-family:var(--font);font-size:20px;font-weight:400;color:var(--ink-hi)}
.header .sub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:2px}
.hbtn{padding:6px 12px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid var(--line-2);background:none;color:var(--ink-3)}
.hbtn.gold{border-color:rgb(var(--accent-rgb) / 0.4);background:rgb(var(--accent-rgb) / 0.133);color:var(--ink-hi);font-weight:600}
.hbtn.live{border-color:rgb(var(--green-rgb) / .35);color:var(--green)}
.hbtn.live.busy{color:var(--accent);border-color:rgb(var(--accent-rgb) / 0.333)}
/* ═══ HEADER LINKS ═══ */
.links-bar{flex-basis:100%;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding-top:8px;margin-top:2px;border-top:1px solid var(--line);font-size:11px}
.links-bar a{color:var(--ink-3);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px solid transparent}
.links-bar a:hover{color:var(--ink-hi);border-bottom-color:rgb(var(--accent-rgb) / 0.533)}
.links-bar a .lk-ico{color:var(--accent);font-size:10px}
.links-bar .lk-edit{margin-left:auto;border:1px dashed var(--line-2);background:none;color:var(--muted);border-radius:5px;padding:2px 8px;font-size:10px;cursor:pointer}
.links-bar .lk-edit:hover{border-color:var(--accent);color:var(--ink-hi)}
.lk-row{display:grid;grid-template-columns:150px 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
.lk-row input{padding:7px 9px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:12px;outline:none;width:100%}
.lk-row .lk-del{border:1px solid rgb(var(--red-rgb) / .27);background:rgb(var(--red-rgb) / .07);color:var(--red);border-radius:4px;cursor:pointer;height:30px}
@media(max-width:900px){.links-bar{gap:4px 12px;padding-top:6px}.lk-row{grid-template-columns:1fr 28px}.lk-row input:first-child{grid-column:1/-1}}
.main{display:flex;height:calc(100vh - var(--hdr,56px))}
.left{width:260px;min-width:260px;border-right:1px solid var(--line);overflow-y:auto;padding:12px;background:var(--bg-2)}
.left-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.sort-sel{width:100%;margin-bottom:8px;padding:5px 8px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink-3);font-size:11px;outline:none;cursor:pointer}
.sec-head{display:flex;align-items:center;gap:6px;padding:6px 4px;cursor:pointer;user-select:none;border-radius:4px}
.sec-head:hover{background:rgb(var(--tint-rgb) / .03)}
.sec-head .sh-arrow{font-size:9px;color:var(--faint)}
.sec-head .sh-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;flex:1}
.sec-head .sh-count{font-size:9px;padding:1px 7px;border-radius:9px;background:rgb(var(--accent-rgb) / 0.122);color:var(--accent);font-weight:700}
.sec-head.done .sh-count{background:rgb(var(--green-rgb) / .15);color:var(--green)}
.chip .cdate{float:right;font-size:9px;color:var(--accent);font-weight:700;margin-left:6px}
.chip.hl-off{opacity:.25;filter:grayscale(1)}
.chip.hl-on{box-shadow:0 0 0 1px rgb(var(--accent-rgb) / 0.333)}
.sec-div{height:1px;background:var(--line);margin:12px 0 4px}
.sort-sel:hover{border-color:rgb(var(--accent-rgb) / 0.4);color:var(--ink-hi)}
.chip{border-radius:5px;padding:5px 9px;margin-bottom:4px;cursor:grab;font-size:11px;color:var(--ink);transition:all .12s}
.chip:hover{transform:scale(1.01)}
.chip .name{font-weight:600;margin-bottom:1px}
.chip .tags{font-size:9px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:3px}
.chip .tags span{background:rgb(var(--tint-rgb) / .06);border-radius:2px;padding:0 3px}
.chip .tags .tod{color:var(--accent);font-style:italic;background:none}
.cal-wrap{flex:1;overflow-y:auto;padding:14px}
.cal-nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px}
.cal-nav button{background:none;border:1px solid var(--line-2);color:var(--ink-3);width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:14px}
.cal-nav button.cal-today{width:auto;padding:0 10px;font-size:11px;letter-spacing:.4px;color:var(--teal-hi);border-color:var(--teal-line)}
.cal-nav button.cal-today:hover{border-color:var(--teal)}
.cal-nav button.cal-today[disabled]{opacity:.35;cursor:default;border-color:var(--line-2);color:var(--faint)}
.cal-nav h2{font-family:var(--font);font-size:18px;font-weight:400;color:var(--ink-hi);min-width:160px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{text-align:center;font-size:9px;color:var(--faint);padding:5px 0;text-transform:uppercase;letter-spacing:1px}
.cal-day{min-height:102px;border:1px solid rgb(var(--line-rgb) / .53);border-radius:5px;padding:4px;cursor:pointer;transition:all .12s;position:relative}
.cal-day:hover{border-color:var(--line-2)}
.cal-day.sel{border:1.5px solid var(--accent);background:var(--line)}
.cal-day.we{background:rgb(var(--surface-rgb) / .53)}
/* Today: a cool blue ring so it never reads as "selected" (gold) or "shot" (cream). */
.cal-day.today{border:1.5px solid var(--teal);box-shadow:inset 0 0 0 1px rgb(var(--teal-rgb) / .25)}
.cal-day.today .dnum span{color:var(--teal-hi);font-weight:700}
.cal-day.today .dnum span:first-child::after{content:"TODAY";font-size:7px;letter-spacing:.6px;margin-left:5px;padding:1px 4px;border-radius:8px;background:rgb(var(--teal-rgb) / .18);color:var(--teal-hi);vertical-align:1px}
.cal-day.today.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px rgb(var(--teal-rgb) / .45)}
.cal-day .dnum{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.cal-day .dnum span{font-size:11px;font-weight:600;color:var(--ink-3)}
.cal-day.sel .dnum span{color:var(--ink-hi)}
.cal-day.we .dnum span{color:var(--faint)}
.cal-day .badge{font-size:7px;padding:1px 4px;border-radius:8px;font-weight:600}
.cal-day .warn{position:absolute;bottom:2px;right:3px;font-size:8px;letter-spacing:1px}
.mini-chip{font-size:9px;padding:2px 4px;margin-bottom:1px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;color:var(--ink)}
/* highlight states */
.mini-chip.hl-on{filter:saturate(1.6) brightness(1.25);box-shadow:0 0 0 1px currentColor inset,0 0 8px -2px currentColor;font-weight:600}
.mini-chip.hl-off{opacity:.2;filter:grayscale(1)}
/* ═══ COMPLETION: shot = faded yellow, pickup = purple ═══ */
.chip.done,.mini-chip.done,.sc-card.done{background:rgb(var(--cream-rgb) / .13)!important;border-color:rgb(var(--cream-rgb) / .35)!important;color:var(--cream-ink)!important}
.chip.done{border-left-color:var(--cream)!important;opacity:.78}
.chip.done .name{color:var(--cream-ink)}
.chip.done .tags span{opacity:.6}
.mini-chip.done{border-left-color:var(--cream)!important;opacity:.7}
.sc-card.done .sc-name,.sc-card.done .sc-slug{color:var(--cream-ink)}
.sc-card.done .sc-seq{opacity:.6}
.chip.pickup,.mini-chip.pickup,.sc-card.pickup{box-shadow:inset 3px 0 0 var(--purple),0 0 0 1px rgb(var(--purple-rgb) / .35)}
.chip.pickup{border-color:rgb(var(--purple-rgb) / .5)!important}
.pk-tag{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:rgb(var(--purple-rgb) / .18);color:var(--purple-hi);border:1px solid rgb(var(--purple-rgb) / .4);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.pk-note{background:rgb(var(--purple-rgb) / .1);border:1px solid rgb(var(--purple-rgb) / .35);border-left:3px solid var(--purple);border-radius:5px;padding:7px 9px;font-size:11px;color:var(--purple-hi);margin-bottom:8px;line-height:1.5}
.pk-note b{color:var(--purple-hi)}
.flag-acts{float:right;display:inline-flex;gap:3px;margin-left:6px}
.fa{width:18px;height:18px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);color:var(--faint);font-size:10px;line-height:1;cursor:pointer;padding:0;opacity:.45;transition:opacity .12s}
.chip:hover .fa,.sc-h:hover .fa,.fa.on{opacity:1}
.fa:hover{border-color:var(--accent);color:var(--ink-hi)}
.fa.on{background:var(--ink-hi);border-color:var(--ink-hi);color:var(--surface)}
.fa.pk:hover{border-color:var(--purple);color:var(--purple-hi)}
.fa.pk.on{background:var(--purple);border-color:var(--purple);color:var(--on-purple)}
.sc-h .flag-acts{float:none;align-self:center}
.cal-day.alldone{background:rgb(var(--cream-rgb) / .07);border-color:rgb(var(--cream-rgb) / .3)}
.cal-day.alldone .dnum span{color:var(--cream-ink)}
.badge.done-badge{background:rgb(var(--cream-rgb) / .2);color:var(--ink-hi)}
.tog.cmp-shot.pos{border-color:var(--ink-hi);background:rgb(var(--cream-rgb) / .18);color:var(--ink-hi)}
.tog.cmp-pk.pos{border-color:var(--purple);background:rgb(var(--purple-rgb) / .18);color:var(--purple-hi)}
@media print{.flag-acts{display:none}}
.cal-day.hl-dim{opacity:.55}
.cal-day.hl-hit{border-color:rgb(var(--accent-rgb) / 0.333)}
.dnum .hl-count{font-size:7px;padding:1px 4px;border-radius:8px;font-weight:700;background:rgb(var(--accent-rgb) / 0.2);color:var(--ink-hi);margin-left:3px}
/* highlight bar */
.hl-bar{margin-top:12px;background:rgb(var(--surface-rgb) / .53);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.hl-head{padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.hl-head:hover{background:rgb(var(--tint-rgb) / .02)}
.hl-head .hl-t{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;flex:1}
.hl-head .hl-badge{font-size:9px;padding:2px 7px;border-radius:9px;background:rgb(var(--accent-rgb) / 0.133);color:var(--ink-hi);font-weight:600}
.hl-head .hl-arrow{color:var(--faint);font-size:10px}
.hl-body{padding:4px 12px 12px;border-top:1px solid var(--line)}
.hl-cat{margin-bottom:8px}
.hl-cat .hl-label{font-size:9px;color:var(--faint);text-transform:uppercase;margin-bottom:3px;letter-spacing:.5px}
.hl-summary{margin-top:8px;padding:9px 10px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;font-size:11px;color:var(--ink-3);line-height:1.7}
.hl-summary .hs-name{color:var(--ink-hi);font-weight:600}
.hl-summary .hs-dates{color:var(--muted);font-size:10px}
.hl-clear{padding:3px 10px;border-radius:4px;border:1px solid rgb(var(--red-rgb) / .3);background:rgb(var(--red-rgb) / .08);color:var(--red);font-size:10px;cursor:pointer;font-weight:600}
.stats{margin-top:14px;padding:12px;background:rgb(var(--surface-rgb) / .53);border-radius:7px;border:1px solid var(--line);display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stats .s{text-align:center}
.stats .s .n{font-size:18px;font-weight:700}
.stats .s .l{font-size:8px;color:var(--muted);text-transform:uppercase}
/* Shot progress strip: lives in the header so it is always at the top (desktop and phone). */
.shot-strip{flex-basis:100%;display:flex;gap:10px;justify-content:center;padding-top:8px;margin-top:2px;border-top:1px solid var(--line-soft)}
.shot-strip[hidden]{display:none}
.shot-card{flex:1 1 0;min-width:0;max-width:430px;padding:6px 11px 7px;background:rgb(var(--surface-rgb) / .6);border:1px solid var(--line);border-radius:8px}
.shot-card .sc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.shot-card .sc-l{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.shot-card .sc-pc{font-size:13px;font-weight:700;color:var(--ink-3)}
.shot-card .sc-n{font-size:17px;font-weight:700;color:var(--ink-hi);line-height:1.25;white-space:nowrap}
.shot-card .sc-bar{height:4px;margin-top:5px;background:var(--line);border-radius:3px;overflow:hidden}
.shot-card .sc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi));border-radius:3px}
.shot-card.done .sc-n,.shot-card.done .sc-pc{color:var(--green)}
.shot-card.done .sc-bar i{background:var(--green)}
.shot-card.total{flex:1.35 1 0;text-align:center;background:linear-gradient(180deg,rgb(var(--accent-rgb) / .16),rgb(var(--surface-rgb) / .6));border-color:var(--accent-line)}
.shot-card.total .sc-top{justify-content:center}
.shot-card.total .sc-l{color:var(--ink-3)}
.shot-card.total .sc-n{font-size:26px;line-height:1.1;margin-top:2px}
.shot-card .sc-sub{font-size:8px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){.shot-card:not(.total) .sc-top{flex-direction:column;align-items:flex-start;gap:0}.shot-card:not(.total) .sc-n{font-size:13px}.shot-card.total .sc-n{font-size:23px}.shot-card .sc-sub{font-size:7px}}
@media(max-width:640px){.shot-strip{gap:6px;padding-top:6px}.shot-card{padding:5px 8px 6px}.shot-card .sc-l{font-size:7.5px;letter-spacing:.6px}.shot-card .sc-pc{font-size:12px}.shot-card .sc-n{font-size:15px}.shot-card .sc-bar{margin-top:4px}}
.daypanel{position:fixed;right:0;top:0;bottom:0;width:460px;background:var(--surface-2);border-left:1px solid var(--line-2);z-index:900;overflow-y:auto;box-shadow:-8px 0 32px rgb(var(--shadow-rgb) / calc(.4 * var(--shadow-k)));display:flex;flex-direction:column}
.daypanel .dp-head{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.daypanel .dp-head h2{font-family:var(--font);font-size:18px;color:var(--ink-hi);font-weight:400}
.daypanel .dp-body{flex:1;overflow-y:auto;padding:16px}
.dp-section{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.dp-section:first-child{margin-top:0}
.dp-callsheet{padding:8px;background:rgb(var(--bg-rgb) / .53);border-radius:5px;border:1px solid var(--line-2);font-size:10px;color:var(--ink-3);line-height:1.6;margin-top:8px}
.dp-callsheet strong{color:var(--ink-3)}
/* call sheet */
.cs-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cs-stat{flex:1;min-width:76px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px}
.cs-stat .v{font-size:15px;font-weight:700;color:var(--ink-hi);line-height:1.2}
.cs-stat .l{font-size:8px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-top:1px}
.cs-warn{padding:7px 10px;border-radius:5px;font-size:10px;margin-bottom:5px;line-height:1.5}
.cs-warn.amber{background:rgb(var(--amber-rgb) / .1);border:1px solid rgb(var(--amber-rgb) / .3);color:var(--ink-hi)}
.cs-warn.red{background:rgb(var(--red-rgb) / .1);border:1px solid rgb(var(--red-rgb) / .3);color:var(--red-hi)}
.sc-card{border:1px solid var(--line-2);border-radius:6px;margin-bottom:6px;overflow:hidden;background:var(--surface)}
.sc-card .sc-h{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;cursor:pointer}
.sc-card .sc-h:hover{background:rgb(var(--tint-rgb) / .02)}
.sc-seq{font-size:9px;font-weight:700;color:var(--surface);background:var(--accent);border-radius:3px;padding:2px 5px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.sc-t{flex:1;min-width:0}
.sc-t .sc-name{font-size:12px;font-weight:600;color:var(--ink)}
.sc-t .sc-slug{font-size:9px;color:var(--muted);font-style:italic;margin-top:1px;word-break:break-word}
.sc-len{font-size:9px;color:var(--muted);white-space:nowrap;flex-shrink:0;margin-top:2px}
.sc-body{padding:0 10px 10px;border-top:1px solid var(--line);font-size:10px;line-height:1.65;color:var(--ink-3)}
.sc-body p{margin:8px 0 0;color:var(--ink-3);font-size:10.5px;line-height:1.7}
.sc-dept{margin-top:8px}
.sc-dept .dl{font-size:8px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.sc-dept .dv{color:var(--ink-3);font-size:10px}
.cast-row{display:flex;align-items:baseline;gap:7px;padding:4px 8px;border-radius:4px;font-size:11px}
.cast-row:nth-child(odd){background:rgb(var(--surface-rgb) / .5)}
.cast-row .cr-n{color:var(--ink-hi);font-weight:600;min-width:96px}
.cast-row .cr-a{color:var(--muted);font-size:10px;flex:1}
.cast-row .cr-s{color:var(--faint);font-size:9px}
.loc-row{padding:6px 9px;background:var(--bg);border:1px solid var(--line-2);border-radius:5px;margin-bottom:4px;font-size:11px}
.loc-row .lr-n{color:var(--ink-hi);font-weight:600}
.loc-row .lr-a{color:var(--muted);font-size:9.5px;margin-top:2px}
.loc-row .lr-s{font-size:9px;margin-top:2px}
.roll{font-size:10px;color:var(--ink-3);line-height:1.7;padding:7px 9px;background:var(--bg);border:1px solid var(--line-2);border-radius:5px;margin-bottom:5px}
.roll b{color:var(--ink-3);text-transform:uppercase;font-size:8px;letter-spacing:1px;display:block;margin-bottom:1px}
.res-box{padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--line-2);margin-bottom:12px}
.res-box .rb-title{font-size:11px;color:var(--ink-hi);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.res-box .rb-hint{font-size:10px;color:var(--muted);margin-bottom:8px}
.res-cat{margin-bottom:8px}
.res-cat .rc-label{font-size:9px;color:var(--faint);text-transform:uppercase;margin-bottom:3px}
.tog-row{display:flex;flex-wrap:wrap;gap:4px}
/* Three-state toggles: off (grey), on/positive (colored), negative/exclude (red) */
.tog{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .12s;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);user-select:none}
.tog.pos{border-color:var(--tc,var(--amber));background:color-mix(in srgb,var(--tc,var(--amber)) 13%,transparent);color:var(--ink-hi)}
.tog.neg{border-color:var(--red);background:rgb(var(--red-rgb) / .15);color:var(--red);text-decoration:line-through}
.tog.ro{cursor:default;opacity:.85}
.ro-chip{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-3);margin:0 3px 3px 0}
.match-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.match-item .mi-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer}
.match-item .mi-info .mi-name{font-size:11px;color:var(--ink);font-weight:500}
.match-item .mi-info .mi-meta{font-size:9px;color:var(--muted);margin-top:2px}
.match-item .mi-add{padding:4px 8px;border-radius:4px;border:1px solid rgb(var(--green-rgb) / .27);background:rgb(var(--green-rgb) / .07);color:var(--green);font-size:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.asgn-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.asgn-row .ar-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:11px;color:var(--ink);font-weight:500}
.asgn-row .ar-rem{padding:3px 7px;border-radius:3px;border:1px solid rgb(var(--red-rgb) / .27);background:rgb(var(--red-rgb) / .07);color:var(--red);font-size:9px;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgb(var(--shadow-rgb) / calc(.8 * var(--shadow-k)));z-index:1000;display:flex;justify-content:center;align-items:center}
.modal{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;width:92%;max-width:600px;max-height:88vh;overflow-y:auto;padding:24px}
.modal h2{font-family:var(--font);font-size:20px;color:var(--ink-hi);font-weight:400;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.modal label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
.modal input,.modal textarea{width:100%;padding:7px 10px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:13px;outline:none}
.modal textarea{resize:vertical}
.modal .field{margin-bottom:10px}
.modal .ro-note{font-size:9px;color:var(--faint);font-style:italic;margin-top:2px}
.mbtn{padding:7px 20px;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600}
.mbtn.gold{border:none;background:var(--accent);color:var(--surface)}
.mbtn.ghost{border:1px solid var(--line-2);background:none;color:var(--ink-3)}
.mbtn.red{border:1px solid rgb(var(--red-rgb) / .27);background:rgb(var(--red-rgb) / .07);color:var(--red);font-size:11px}
.settings-wrap{display:flex;overflow:hidden;border-radius:12px;max-height:80vh}
.settings-nav{width:180px;min-width:180px;border-right:1px solid var(--line-2);padding:20px 0;background:var(--surface);overflow-y:auto}
.settings-nav .sn-title{padding:0 14px 14px;font-size:16px;color:var(--ink-hi);font-family:var(--font)}
.settings-nav .sn-item{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--muted);border-left:3px solid transparent;transition:all .12s}
.settings-nav .sn-item.active{color:var(--ink-hi);background:var(--line);border-left-color:var(--accent)}
.settings-body{flex:1;padding:20px;overflow-y:auto}
.cx-row{display:flex;gap:5px}
.cx-btn{width:48px;height:30px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer}
.legend{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.legend .lg-title{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.legend .lg-item{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.legend .lg-dot{width:8px;height:8px;border-radius:2px}
.legend .lg-label{font-size:9px;color:var(--muted)}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:6px;font-size:11px;z-index:2000;transition:all .3s;opacity:0;transform:translateY(10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}
.toast.info{background:var(--accent);color:var(--surface)}
.cat-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;margin-bottom:1px}
.cat-row:nth-child(odd){background:rgb(var(--surface-rgb) / .53)}
.cat-row .cr-name{flex:1;font-size:12px;color:var(--ink)}
.cat-row .cr-count{font-size:9px;color:var(--faint)}
.cat-row button{padding:2px 7px;border-radius:3px;font-size:10px;cursor:pointer}
.cat-row .cr-ren{border:1px solid var(--line-2);background:none;color:var(--ink-3)}
.cat-row .cr-del{border:1px solid rgb(var(--red-rgb) / .27);background:rgb(var(--red-rgb) / .07);color:var(--red)}
.cat-row .cr-up,.cat-row .cr-dn{border:1px solid var(--line-2);background:none;color:var(--muted);padding:2px 5px;font-size:9px}
/* ═══ SIDEBAR TOGGLE / DRAWER ═══ */
.sb-backdrop{display:none;position:fixed;inset:0;background:rgb(var(--shadow-rgb) / calc(.6 * var(--shadow-k)));z-index:790}
.left{transition:transform .18s ease}
.left:not(.open){display:none}

/* ═══ MOBILE ═══ */
@media (max-width:900px){
  .header{padding:10px 12px;gap:6px}
  .header h1{font-size:17px}
  .header .sub{font-size:8px;letter-spacing:1.2px}
  .hbtn{padding:8px 11px;font-size:12px}

  .main{height:calc(100vh - var(--hdr,52px))}

  /* sidebar becomes a slide-in drawer */
  .left{position:fixed;left:0;top:0;bottom:0;width:82%;max-width:320px;z-index:800;
        box-shadow:6px 0 28px rgb(var(--shadow-rgb) / calc(.6 * var(--shadow-k)));padding-top:14px}
  .left.open{display:block}
  .sb-backdrop.show{display:block}

  .cal-wrap{padding:10px 8px}
  .cal-nav h2{font-size:16px;min-width:120px}
  .cal-nav button{width:34px;height:34px}
  .cal-grid{gap:1px}
  .cal-day{min-height:78px;padding:3px;border-radius:4px}
  .cal-day .dnum span{font-size:10px}
  .mini-chip{font-size:8px;padding:2px 3px;line-height:1.25}
  .cal-head{font-size:8px;padding:4px 0}

  /* day panel takes the full screen */
  .daypanel{width:100%;max-width:100%;left:0}
  .daypanel .dp-head{padding:14px 14px}
  .daypanel .dp-body{padding:14px}

  /* bigger tap targets */
  .tog{padding:7px 12px;font-size:12px}
  .sort-sel{padding:8px;font-size:12px}
  .sec-head{padding:9px 4px}
  .mi-add,.ar-rem{padding:7px 10px;font-size:11px}

  /* modals fill the screen */
  .modal{width:96%;max-width:96%;max-height:92vh;padding:18px;border-radius:10px}
  .modal h2{font-size:18px}
  .settings-wrap{flex-direction:column;max-height:88vh}
  .settings-nav{width:100%;min-width:0;display:flex;flex-wrap:wrap;gap:2px;padding:10px;
                border-right:none;border-bottom:1px solid var(--line-2)}
  .settings-nav .sn-title{width:100%;padding:0 4px 8px}
  .settings-nav .sn-item{border-left:none;border-radius:5px;padding:7px 11px;font-size:12px}
  .settings-nav .sn-item.active{border-left:none;box-shadow:inset 0 0 0 1px rgb(var(--accent-rgb) / 0.4)}
  .settings-body{padding:14px}

  .stats{gap:12px;padding:10px}
  .stats .s .n{font-size:16px}
  .hl-body{padding:4px 10px 12px}
  .toast{left:12px;right:12px;bottom:12px;text-align:center}
  .cat-row{flex-wrap:wrap}
  .cs-stat{min-width:64px}
  .cast-row{flex-wrap:wrap}
}

/* Agenda list: phones only */
.agenda{display:none}

/* ═══ PHONES ═══ */
@media (max-width:600px){
  /* iOS counts the URL bar in 100vh; dvh is the height you can actually see */
  .main{height:calc(100dvh - var(--hdr,52px))}
  /* iPhones zoom the whole page when you tap a field smaller than 16px */
  input,select,textarea{font-size:16px!important}

  /* header: title / buttons / one swipeable line of links / tabs */
  .header{padding:8px 10px 8px;gap:7px}
  .header h1{font-size:16px}
  .header .sub{display:none}
  .today-date{font-size:9px;min-width:40px;padding-right:8px}
  .hdr-acts{flex-wrap:nowrap!important;gap:4px!important;width:100%}
  .hdr-acts .hbtn{flex:1 1 0;min-width:0;padding:8px 4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .links-bar{flex-wrap:nowrap;overflow-x:auto;gap:0 16px;padding-top:7px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
             -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .links-bar::-webkit-scrollbar{display:none}
  .links-bar a,.links-bar .lk-edit{flex:0 0 auto;white-space:nowrap}
  .links-bar a{padding:4px 0;font-size:12px}
  .app-tab{padding:9px 13px;font-size:12px}

  /* calendar: seven equal columns, compact cells, the list below does the reading */
  .cal-wrap{padding:8px 6px 20px}
  .cal-nav{gap:8px;margin-bottom:8px}
  .cal-nav h2{font-size:17px;min-width:0;flex:1}
  .cal-grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .cal-day{min-width:0;min-height:54px;padding:3px 2px;overflow:hidden}
  .cal-day .dnum{flex-wrap:wrap;gap:1px}
  .cal-day .dnum span{font-size:11px}
  .cal-day .dnum .badge{font-size:9px;padding:0 4px;line-height:14px}
  .cal-day.today .dnum span:first-child::after{display:none}
  .cal-day .dnum .badge.done-badge{font-size:0}
  .cal-day .dnum .badge.done-badge::before{content:"\2713";font-size:10px}
  .hide-sm{display:none}
  .mini-chip{font-size:0;padding:0;height:5px;margin-bottom:2px;border-radius:2px;border-left-width:0!important;background:currentColor!important;opacity:.75}
  .mini-chip.done{opacity:.35}
  .mini-chip.hl-on{height:7px;opacity:1}
  .mini-chip.hl-off{opacity:.12}
  .cal-day .warn{font-size:7px;bottom:1px;right:2px}
  .cal-head{font-size:8px;letter-spacing:.5px}

  .agenda{display:block;margin-top:14px}
  .ag-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 2px 8px}
  .ag-empty{font-size:12px;color:var(--faint);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  .ag-day{display:flex;gap:10px;align-items:flex-start;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 10px 10px 8px;margin-bottom:7px;cursor:pointer}
  .ag-day:active{background:var(--raise)}
  .ag-day.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px rgb(var(--teal-rgb) / .25)}
  .ag-day.sel{border-color:var(--accent)}
  .ag-day.past{opacity:.55}
  .ag-day.alldone{background:rgb(var(--cream-rgb) / .06)}
  .ag-day.hl-dim{opacity:.3}
  .ag-date{flex:0 0 42px;text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:1px}
  .ag-dow{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .ag-num{font-family:var(--font);font-size:24px;line-height:1.05;color:var(--ink-hi)}
  .ag-day.today .ag-num,.ag-day.today .ag-dow{color:var(--teal-hi)}
  .ag-today{font-size:7px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:3px;padding:1px 5px;border-radius:8px;background:rgb(var(--teal-rgb) / .18);color:var(--teal-hi)}
  .ag-body{flex:1;min-width:0}
  .ag-scene{border-left:3px solid var(--faint);padding:3px 0 3px 8px;margin-bottom:4px}
  .ag-scene:last-child{margin-bottom:0}
  .ag-name{display:block;font-size:13px;color:var(--ink);line-height:1.3}
  .ag-loc{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .ag-pk{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--purple-hi);margin-top:2px}
  .ag-scene.done .ag-name{color:var(--cream-ink)}
  .ag-scene.hl-off{opacity:.35}
  .ag-scene.hl-on .ag-name{font-weight:600}
  .ag-warn{position:absolute;top:8px;right:9px;font-size:10px}

  .stats{gap:10px 14px}
  .left{width:88%}

  /* scene editor: full screen, Save / Close pinned to the bottom */
  .modal-bg{align-items:stretch}
  .modal{width:100%!important;max-width:100%!important;max-height:none!important;height:100dvh;border-radius:0!important;border:0;padding:16px 14px 0!important}
  .ed-actions{position:sticky;bottom:0;z-index:3;background:var(--surface-2);margin:14px -14px 0!important;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 16px -8px rgb(var(--shadow-rgb) / calc(.6 * var(--shadow-k)))}
  .ed-actions .mbtn{padding:11px 16px;font-size:14px}
  #lockMount .modal{width:auto!important;max-width:340px!important;height:auto;border-radius:12px!important;border:1px solid var(--line-2);margin:auto 16px;padding:22px 18px!important}
}
@media print{
  .header,.left,.sb-backdrop,.res-box,.dp-head button,.cal-wrap{display:none!important}
  .daypanel{position:static;width:100%;border:none;box-shadow:none;background:#fff;color:#000}
  .daypanel *{color:#000!important;background:#fff!important;border-color:#ccc!important}
}

/* ═══ THEME: slate & ocean (2026-09-22). Colours and polish only; delete this block and
   restore the backup files to go back to the warm theme. ═══ */
::selection{background:rgb(var(--accent-rgb) / 0.333);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-2);background-clip:padding-box;border:2px solid transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgb(var(--accent-rgb) / 0.133)}

/* header */
.header{background:linear-gradient(180deg,var(--surface) 0%,var(--bg-2) 100%);border-bottom-color:var(--line);box-shadow:0 8px 20px -14px rgb(var(--shadow-rgb) / calc(.9 * var(--shadow-k)))}
.header h1{color:var(--ink-hi);letter-spacing:.8px}
.links-bar{border-top-color:var(--line-soft)}
.hbtn{border-radius:7px;transition:border-color .15s,background .15s,color .15s}
.hbtn:hover{border-color:var(--line-3);color:var(--ink);background:var(--hover)}
.hbtn.gold{background:linear-gradient(180deg,rgb(var(--accent-rgb) / 0.188),rgb(var(--accent-rgb) / 0.094));border-color:rgb(var(--accent-rgb) / 0.502);color:var(--ink-hi)}
.hbtn.gold:hover{background:linear-gradient(180deg,rgb(var(--accent-rgb) / 0.251),rgb(var(--accent-rgb) / 0.133))}
.app-tabs{background:var(--bg);border-color:var(--line);border-radius:9px}
.app-tab{border-radius:7px;transition:background .15s,color .15s}
.app-tab:not(.active):hover{color:var(--ink-2);background:var(--hover)}
.app-tab.active{background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));color:var(--on-accent);box-shadow:0 3px 12px -5px rgb(var(--accent-rgb) / 0.8)}
.mbtn{border-radius:7px;transition:filter .15s,background .15s}
.mbtn.gold{background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));color:var(--on-accent);box-shadow:0 3px 12px -5px rgb(var(--accent-rgb) / 0.667)}
.mbtn.gold:hover{filter:brightness(1.08)}

/* calendar */
.cal-nav button{border-radius:8px;transition:border-color .15s,color .15s}
.cal-nav button:hover:not([disabled]){border-color:var(--accent);color:var(--ink-hi)}
.cal-day{border-radius:8px;background:var(--bg-2);transition:border-color .12s,background .12s}
.cal-day:hover{border-color:var(--line-2)}
.cal-day.we{background:var(--we)}
.cal-day.sel{background:var(--sel-bg);box-shadow:0 0 0 1px rgb(var(--accent-rgb) / 0.333),0 6px 18px -10px rgb(var(--accent-rgb) / 0.667)}
.cal-day.today{box-shadow:inset 0 0 0 1px rgb(var(--teal-rgb) / .3),0 0 14px -6px rgb(var(--teal-rgb) / .7)}
.badge.done-badge{color:var(--cream-ink)}
.stats{background:linear-gradient(180deg,var(--surface),var(--bg-2));border-color:var(--line);border-radius:10px}

/* panels, drawers, dialogs */
.modal{box-shadow:0 30px 70px -20px rgb(var(--shadow-rgb) / calc(.85 * var(--shadow-k)));border-color:var(--line)}
.modal-bg{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.tm-modal{box-shadow:0 30px 70px -20px rgb(var(--shadow-rgb) / calc(.85 * var(--shadow-k)));border-color:var(--line)}
.tm-modal-bg{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.toast{border-radius:10px;box-shadow:0 12px 30px -10px rgb(var(--shadow-rgb) / calc(.8 * var(--shadow-k)))}

/* task manager */
.tm-subtab{border-radius:8px;transition:border-color .15s,background .15s,color .15s}
.tm-subtab:not(.active):hover{border-color:var(--line-3);color:var(--ink-2)}
.tm-subtab.active{background:rgb(var(--accent-rgb) / 0.122);border-color:var(--accent);color:var(--ink-hi)}
.tm-table th{background:var(--surface);color:var(--ink-3)}
.tm-table tr.tm-row:hover td{background:rgb(var(--accent-rgb) / 0.027)}
.tm-chip{transition:border-color .15s,background .15s}
.tm-plus{transition:all .15s}
.tm-save.saved{color:var(--green-hi)}
@media(min-width:761px){.tm-table{box-shadow:0 10px 28px -18px rgb(var(--shadow-rgb) / calc(.9 * var(--shadow-k)))}}
@media(max-width:760px){.tm-table tr.tm-row{box-shadow:0 8px 20px -14px rgb(var(--shadow-rgb) / calc(.9 * var(--shadow-k)));border-color:var(--line)}
  .tm-seq .tm-seqcell,.tm-people .tm-namecell{background:linear-gradient(180deg,var(--raise),var(--surface-2))}}
@media(max-width:600px){.ag-day{box-shadow:0 8px 20px -14px rgb(var(--shadow-rgb) / calc(.9 * var(--shadow-k)))}
  .ag-day.today{box-shadow:inset 0 0 0 1px rgb(var(--teal-rgb) / .3),0 0 16px -6px rgb(var(--teal-rgb) / .6)}}

/* ═══ MODERN UI (2026-10-16) — design.md "Taste Standard", Electric Blue accent.
   Look only: every colour is a token from :root (light) or [data-theme=dark] (the
   old slate & ocean values). To go back, restore "7 - Backup before modern UI". ═══ */
:root{--font:'Geist','Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Geist Mono','JetBrains Mono',ui-monospace,monospace;
  --r-sm:8px;--r:10px;--r-lg:16px;--r-xl:20px;--ease:cubic-bezier(.22,1,.36,1);
  --whisper:0 20px 40px -15px rgb(var(--shadow-rgb) / calc(.25 * var(--shadow-k)));
  --lift:0 1px 2px rgb(var(--shadow-rgb) / calc(.18 * var(--shadow-k))),0 8px 24px -12px rgb(var(--shadow-rgb) / calc(.35 * var(--shadow-k)));
  --ring:0 0 0 3px rgb(var(--accent-rgb) / .2)}
html{-webkit-text-size-adjust:100%;overflow-anchor:none}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em;min-height:100dvh}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:not([disabled]):active{transform:scale(.98)}
::selection{background:rgb(var(--accent-rgb) / .22);color:var(--ink-hi)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)!important;box-shadow:var(--ring)}
::-webkit-scrollbar-thumb{background:var(--line-2);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--line-3);background-clip:padding-box}
*{scrollbar-color:var(--line-2) transparent}

/* header — calm glass bar, one row of controls */
.header{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);box-shadow:none;padding:12px 20px;gap:10px 14px;position:relative;z-index:50}
.header h1{font-family:var(--font);font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink-hi)}
.header .sub{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-top:1px}
.today-date{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--accent);border-right-color:var(--line)}
.links-bar{border-top-color:var(--line);font-size:12px}
.links-bar a{color:var(--ink-3)}
.links-bar a:hover{color:var(--accent);border-bottom-color:rgb(var(--accent-rgb) / .5)}
.links-bar .lk-edit{border-radius:var(--r-sm);border-color:var(--line-2);padding:3px 10px}

.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 13px;border-radius:var(--r);font-size:12.5px;font-weight:500;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .12s var(--ease)}
.hbtn:hover{background:var(--hover);border-color:var(--line-3);color:var(--ink-hi)}
.hbtn.gold,.hbtn.gold:hover{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hbtn.gold:hover{filter:brightness(1.07)}
.hbtn.live{color:var(--green);border-color:rgb(var(--green-rgb) / .35)}
.hbtn.live.busy{color:var(--accent);border-color:rgb(var(--accent-rgb) / .4)}
.hbtn.live.busy .ico{animation:hpSpin 1s linear infinite}
@keyframes hpSpin{to{transform:rotate(360deg)}}
.hbtn.icon{padding:0;width:34px}
.ico{width:15px;height:15px;flex:none;display:inline-block;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app-tabs{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.app-tab{border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);transition:background .2s var(--ease),color .2s var(--ease)}
.app-tab:not(.active):hover{background:transparent;color:var(--ink-hi)}
.app-tab.active{background:var(--surface);color:var(--ink-hi);box-shadow:var(--lift)}
:root[data-theme=dark] .app-tab.active{background:var(--accent);color:var(--on-accent)}

/* sidebar */
.left{background:var(--surface);border-right:1px solid var(--line);padding:14px}
.left-title,.sec-head .sh-title,.hl-head .hl-t,.dp-section,.lg-title{letter-spacing:.08em;font-weight:600;color:var(--muted)}
.sort-sel{border-radius:var(--r-sm);border-color:var(--line-2);background:var(--surface);color:var(--ink-2);min-height:32px}
.sec-head{border-radius:var(--r-sm);padding:7px 6px}
.sec-head:hover{background:var(--hover)}
.sec-head .sh-count{font-family:var(--mono);font-weight:600}
.chip{border-radius:var(--r);padding:7px 10px;margin-bottom:6px;font-size:11.5px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.chip:hover{transform:translateY(-1px);box-shadow:var(--lift)}
.chip .name{font-weight:600;letter-spacing:-.01em}
.chip .tags span{background:rgb(var(--tint-rgb) / .06);border-radius:5px;padding:0 5px}
.chip .cdate{font-family:var(--mono);font-weight:600}
.sec-div{background:var(--line)}

/* calendar */
.cal-wrap{padding:18px 20px}
.cal-nav{gap:10px;margin-bottom:16px}
.cal-nav h2{font-family:var(--font);font-size:20px;font-weight:700;letter-spacing:-.025em;color:var(--ink-hi);min-width:190px}
.cal-nav button{width:34px;height:34px;border-radius:var(--r);background:var(--surface);border-color:var(--line-2);color:var(--ink-2)}
.cal-nav button:hover:not([disabled]){border-color:var(--accent);color:var(--accent);background:var(--surface)}
.cal-nav button.cal-today{padding:0 12px;font-weight:600}
.cal-grid{gap:6px}
.cal-head{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.cal-day{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:6px;min-height:108px;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
.cal-day:hover{border-color:var(--line-3);box-shadow:var(--lift)}
.cal-day.we{background:var(--we)}
.cal-day.sel{border:1.5px solid var(--accent);background:var(--sel-bg);box-shadow:var(--ring)}
.cal-day.today{border:1.5px solid var(--teal);box-shadow:0 0 0 3px rgb(var(--teal-rgb) / .14)}
.cal-day.today.sel{border-color:var(--accent);box-shadow:var(--ring)}
.cal-day .dnum span{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3)}
.cal-day .badge{font-family:var(--mono);border-radius:6px;padding:1px 5px}
.mini-chip{border-radius:6px;padding:2px 5px;margin-bottom:2px;font-weight:500}
@media(min-width:601px){:root:not([data-theme=dark]) .mini-chip:not(.done){color:var(--ink)!important}}
.cal-day.alldone{background:rgb(var(--cream-rgb) / .08)}

/* cards: stats, highlight bar, call sheet */
.stats,.hl-bar,.res-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--whisper)}
.stats{padding:14px 18px;gap:22px}
.stats .s .n{font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats .s .l{font-size:9.5px;letter-spacing:.08em;margin-top:2px}
.hl-head{padding:11px 14px}
.hl-head:hover{background:var(--hover)}
.hl-body{border-top-color:var(--line)}
.hl-summary,.roll,.loc-row,.dp-callsheet,.cs-stat{background:var(--bg);border-color:var(--line);border-radius:var(--r)}
.hl-clear{border-radius:var(--r-sm)}
.shot-card{background:var(--surface);border-color:var(--line);border-radius:12px;box-shadow:var(--whisper)}
.shot-card .sc-n,.shot-card .sc-pc{letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.shot-card .sc-n{font-weight:700}
.shot-card .sc-bar{background:var(--raise);height:5px;border-radius:5px}
.shot-card .sc-bar i{background:var(--accent);border-radius:5px;transition:width .6s var(--ease)}
.shot-card.total{background:var(--surface);border-color:rgb(var(--accent-rgb) / .35);box-shadow:var(--whisper),inset 0 0 0 1px rgb(var(--accent-rgb) / .08)}
.shot-strip{border-top-color:var(--line)}

/* day panel (call sheet) */
.daypanel{background:var(--surface-2);border-left:1px solid var(--line);box-shadow:-24px 0 48px -24px rgb(var(--shadow-rgb) / calc(.5 * var(--shadow-k)))}
.daypanel .dp-head{border-bottom-color:var(--line);padding:16px 20px}
.daypanel .dp-head h2{font-family:var(--font);font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink-hi)}
.daypanel .dp-body{padding:18px 20px;overscroll-behavior:contain}
.dp-section{border-bottom-color:var(--line);font-size:10px;margin:18px 0 8px}
.cs-stat{padding:9px 11px}
.cs-stat .v{letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cs-warn{border-radius:var(--r)}
.sc-card{background:var(--surface);border-color:var(--line);border-radius:12px;margin-bottom:8px;transition:border-color .2s var(--ease)}
.sc-card:hover{border-color:var(--line-2)}
.sc-card .sc-h{padding:10px 12px}
.sc-card .sc-h:hover{background:var(--hover)}
.sc-seq{font-family:var(--mono);border-radius:6px;padding:2px 6px;color:#fff}
:root[data-theme=dark] .sc-seq{color:var(--surface)}
.sc-body{border-top-color:var(--line)}
.cast-row{border-radius:var(--r-sm)}
.cast-row:nth-child(odd){background:rgb(var(--tint-rgb) / .03)}
.tog{border-radius:999px;padding:5px 12px;background:var(--surface);border-color:var(--line-2);color:var(--ink-3);transition:background .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease)}
.tog:hover{border-color:var(--line-3)}
.tog.pos{color:var(--ink-hi)}
.ro-chip{border-radius:999px;background:var(--raise);border-color:var(--line)}
.match-item .mi-info,.asgn-row .ar-info{border-radius:var(--r)}
.match-item .mi-add,.asgn-row .ar-rem{border-radius:var(--r-sm)}
.fa{border-color:var(--line-2);background:var(--surface)}

/* dialogs */
.modal-bg,.tm-modal-bg{background:rgb(var(--shadow-rgb) / calc(.7 * var(--shadow-k)));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal,.tm-modal{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-xl);padding:28px;overscroll-behavior:contain;
  box-shadow:0 40px 80px -24px rgb(var(--shadow-rgb) / calc(.55 * var(--shadow-k)))}
.modal h2,.tm-modal h2,.tm-lock h2,.settings-nav .sn-title{font-family:var(--font);font-weight:700;letter-spacing:-.025em;color:var(--ink-hi)}
.modal h2{font-size:20px;border-bottom-color:var(--line);padding-bottom:12px;margin-bottom:18px}
.modal label{font-size:10px;letter-spacing:.08em;font-weight:600;color:var(--muted);margin-bottom:6px}
.modal input,.modal textarea,.lk-row input,.tm-search,.tm-select,.tm-input,.tm-textarea{border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 12px;font-size:13px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.modal .field{margin-bottom:14px}
.mbtn{min-height:38px;padding:0 20px;border-radius:var(--r);font-size:13px;font-weight:600;transition:filter .2s var(--ease),background .2s var(--ease),transform .12s var(--ease)}
.mbtn.gold{background:var(--accent);color:#fff;box-shadow:none}
.mbtn.gold:hover{filter:brightness(1.07)}
.mbtn.ghost{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.mbtn.ghost:hover{background:var(--hover);color:var(--ink-hi)}
.mbtn.red{border-radius:var(--r);min-height:34px}
.settings-wrap{border-radius:var(--r-xl)}
.settings-nav{background:var(--raise);border-right-color:var(--line)}
.settings-nav .sn-title{font-size:16px}
.settings-nav .sn-item{border-radius:var(--r-sm);margin:1px 8px;border-left:0;padding:8px 12px;font-weight:500}
.settings-nav .sn-item:hover{background:var(--hover);color:var(--ink-hi)}
.settings-nav .sn-item.active{background:var(--surface);color:var(--ink-hi);box-shadow:var(--lift)}
.settings-body h3{font-family:var(--font)!important;font-weight:700!important;letter-spacing:-.02em}
.cat-row{border-radius:var(--r-sm)}
.cat-row:nth-child(odd){background:rgb(var(--tint-rgb) / .03)}
.cat-row button{border-radius:6px}
.toast{border-radius:12px;padding:11px 16px;font-size:12.5px;font-weight:500;box-shadow:var(--lift)}
.toast.info{color:#fff}

/* task manager */
.tm-page{background:var(--bg);padding:18px 22px 48px}
.tm-subtab{border-radius:var(--r);background:var(--surface);border-color:var(--line-2);color:var(--ink-3);padding:8px 15px}
.tm-subtab:not(.active):hover{border-color:var(--line-3);color:var(--ink-hi)}
.tm-subtab.active{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme=dark] .tm-subtab.active{background:rgb(var(--accent-rgb) / .12);color:var(--ink-hi)}
.tm-authority{border-radius:999px;background:var(--raise);border-color:var(--line)}
.tm-table-wrap,.tm-table{border-color:var(--line);border-radius:var(--r-lg);background:var(--surface)}
.tm-table th{background:var(--raise);color:var(--muted);font-weight:600;letter-spacing:.07em;border-bottom-color:var(--line)}
.tm-table td{border-bottom-color:var(--line-soft);color:var(--ink-2)}
.tm-table tr.tm-row:hover td{background:rgb(var(--accent-rgb) / .035)}
@media(min-width:761px){.tm-table{box-shadow:var(--whisper)}}
.tm-chip,.tm-pick{border-radius:999px;background:var(--raise);border-color:var(--line);color:var(--ink-2)}
.tm-chip:hover,.tm-pick:hover{border-color:var(--line-3);color:var(--ink-hi)}
.tm-tog{border-radius:999px;background:var(--surface)}
.tm-status{border-radius:var(--r);background:var(--surface)}
.tm-pop{background:var(--surface-2);border-color:var(--line);border-radius:var(--r-lg);box-shadow:0 24px 56px -18px rgb(var(--shadow-rgb) / calc(.55 * var(--shadow-k)));overscroll-behavior:contain}
.tm-addcol-menu{background:var(--surface-2);border-color:var(--line);border-radius:var(--r);box-shadow:var(--lift)}
.tm-palette,.tm-linkbox,.tm-checklist,.tm-scene-link,.tm-sequence-edit{border-radius:var(--r-lg);border-color:var(--line)}
.tm-palette{background:var(--surface);box-shadow:var(--whisper)}
.tm-empty{border-radius:var(--r-lg);border-color:var(--line-2)}
.tm-lock{background:var(--surface);border-color:var(--line);border-radius:var(--r-xl);box-shadow:var(--whisper)}
.tm-lock h2{font-size:22px}
/* first download: skeleton shimmer instead of a bare message */
.tm-lock p::after{content:"";display:block;height:10px;margin:16px auto 0;width:70%;border-radius:6px;
  background:linear-gradient(90deg,var(--raise) 0%,var(--line) 50%,var(--raise) 100%);background-size:200% 100%;animation:hpShimmer 1.4s var(--ease) infinite}
@keyframes hpShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.tm-edit:focus,.tm-date:focus{background:var(--surface);box-shadow:var(--ring)}
.tm-date,.tm-mini-select,.tm-status-sel{border-radius:var(--r-sm)}
.tm-mini-select,.tm-status-sel{background:var(--raise)}
.tm-act{border-radius:999px}
:root:not([data-theme=dark]) .tm-status-sel.st-yellow,:root:not([data-theme=dark]) .tm-mini-select.ct-yellow{color:var(--amber-hi)}

/* phone agenda */
.ag-day{border-radius:14px;background:var(--surface);border-color:var(--line);box-shadow:var(--whisper)!important}
.ag-num{font-family:var(--font)!important;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .header{padding:10px 12px}
  .hbtn{min-height:40px}
  .left{box-shadow:24px 0 48px -16px rgb(var(--shadow-rgb) / calc(.5 * var(--shadow-k)))}
  .cal-grid{gap:3px}
  .cal-day{min-height:80px;border-radius:9px;padding:4px}
  .modal{padding:20px}
}
@media (max-width:600px){
  .hdr-acts .hbtn{min-height:44px;padding:0 4px;font-size:12px}
  .hdr-acts .hbtn.icon,.hdr-acts .hbtn.ico-sm{flex:0 0 44px;padding:0}
  .hdr-acts .hbtn.ico-sm .hbtn-l{display:none}
  .app-tab{min-height:40px}
  .cal-wrap{padding:10px 8px 24px}
  .cal-grid{gap:3px}
  .cal-day{min-height:56px;border-radius:8px;padding:4px 3px}
  .cal-nav button{width:44px;height:44px}
  .mbtn{min-height:44px}
  .tog{min-height:38px;display:inline-flex;align-items:center}
  .modal{padding:18px 16px 0!important}
  .ed-actions{background:var(--surface-2);box-shadow:0 -12px 24px -14px rgb(var(--shadow-rgb) / calc(.5 * var(--shadow-k)))}
  #lockMount .modal{border-radius:var(--r-xl)!important;border:1px solid var(--line)}
  .stats{border-radius:14px}
}
@media (max-width:760px){
  .tm-table tr.tm-row{border-radius:14px;background:var(--surface);border-color:var(--line);box-shadow:var(--whisper)}
  .tm-seq .tm-seqcell,.tm-people .tm-namecell{background:var(--raise)!important;border-bottom-color:var(--line)}
  .tm-modal .tm-actions{background:var(--surface-2)}
  .tm-save{border-radius:999px;background:var(--surface);border-color:var(--line);box-shadow:var(--lift)}
  .tm-subtab{min-height:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="header">
  <div class="brand-date"><div id="todayDate" class="today-date"></div><div><h1>PROJECT HAIRPIN</h1><div class="sub">Production Scheduler</div></div></div>
  <div class="app-tabs" role="tablist" aria-label="Production views">
    <button class="app-tab active" id="schedulerTab" onclick="showAppPage('scheduler')">Scheduler</button>
    <button class="app-tab" id="tasksTab" onclick="showAppPage('tasks')">Task Manager</button>
  </div>
  <div class="hdr-acts" style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="hbtn live ico-sm" id="liveBtn" onclick="refreshNow()" title="Refresh from the sheet"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="hbtn-l">Live</span></button>
    <button class="hbtn" id="lockBtn" onclick="toggleLock()" title="Click to enter the edit code"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> View only</button>
    <button class="hbtn gold" id="sbToggle" onclick="toggleSidebar()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg> Scenes</button>
    <button class="hbtn ico-sm" onclick="openSettings()" title="Settings" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span class="hbtn-l">Settings</span></button>
    <button class="hbtn icon" id="themeBtn" type="button" onclick="toggleTheme()" title="Switch light / dark" aria-label="Switch light / dark"></button>
    <button class="hbtn gold" id="newSceneBtn" style="display:none" onclick="openEditor(null)">+ <span class="hide-sm">New </span>Scene</button>
  </div>
  <div class="shot-strip" id="shotStrip" hidden></div>
  <div class="links-bar" id="linksBar"></div>
</div>
<div class="sb-backdrop" id="sbBackdrop" onclick="toggleSidebar()"></div>
<div class="main" id="schedulerPage">
  <div class="left" id="leftPanel"></div>
  <div class="cal-wrap" id="calWrap"></div>
  <div id="dayPanelMount"></div>
</div>
<div id="taskManagerPage" class="tm-page" hidden></div>
<div id="modalMount"></div>

<script>

/* Every panel here is redrawn by replacing its HTML, which used to throw the
   scroll position back to the top. keepScroll() notes where each scrollable area
   was (and which heading it showed) and puts it back after the redraw, so a click
   never makes the page jump. A different day, scene or month opens at the top. */
var HP_SCROLLERS="#leftPanel,#calWrap,.daypanel,.dp-body,.modal-bg,.modal,.settings-body,.settings-nav,.tm-page,.tm-modal-bg,.tm-modal,.tm-pop,.tm-palette-list,.tm-picklist,.tm-checklist,.tm-filters,.links-bar";
function hpScrollKey(el){if(el.id)return "#"+el.id;var c=String(el.className||"").split(/\s+/)[0];if(!c)return null;
  var a=el.parentElement;while(a&&!a.id)a=a.parentElement;return (a?"#"+a.id+" ":"")+"."+c}
function hpScrollSig(el){var h=el.querySelector&&el.querySelector("h2,h3");return h?h.textContent:""}
function hpSnapScroll(){var out=[],se=document.scrollingElement||document.documentElement;
  out.push({k:"@doc",t:se.scrollTop,l:se.scrollLeft,s:""});
  var els=document.querySelectorAll(HP_SCROLLERS);
  for(var i=0;i<els.length;i++){var el=els[i];if(!el.scrollTop&&!el.scrollLeft)continue;var k=hpScrollKey(el);if(k)out.push({k:k,t:el.scrollTop,l:el.scrollLeft,s:hpScrollSig(el)})}
  return out}
function hpRestoreScroll(snap){for(var i=0;i<snap.length;i++){var r=snap[i];
  var el=r.k==="@doc"?(document.scrollingElement||document.documentElement):document.querySelector(r.k);
  if(!el||(r.k!=="@doc"&&hpScrollSig(el)!==r.s))continue;
  if(Math.abs(el.scrollTop-r.t)>1)el.scrollTop=r.t;if(Math.abs(el.scrollLeft-r.l)>1)el.scrollLeft=r.l}}
var hpKeepDepth=0;
function keepScroll(fn,self,args){
  if(hpKeepDepth)return fn.apply(self,args);       // the outermost redraw does the bookkeeping
  var snap=hpSnapScroll();hpKeepDepth++;
  try{return fn.apply(self,args)}
  finally{hpKeepDepth--;hpRestoreScroll(snap);requestAnimationFrame(function(){hpRestoreScroll(snap)})}}
function keepScrollOn(names){for(var i=0;i<names.length;i++)(function(n){var f=window[n];if(typeof f!=="function"||f._keeps)return;
  var g=function(){return keepScroll(f,this,arguments)};g._keeps=true;window[n]=g})(names[i])}

/* ══════════════════════════════════════════════════════════════════════════
   PROJECT HAIRPIN — SCHEDULER v2

   The Sequences tab of the production document is the database. Each scene row
   carries its own SHOOTING DAY, so scheduling a scene is a single cell write and
   a scene can never be double-booked.

   After redeploying Code.gs, paste the new /exec URL here and commit.
   ══════════════════════════════════════════════════════════════════════════ */
var API_URL="https://script.google.com/macros/s/AKfycbzHkBZuvRK3Ng3zoDdsZycj_Qr_O2c0NViu-iNLcB7TtOfwicwBtrRj9vvM2FXvt0TV/exec";

/* Simple columns the app owns outright — written as a plain value. */
var RW_CATS={lighting:"LIGHTING",timeOfDay:"TIME OF DAY",weather:"WEATHER",status:"STATUS"};

/* Categories that live in the sheet's prose columns. Editable here too, but the
   script reconciles rather than overwrites: wording you wrote stays put, unticked
   values are removed, and newly ticked ones are appended as plain names. */
var RW_LISTS={cast:1,locations:1,props:1,extras:1,act:1,camera:1,lens:1};
function isRW(k){return !!(RW_CATS[k]||RW_LISTS[k])}

/* Editing is locked until you enter the code. It is never stored in this file —
   you type it, it lives in this browser only, and it rides along on writes. */
var editKey="";
function canEdit(){return !!editKey}

var catList=[];        // [{key,label,color,options[],rw}]
var scenes=[];         // every scene; s.shootDay is the schedule
var days={};           // dateKey -> {label,call,wrap,notes}
var people=[];         // Cast & Producers (no contact details)
var locMeta=[];        // Locations tab
var settings={};
var rev=-1, polling=null, writesInFlight=0, refetchQueued=false, writeQueue=Promise.resolve();
/* Edits show instantly but reach the sheet one at a time. Closing the tab while some
   are still queued would lose them — ask first. */
window.addEventListener("beforeunload",function(e){if(writesInFlight>0){e.preventDefault();e.returnValue="Some changes are still saving to the sheet."}});

/* The calendar opens on the real current month, not a hardcoded one. */

var TODAY_KEY=mkdk(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());

var sortMode="seq";    // unscheduled sort: seq | complexity | location

var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function firstDow(y,m){return new Date(y,m,1).getDay()}
function pad2(n){return n<10?"0"+n:""+n}
function mkdk(y,m,d){return y+"-"+pad2(m+1)+"-"+pad2(d)}
function dkey(d){return mkdk(yr,mo,d)}
function getScene(uid){for(var i=0;i<scenes.length;i++){if(scenes[i].uid===uid)return scenes[i]}return null}
function getCat(key){for(var i=0;i<catList.length;i++){if(catList[i].key===key)return catList[i]}return null}

function toast(msg,type){var t=document.getElementById("toast");t.textContent=msg;t.className="toast "+type+" show";setTimeout(function(){t.className="toast"},3000)}

/** Every scene sitting on a given date, in shooting order. */
function scenesOn(k){
  var out=[];
  for(var i=0;i<scenes.length;i++){if(scenes[i].shootDay===k)out.push(scenes[i])}
  out.sort(function(a,b){
    var ao=a.dayOrder===null||a.dayOrder===undefined?999:a.dayOrder;
    var bo=b.dayOrder===null||b.dayOrder===undefined?999:b.dayOrder;
    if(ao!==bo)return ao-bo;
    return seqNum(a)-seqNum(b);
  });
  return out;
}
function seqNum(s){var n=parseFloat(s.seq);return isNaN(n)?9999:n}
/** "30.75" or "seq 30.75" -> "SEQ 30.75", so column A stays consistent. */
function normalizeSeq(v){
  v=String(v||"").trim();
  if(!v)return"";
  var m=v.match(/([0-9]+(?:\.[0-9]+)?)/);
  return m?"SEQ "+m[1]:v;
}
function shootDates(){
  var set={},out=[];
  for(var i=0;i<scenes.length;i++){if(scenes[i].shootDay)set[scenes[i].shootDay]=1}
  for(var k in set)out.push(k);
  out.sort();return out;
}
function fmtMin(m){return Math.floor(m/60)+":"+pad2(m%60)}
function fmtDK(k){var p=String(k).split("-");if(p.length!==3)return k;return MO[parseInt(p[1],10)-1].slice(0,3)+" "+parseInt(p[2],10)}

// ── JSONP ────────────────────────────────────────────────────
function api(params,timeoutMs){
  return new Promise(function(resolve){
    var cb="jcb_"+Date.now()+"_"+Math.floor(Math.random()*10000);
    var sc=document.createElement("script");var done=false;
    var t=setTimeout(function(){if(done)return;done=true;delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Timeout"})},timeoutMs||25000);
    window[cb]=function(data){if(done)return;done=true;clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve(data)};
    sc.onerror=function(){if(done)return;done=true;clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Network error"})};
    sc.src=API_URL+"?"+params+"&callback="+cb;
    document.body.appendChild(sc);
  });
}
function apiWrite(p){
  if(!canEdit()){
    toast("Editing is locked — tap the lock to unlock","err");
    promptEditKey();
    return Promise.resolve({error:"locked"});
  }
  writesInFlight++;setLive(true);
  // Writes go out one at a time. Each one now does real work in the sheet, and two
  // at once would fight over the document lock — one would fail and the app would
  // roll its change back. Serialising keeps every edit, in order.
  var send=function(){return api("payload="+encodeURIComponent(JSON.stringify(p))+"&key="+encodeURIComponent(editKey),90000)};
  var run=writeQueue.then(send,send);
  writeQueue=run.then(function(){},function(){});
  return run
    .then(function(r){
      writesInFlight--;setLive(false);
      if(r&&r.error==="locked"){          // key rejected — drop it and re-ask
        editKey="";try{localStorage.removeItem("hairpinEditKey")}catch(e){}
        applyLock();loadFromSheet(true);
        renderLockModal("That code wasn't right.");
        return r;
      }
      if(r&&r.rev!==undefined)rev=r.rev;  // our own write — don't refetch over it
      if(refetchQueued&&!writesInFlight){refetchQueued=false;loadFromSheet(true)}
      return r;
    });
}

// ── LOCK ─────────────────────────────────────────────────────
/* Built as a real in-page dialog rather than window.prompt(), which several
   browsers — most mobile ones — refuse to show at all. */
var afterUnlock=null;

function promptEditKey(after){
  afterUnlock=after||null;
  renderLockModal("");
}
function renderLockModal(err,busy,keep){
  var h='<div class="modal-bg" style="z-index:1500" onclick="closeLockModal()">';
  h+='<div class="modal" style="max-width:330px" onclick="event.stopPropagation()">';
  h+='<h2 style="border:none;padding:0;margin-bottom:5px">Unlock editing</h2>';
  h+='<div style="font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6">The schedule stays readable for everyone. The code is only needed to change it.</div>';
  h+='<input id="lk-key" type="password" placeholder="Edit code" autocomplete="off" value="'+esc(keep||"")+'"'+
     (busy?' disabled':'')+' style="text-align:center;letter-spacing:3px" onkeydown="if(event.key===\'Enter\')submitEditKey()">';
  h+='<div style="font-size:11px;margin-top:8px;min-height:15px;color:'+(busy?'var(--muted)':'var(--red)')+'">'+
     (busy?'Checking&hellip;':(err?esc(err):''))+'</div>';
  h+='<div style="display:flex;gap:8px;margin-top:8px">';
  h+='<button class="mbtn gold" style="flex:1"'+(busy?' disabled':'')+' onclick="submitEditKey()">Unlock</button>';
  h+='<button class="mbtn ghost" onclick="closeLockModal()">Cancel</button></div>';
  h+='</div></div>';
  document.getElementById("lockMount").innerHTML=h;
  var el=document.getElementById("lk-key");
  if(el&&!busy)setTimeout(function(){el.focus({preventScroll:true});el.select()},60);
}
function closeLockModal(){
  document.getElementById("lockMount").innerHTML="";
  afterUnlock=null;
}
/* Checks the code with the sheet before unlocking, so a wrong one is rejected
   here rather than silently failing on the first edit you try to make. */
function submitEditKey(){
  var el=document.getElementById("lk-key");
  var v=el?el.value.trim():"";
  if(!v)return;
  renderLockModal("",true,v);
  api("action=verify&key="+encodeURIComponent(v)).then(function(r){
    if(!r||r.error){renderLockModal("Couldn't reach the sheet — try again.",false,v);return}
    if(!r.ok){renderLockModal("That code isn't right.",false,"");return}
    editKey=v;
    try{localStorage.setItem("hairpinEditKey",v)}catch(e){}
    var next=afterUnlock;
    document.getElementById("lockMount").innerHTML="";
    afterUnlock=null;
    applyLock();render();
    toast("Editing unlocked","ok");
    if(next)next();
  });
}
function unlockThenEditor(){promptEditKey(function(){renderEditor(!!(window._ed&&window._ed._new))})}
function unlockThenSettings(){promptEditKey(function(){renderSettings()})}

function toggleLock(){
  if(canEdit()){
    editKey="";
    try{localStorage.removeItem("hairpinEditKey")}catch(e){}
    applyLock();render();
    toast("Back to view only","info");
  }else promptEditKey();
}
function applyLock(){
  var b=document.getElementById("lockBtn"),n=document.getElementById("newSceneBtn");
  if(b){
    b.innerHTML=canEdit()?ICON.unlock+" Editing":ICON.lock+" View only";
    b.className="hbtn"+(canEdit()?" gold":"");
    b.title=canEdit()?"Click to return to view only":"Click to enter the edit code";
  }
  if(n)n.style.display=canEdit()?"":"none";
  if(window.renderLinks)renderLinks();
  if(window.syncProductionLock)window.syncProductionLock();
}
function setLive(busy){
  var b=document.getElementById("liveBtn");if(!b)return;
  if(busy||writesInFlight>0)b.classList.add("busy");else b.classList.remove("busy");
}

// ── LOAD ─────────────────────────────────────────────────────
function loadFromSheet(quiet){
  return api("action=getAll").then(function(data){
    if(data.error){toast("Load failed: "+data.error,"err");render();return false}

    scenes=data.scenes||[];
    for(var i=0;i<scenes.length;i++){
      var s=scenes[i];
      s.id=s.uid;                                        // drag handlers use .id
      s.name=(s.seqLabel?s.seqLabel+" — ":"")+s.title;   // chips use .name
    }
    days=data.days||{};
    people=data.people||[];
    locMeta=data.locations||[];
    settings=data.settings||{};
    rev=data.rev;
    buildCatList(data.cats||{},data.order||[]);
    renderLinks();

    if(data.rosterAdded)toast(data.rosterAdded+" new value(s) added to Rosters","info");
    else if(!quiet)toast("Loaded "+scenes.length+" scenes","ok");
    render();
    // the sheet changed under us — let the Task Manager refresh quietly too
    if(quiet&&window.tmOnSheetRefresh)window.tmOnSheetRefresh();
    return true;
  });
}

/**
 * catList is driven entirely by the Rosters tab.
 *
 * `options` is the plain list of names used for rendering. `meta` carries each
 * name's aliases and note alongside it, so saving from Settings round-trips them
 * instead of blanking columns D and E of the Rosters tab.
 */
function buildCatList(cats,order){
  function pack(key,label,color){
    var entries=cats[key]||[],opts=[],meta={};
    for(var j=0;j<entries.length;j++){
      opts.push(entries[j].name);
      meta[entries[j].name]={color:entries[j].color||"",note:entries[j].note||"",
                             aliases:entries[j].aliases||[]};
    }
    return {key:key,label:label,color:color,options:opts,meta:meta,rw:isRW(key)};
  }
  var list=[];
  for(var i=0;i<order.length;i++){
    var o=order[i];
    list.push(pack(o.key,o.label||o.key,o.color||"#c49b2a"));
  }
  // any roster category not named in _order still shows up
  for(var k in cats){
    var found=false;
    for(var i=0;i<list.length;i++){if(list[i].key===k){found=true;break}}
    if(!found)list.push(pack(k,k,"#8497a8"));
  }
  catList=list;
}

// ── LIVE POLLING ─────────────────────────────────────────────
function startPolling(){
  if(polling)clearInterval(polling);
  polling=setInterval(checkRev,45000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){rollToday();checkRev()}});
  /* Left open overnight, the TODAY ring would stay on yesterday. */
  setInterval(rollToday,60000);
}
/** Move the today marker when the clock crosses midnight. Redraws only if it changed. */
function rollToday(){
  var n=new Date(),k=mkdk(n.getFullYear(),n.getMonth(),n.getDate());
  if(k===TODAY_KEY)return;
  TODAY=n;TODAY_KEY=k;
  if(typeof render==="function")render();
}
function checkRev(){
  if(document.hidden)return;
  api("action=rev").then(function(r){
    if(!r||r.error||r.rev===undefined)return;
    if(r.rev===rev)return;
    if(writesInFlight>0){refetchQueued=true;return}   // never clobber an edit in flight
    loadFromSheet(true).then(function(){toast("Updated from the sheet","info")});
  });
}
function refreshNow(){loadFromSheet(true).then(function(){toast("Refreshed","ok")})}

function renderLinksEditor(){
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><h2>Header links</h2>';
  h+='<div style="font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.6">Shown at the top of both tabs for everyone. Saved to the Settings tab of the sheet.</div>';
  for(var i=0;i<_lk.length;i++){
    h+='<div class="lk-row"><input placeholder="Label" value="'+esc(_lk[i].label||"")+'" oninput="_lk['+i+'].label=this.value">';
    h+='<input placeholder="https://…" value="'+esc(_lk[i].url||"")+'" oninput="_lk['+i+'].url=this.value">';
    h+='<button class="lk-del" title="Remove" onclick="_lk.splice('+i+',1);renderLinksEditor()">&#10005;</button></div>';
  }
  h+='<button class="hbtn" style="margin-top:4px" onclick="_lk.push({label:\'\',url:\'\'});renderLinksEditor()">+ Add a link</button>';

}
function saveLinks(){
