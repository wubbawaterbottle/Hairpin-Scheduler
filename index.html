// ─── JSONP ───────────────────────────────────────────────────
function apiCall(params) {
  return new Promise((resolve) => {
    const cbName = "jcb_" + Date.now() + "_" + Math.floor(Math.random()*10000);
    const timeout = setTimeout(() => {
      delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script);
      resolve({error:"Request timed out"});
    }, 20000);
    window[cbName] = function(data) {
      clearTimeout(timeout); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };
    const script = document.createElement("script");
    script.src = API_URL + "?" + params + "&callback=" + cbName;
    script.onerror = function() { clearTimeout(timeout); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); resolve({error:"Network error"}); };
    document.body.appendChild(script);
  });
}

  bar.className = "sync-bar " + state;
  if (state === "saved") setTimeout(()=>bar.className="sync-bar hidden", 2000);
  if (state === "error") setTimeout(()=>bar.className="sync-bar hidden", 4000);
}

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast " + type + " show";
  setTimeout(()=>t.className="toast",3000);
}

async function loadFromSheet() {
  if (!API_URL || API_URL === "PASTE_YOUR_APPS_SCRIPT_URL_HERE") {
    showToast("Using local defaults — set API_URL to connect to Google Sheets", "info");
    render();
    return;
  }
  showSync("saving");
  const data = await apiCall("action=getAll");
  if (data.error) {
    showSync("error");
    showToast("Load failed: " + data.error, "err");
    render();
    return;
  }
  if (data.scenes && data.scenes.length > 0) scenes = data.scenes;
  if (data.schedule) sched = data.schedule;
  if (data.cats) {
    Object.keys(data.cats).forEach(k => { if(data.cats[k].length > 0) cats[k] = data.cats[k]; });
  }
  showSync("saved");
  showToast("Loaded from Google Sheets", "ok");
  render();
}

async function saveAllToSheet() {
  if (!API_URL || API_URL === "PASTE_YOUR_APPS_SCRIPT_URL_HERE") {
    showToast("Set API_URL first to enable saving", "err");
    return;
  }
  showSync("saving");
  const payload = JSON.stringify({action:"saveAll", scenes:scenes, schedule:sched, cats:cats});
  const data = await apiCall("payload=" + encodeURIComponent(payload));
  if (data.error) {
    showSync("error");
    showToast("Save failed: " + data.error, "err");
  } else {
    showSync("saved");
    showToast("Saved to Google Sheets!", "ok");
  }
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  renderLeft();
  renderCal();
  if (selDay) renderDayPanel(selDay);
}

function renderLeft() {
  const el = document.getElementById("leftPanel");
  const sset = scheduled();
  const unsched = scenes.filter(s=>!sset.has(s.id)).sort((a,b)=>b.complexity-a.complexity||b.cast.length-a.cast.length);

  let h = `<div class="left-title">Unscheduled (${unsched.length})</div>`;
  unsched.forEach(s => {
    h += `<div class="chip" draggable="true" ondragstart="startDrag('${s.id}',null)" onclick="openEditor('${s.id}')" style="background:linear-gradient(135deg,${CC[s.complexity]}22,${CC[s.complexity]}11);border:1.5px solid ${CC[s.complexity]}55;border-left:4px solid ${CC[s.complexity]}">`;
    h += `<div class="name">${esc(s.name)}</div>`;
    h += `<div class="tags">`;
    s.cast.forEach(c => h += `<span>${esc(c)}</span>`);
    s.timeOfDay.forEach(t => h += `<span class="tod">${esc(t)}</span>`);
    h += `</div></div>`;
  });
  if (!unsched.length) h += `<div style="font-size:11px;color:#5a5248;text-align:center;padding:16px">All scenes scheduled!</div>`;

  h += `<div class="legend"><div class="lg-title">Complexity</div>`;
  [1,2,3,4,5].forEach(n => h += `<div class="lg-item"><div class="lg-dot" style="background:${CC[n]}"></div><div class="lg-label">${CL[n]}</div></div>`);
  h += `</div>`;

  el.innerHTML = h;
}

function renderCal() {
  const el = document.getElementById("calWrap");
  const dim = daysIn(yr,mo), fd = firstDow(yr,mo);
  const sset = scheduled();
  const unsched = scenes.filter(s=>!sset.has(s.id));

  let h = `<div class="cal-nav"><button onclick="prevMo()">‹</button><h2>${MO[mo]} ${yr}</h2><button onclick="nextMo()">›</button></div>`;
  h += `<div class="cal-grid">`;
  DN.forEach(d => h += `<div class="cal-head">${d}</div>`);
  for (let i=0;i<fd;i++) h += `<div></div>`;
  for (let i=1;i<=dim;i++) {
    const k = dkey(i);
    const ds = (sched[k]||[]).map(getScene).filter(Boolean);
    const sel = selDay===i;
    const we = (fd+i-1)%7===0||(fd+i-1)%7===6;
    const tc = ds.reduce((a,s)=>a+s.complexity,0);
    h += `<div class="cal-day${sel?" sel":""}${we?" we":""}" onclick="selectDay(${i})" ondragover="event.preventDefault()" ondrop="dropOnDay(event,${i})">`;
    h += `<div class="dnum"><span>${i}</span>`;
    if(ds.length) h += `<span class="badge" style="background:${tc>8?"#c9404033":"#c49b2a22"};color:${tc>8?"#e8a0a0":"#c49b2a"}">${ds.length}s</span>`;
    h += `</div>`;
    ds.slice(0,3).forEach(s => {
      h += `<div class="mini-chip" draggable="true" ondragstart="event.stopPropagation();startDrag('${s.id}','${k}')" style="background:${CC[s.complexity]}22;border-left:2px solid ${CC[s.complexity]}">${esc(s.name)}</div>`;
    });
    if(ds.length>3) h += `<div style="font-size:8px;color:#6a5e52;text-align:center">+${ds.length-3}</div>`;
    h += `</div>`;
  }
  h += `</div>`;

  h += `<div class="stats">`;
  const shootDays = Object.values(sched).filter(v=>v.length>0).length;
  [{v:shootDays,l:"Shoot Days",c:"#e8d5a0"},{v:sset.size,l:"Scheduled",c:"#e8d5a0"},{v:unsched.length,l:"Remaining",c:unsched.length?"#c49b2a":"#4a9e6e"},{v:scenes.length,l:"Total",c:"#e8d5a0"}].forEach(({v,l,c})=>{
    h += `<div class="s"><div class="n" style="color:${c}">${v}</div><div class="l">${l}</div></div>`;
  });
  h += `</div>`;

  el.innerHTML = h;
}

// ─── DAY PANEL (resource-based matching) ─────────────────────
let dpAvail = {cast:[],locations:[],timeOfDay:[],props:[],weather:[]};

function renderDayPanel(day) {
  const k = dkey(day);
  const assigned = (sched[k]||[]).map(getScene).filter(Boolean);
  const sset = scheduled();
  const unsched = scenes.filter(s=>!sset.has(s.id));
  const tc = assigned.reduce((a,s)=>a+s.complexity,0);

  // Match logic
  const hasFilters = dpAvail.cast.length||dpAvail.locations.length||dpAvail.timeOfDay.length||dpAvail.props.length||dpAvail.weather.length;
  const matches = !hasFilters ? [] : unsched.filter(s => {
    if(dpAvail.cast.length && !s.cast.every(c=>dpAvail.cast.includes(c))) return false;
    if(dpAvail.locations.length && !s.locations.some(l=>dpAvail.locations.includes(l))) return false;
    if(dpAvail.timeOfDay.length && !s.timeOfDay.some(t=>dpAvail.timeOfDay.includes(t))) return false;
    if(dpAvail.props.length && !s.props.every(p=>dpAvail.props.includes(p))) return false;
    if(dpAvail.weather.length && !s.weather.some(w=>dpAvail.weather.includes(w)||w==="Any Weather")) return false;
    return true;
  }).sort((a,b)=>b.complexity-a.complexity);

  let h = `<div class="daypanel"><div class="dp-head"><h2>${MO[mo]} ${day}, ${yr}</h2><button class="hbtn" onclick="closeDay()">✕</button></div><div class="dp-body">`;

  // Assigned
  if (assigned.length) {
    h += `<div class="dp-section">Shooting This Day (${assigned.length} · complexity ${tc})</div>`;
    assigned.forEach(s => {
      h += `<div class="asgn-row"><div class="ar-info" onclick="openEditor('${s.id}')" style="background:${CC[s.complexity]}15;border:1px solid ${CC[s.complexity]}44;border-left:3px solid ${CC[s.complexity]}">${esc(s.name)}</div><button class="ar-rem" onclick="remFromDay('${s.id}','${k}')">Remove</button></div>`;
    });
    const allC=[...new Set(assigned.flatMap(s=>s.cast))], allL=[...new Set(assigned.flatMap(s=>s.locations))], allP=[...new Set(assigned.flatMap(s=>s.props))], allE=[...new Set(assigned.flatMap(s=>s.extras))];
    h += `<div class="dp-callsheet"><strong>Cast:</strong> ${allC.join(", ")}<br><strong>Locations:</strong> ${allL.join(", ")}<br><strong>Props:</strong> ${allP.join(", ")||"—"}<br><strong>Extras:</strong> ${allE.join(", ")||"—"}</div>`;
    h += `<div style="height:16px"></div>`;
  }

  // Resource selector
  h += `<div class="res-box"><div class="rb-title">What do you have this day?</div><div class="rb-hint">Toggle available resources — matching scenes appear below</div>`;
  h += renderTogCat("cast","Cast Available",dpAvail.cast,"#c49b2a");
  h += renderTogCat("locations","Locations Accessible",dpAvail.locations,"#5ab87a");
  h += renderTogCat("timeOfDay","Time of Day",dpAvail.timeOfDay,"#7aaad4");
  h += renderTogCat("props","Props Available",dpAvail.props,"#d4772a");
  h += renderTogCat("weather","Weather Forecast",dpAvail.weather,"#8b7bc4");
  h += `</div>`;

  // Matches
  if (hasFilters) {
    h += `<div class="dp-section">Scenes That Fit (${matches.length})</div>`;
    if (!matches.length) h += `<div style="font-size:11px;color:#5a5248;text-align:center;padding:12px">No unscheduled scenes match</div>`;
    matches.forEach(s => {
      h += `<div class="match-item"><div class="mi-info" onclick="openEditor('${s.id}')" style="background:${CC[s.complexity]}15;border:1px solid ${CC[s.complexity]}44;border-left:3px solid ${CC[s.complexity]}"><div class="mi-name">${esc(s.name)}</div><div class="mi-meta">${s.cast.join(", ")} · ${s.locations.join(", ")}</div></div><button class="mi-add" onclick="addToDay('${s.id}',${day})">+ Add</button></div>`;
    });
  } else {
    h += `<div style="font-size:11px;color:#5a5248;text-align:center;padding:16px">Select resources above to find matching scenes</div>`;
  }

  h += `</div></div>`;
  document.getElementById("dayPanelMount").innerHTML = h;
}

function renderTogCat(key, label, current, color) {
  let h = `<div class="res-cat"><div class="rc-label">${label}</div><div class="tog-row">`;
  cats[key].forEach(o => {
    const on = current.includes(o);
    h += `<button class="tog${on?" on":""}" style="--tc:${color}" onclick="toggleAvail('${key}',${JSON.stringify(o).replace(/'/g,"\\'")})">${esc(o)}</button>`;
  });
  h += `</div></div>`;
  return h;
}

// ─── ACTIONS ─────────────────────────────────────────────────
function prevMo(){if(mo===0){mo=11;yr--;}else mo--;render();}
function nextMo(){if(mo===11){mo=0;yr++;}else mo++;render();}
function selectDay(d){selDay=selDay===d?null:d;dpAvail={cast:[],locations:[],timeOfDay:[],props:[],weather:[]};render();if(selDay)renderDayPanel(selDay);}
function closeDay(){selDay=null;document.getElementById("dayPanelMount").innerHTML="";render();}

function toggleAvail(key, val) {
  const i = dpAvail[key].indexOf(val);
  if(i>=0) dpAvail[key].splice(i,1); else dpAvail[key].push(val);
  if(selDay) renderDayPanel(selDay);
}

function addToDay(sid, day) {
  const k = dkey(day);
  if(!sched[k]) sched[k]=[];
  if(!sched[k].includes(sid)) sched[k].push(sid);
  render(); if(selDay) renderDayPanel(selDay);
}

function remFromDay(sid, k) {
  if(sched[k]) sched[k] = sched[k].filter(i=>i!==sid);
  if(sched[k] && !sched[k].length) delete sched[k];
  render(); if(selDay) renderDayPanel(selDay);
}

function startDrag(id, fromKey) { dragId=id; dragFromKey=fromKey; }
function dropOnDay(e, day) {
  e.preventDefault();
  if(!dragId) return;
  const toK = dkey(day);
  if(dragFromKey) { sched[dragFromKey]=(sched[dragFromKey]||[]).filter(i=>i!==dragId); if(!sched[dragFromKey].length)delete sched[dragFromKey]; }
  if(!sched[toK])sched[toK]=[];
  if(!sched[toK].includes(dragId)) sched[toK].push(dragId);
  dragId=null; dragFromKey=null;
  render(); if(selDay) renderDayPanel(selDay);
}

// ─── EDITOR MODAL ────────────────────────────────────────────
function openEditor(id) {
  const isNew = !id;
  const s = isNew ? {id:"",name:"",cast:[],locations:[],timeOfDay:[],lighting:[],weather:[],props:[],extras:[],complexity:3,notes:""} : JSON.parse(JSON.stringify(getScene(id)));
  window._editScene = s;
  renderEditor(isNew);
}

function renderEditor(isNew) {
  const s = window._editScene;
  let h = `<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">`;
  h += `<h2>${isNew?"New Scene":"Edit Scene"}</h2>`;
  h += `<div class="field"><label>Scene Name</label><input id="ed-name" value="${esc(s.name)}" onchange="window._editScene.name=this.value"></div>`;

  ["cast","locations","timeOfDay","lighting","weather","props","extras"].forEach(k => {
    const labels = {cast:"Cast",locations:"Location",timeOfDay:"Time of Day",lighting:"Lighting",weather:"Weather",props:"Props & Vehicles",extras:"Extras"};
    h += `<div class="field"><label>${labels[k]}</label><div class="tog-row">`;
    cats[k].forEach(o => {
      const on = (s[k]||[]).includes(o);
      h += `<button class="tog${on?" on":""}" onclick="toggleEdit('${k}',${JSON.stringify(o).replace(/'/g,"\\'")})">${esc(o)}</button>`;
    });
    h += `</div></div>`;
  });

  h += `<div class="field"><label>Complexity</label><div class="cx-row">`;
  [1,2,3,4,5].forEach(n => {
    h += `<button class="cx-btn" onclick="setEditCx(${n})" style="border:${s.complexity===n?`2px solid ${CC[n]}`:"1px solid #3a342e"};background:${s.complexity===n?CC[n]+"33":"#1a1714"};color:${s.complexity===n?CC[n]:"#8a7e72"}">${CL[n]}</button>`;
  });
  h += `</div></div>`;

  h += `<div class="field"><label>Notes</label><textarea id="ed-notes" rows="3" onchange="window._editScene.notes=this.value">${esc(s.notes)}</textarea></div>`;

  h += `<div style="display:flex;justify-content:space-between;margin-top:8px"><div style="display:flex;gap:8px"><button class="mbtn gold" onclick="saveEdit()">Save</button><button class="mbtn ghost" onclick="closeModal()">Cancel</button></div>`;
  if(!isNew) h += `<button class="mbtn red" onclick="deleteEdit('${s.id}')">Delete</button>`;
  h += `</div></div></div>`;

  document.getElementById("modalMount").innerHTML = h;
}

function toggleEdit(key, val) {
  const s = window._editScene;
  if(!s[key]) s[key]=[];
  const i = s[key].indexOf(val);
  if(i>=0) s[key].splice(i,1); else s[key].push(val);
  renderEditor(!s.id);
}

function setEditCx(n) { window._editScene.complexity=n; renderEditor(!window._editScene.id); }

function saveEdit() {
  const s = window._editScene;
  s.name = document.getElementById("ed-name").value;
  s.notes = document.getElementById("ed-notes").value;
  if(!s.name.trim()) return;
  if(!s.id) s.id = "s" + Date.now();
  const idx = scenes.findIndex(x=>x.id===s.id);
  if(idx>=0) scenes[idx]=s; else scenes.push(s);
  closeModal(); render(); if(selDay) renderDayPanel(selDay);
}

function deleteEdit(id) {
  if(!confirm("Delete this scene?")) return;
  scenes = scenes.filter(s=>s.id!==id);
  Object.keys(sched).forEach(k => { sched[k]=sched[k].filter(i=>i!==id); if(!sched[k].length)delete sched[k]; });
  closeModal(); render(); if(selDay) renderDayPanel(selDay);
}

function closeModal() { document.getElementById("modalMount").innerHTML=""; }

// ─── SETTINGS MODAL ──────────────────────────────────────────
let settingsTab = "cast";
let settingsRen = null, settingsRenVal = "";

function openSettings() { settingsTab="cast"; settingsRen=null; renderSettings(); }

function renderSettings() {
  const tabs = [{k:"cast",l:"Cast"},{k:"locations",l:"Locations"},{k:"timeOfDay",l:"Time of Day"},{k:"lighting",l:"Lighting"},{k:"weather",l:"Weather"},{k:"props",l:"Props"},{k:"extras",l:"Extras"}];

  let h = `<div class="modal-bg" onclick="closeModal()"><div class="modal" style="padding:0;max-width:680px" onclick="event.stopPropagation()"><div class="settings-wrap">`;

  h += `<div class="settings-nav"><div class="sn-title">Settings</div>`;
  tabs.forEach(t => h += `<div class="sn-item${settingsTab===t.k?" active":""}" onclick="settingsTab='${t.k}';settingsRen=null;renderSettings()">${t.l} (${cats[t.k].length})</div>`);
  h += `<div style="border-top:1px solid #3a342e;margin:12px 0"></div><div class="sn-item" style="color:#c94040" onclick="closeModal()">Close</div></div>`;

  h += `<div class="settings-body">`;
  h += `<div style="display:flex;gap:8px;margin-bottom:14px"><input id="set-new" placeholder="Add new..." style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:13px;outline:none" onkeydown="if(event.key==='Enter')addCatItem()"><button class="mbtn gold" style="padding:7px 14px" onclick="addCatItem()">Add</button></div>`;

  cats[settingsTab].forEach((v,i) => {
    h += `<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;margin-bottom:1px;background:${i%2?"rgba(26,23,20,.53)":"transparent"}">`;
    if(settingsRen===v) {
      h += `<input id="set-ren" value="${esc(settingsRenVal)}" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid #c49b2a66;background:#141210;color:#e8e0d6;font-size:12px;outline:none" onkeydown="if(event.key==='Enter')renameCatItem('${esc(v)}')">`;
      h += `<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameCatItem('${esc(v)}')">Save</button>`;
      h += `<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="settingsRen=null;renderSettings()">Esc</button>`;
    } else {
      h += `<span style="flex:1;font-size:12px;color:#e8e0d6">${esc(v)}</span>`;
      h += `<span style="font-size:9px;color:#5a5248">${scenes.filter(s=>Array.isArray(s[settingsTab])&&s[settingsTab].includes(v)).length}×</span>`;
      h += `<button style="padding:2px 7px;border-radius:3px;border:1px solid #3a342e;background:none;color:#a09585;font-size:10px;cursor:pointer" onclick="settingsRen='${esc(v)}';settingsRenVal='${esc(v)}';renderSettings()">Rename</button>`;
      h += `<button style="padding:2px 7px;border-radius:3px;border:1px solid #c9404044;background:#c9404011;color:#c94040;font-size:10px;cursor:pointer" onclick="delCatItem('${esc(v)}')">Del</button>`;
    }
    h += `</div>`;
  });
  h += `<p style="font-size:10px;color:#5a5248;margin-top:12px">Renaming auto-updates all scenes.</p>`;
  h += `</div></div></div></div>`;

  document.getElementById("modalMount").innerHTML = h;
  if(settingsRen) { const el=document.getElementById("set-ren"); if(el)el.focus(); }
}

function addCatItem() {
  const el = document.getElementById("set-new");
  const v = el.value.trim();
  if(!v||cats[settingsTab].includes(v)) return;
  cats[settingsTab].push(v);
  el.value="";
  renderSettings();
}

function delCatItem(v) {
  cats[settingsTab] = cats[settingsTab].filter(x=>x!==v);
  renderSettings();
}

function renameCatItem(old) {
  const nw = document.getElementById("set-ren").value.trim();
  if(!nw||nw===old){settingsRen=null;renderSettings();return;}
  cats[settingsTab] = cats[settingsTab].map(x=>x===old?nw:x);
  scenes.forEach(s => { if(Array.isArray(s[settingsTab])) s[settingsTab]=s[settingsTab].map(x=>x===old?nw:x); });
  settingsRen=null;
  renderSettings();
}

// ─── ESCAPE HTML ─────────────────────────────────────────────
function esc(s) { if(!s)return""; const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// ─── INIT ────────────────────────────────────────────────────
render();
loadFromSheet();
</script>
</body>
