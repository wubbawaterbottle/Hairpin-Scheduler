<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Hairpin — Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','Helvetica Neue',sans-serif;background:#141210;color:#e8e0d6;min-height:100vh}
button,input,textarea,select{font-family:inherit}
.header{background:#1a1714;border-bottom:1px solid #2a2520;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:400;color:#e8d5a0}
.header .sub{font-size:9px;color:#8a7e72;text-transform:uppercase;letter-spacing:2px}
.hbtn{padding:6px 12px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid #3a342e;background:none;color:#a09585}
.hbtn.gold{border-color:#c49b2a66;background:#c49b2a22;color:#e8d5a0;font-weight:600}
.main{display:flex;height:calc(100vh - 56px)}
.left{width:260px;min-width:260px;border-right:1px solid #2a2520;overflow-y:auto;padding:12px;background:#18150f}
.left-title{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.sort-sel{width:100%;margin-bottom:8px;padding:5px 8px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#a09585;font-size:11px;outline:none;cursor:pointer}
.sec-head{display:flex;align-items:center;gap:6px;padding:6px 4px;cursor:pointer;user-select:none;border-radius:4px}
.sec-head:hover{background:rgba(255,255,255,.03)}
.sec-head .sh-arrow{font-size:9px;color:#6a5e52}
.sec-head .sh-title{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;font-weight:600;flex:1}
.sec-head .sh-count{font-size:9px;padding:1px 7px;border-radius:9px;background:#c49b2a1f;color:#c49b2a;font-weight:700}
.sec-head.done .sh-count{background:rgba(74,158,110,.15);color:#4a9e6e}
.chip .cdate{float:right;font-size:9px;color:#c49b2a;font-weight:700;margin-left:6px}
.chip.hl-off{opacity:.25;filter:grayscale(1)}
.chip.hl-on{box-shadow:0 0 0 1px #c49b2a55}
.sec-div{height:1px;background:#2a2520;margin:12px 0 4px}
.sort-sel:hover{border-color:#c49b2a66;color:#e8d5a0}
.chip{border-radius:5px;padding:5px 9px;margin-bottom:4px;cursor:grab;font-size:11px;color:#e8e0d6;transition:all .12s}
.chip:hover{transform:scale(1.01)}
.chip .name{font-weight:600;margin-bottom:1px}
.chip .tags{font-size:9px;color:#a09585;display:flex;flex-wrap:wrap;gap:3px}
.chip .tags span{background:rgba(255,255,255,.06);border-radius:2px;padding:0 3px}
.chip .tags .tod{color:#7aaad4;font-style:italic;background:none}
.cal-wrap{flex:1;overflow-y:auto;padding:14px}
.cal-nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px}
.cal-nav button{background:none;border:1px solid #3a342e;color:#a09585;width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:14px}
.cal-nav h2{font-family:'EB Garamond',Georgia,serif;font-size:18px;font-weight:400;color:#e8d5a0;min-width:160px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{text-align:center;font-size:9px;color:#6a5e52;padding:5px 0;text-transform:uppercase;letter-spacing:1px}
.cal-day{min-height:118px;border:1px solid rgba(42,37,32,.53);border-radius:5px;padding:4px;cursor:pointer;transition:all .12s;position:relative}
.cal-day:hover{border-color:#3a342e}
.cal-day.sel{border:1.5px solid #c49b2a;background:#2a2520}
.cal-day.we{background:rgba(26,23,20,.53)}
.cal-day .dnum{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.cal-day .dnum span{font-size:11px;font-weight:600;color:#a09585}
.cal-day.sel .dnum span{color:#e8d5a0}
.cal-day.we .dnum span{color:#6a5e52}
.cal-day .badge{font-size:7px;padding:1px 4px;border-radius:8px;font-weight:600}
.mini-chip{font-size:9px;padding:2px 4px;margin-bottom:1px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;color:#e8e0d6}
/* highlight states */
.mini-chip.hl-on{filter:saturate(1.6) brightness(1.25);box-shadow:0 0 0 1px currentColor inset,0 0 8px -2px currentColor;font-weight:600}
.mini-chip.hl-off{opacity:.2;filter:grayscale(1)}
.cal-day.hl-dim{opacity:.55}
.cal-day.hl-hit{border-color:#c49b2a55}
.dnum .hl-count{font-size:7px;padding:1px 4px;border-radius:8px;font-weight:700;background:#c49b2a33;color:#e8d5a0;margin-left:3px}
/* highlight bar */
.hl-bar{margin-top:12px;background:rgba(26,23,20,.53);border:1px solid #2a2520;border-radius:7px;overflow:hidden}
.hl-head{padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.hl-head:hover{background:rgba(255,255,255,.02)}
.hl-head .hl-t{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;font-weight:600;flex:1}
.hl-head .hl-badge{font-size:9px;padding:2px 7px;border-radius:9px;background:#c49b2a22;color:#e8d5a0;font-weight:600}
.hl-head .hl-arrow{color:#6a5e52;font-size:10px}
.hl-body{padding:4px 12px 12px;border-top:1px solid #2a2520}
.hl-cat{margin-bottom:8px}
.hl-cat .hl-label{font-size:9px;color:#6a5e52;text-transform:uppercase;margin-bottom:3px;letter-spacing:.5px}
.hl-summary{margin-top:8px;padding:9px 10px;background:#141210;border:1px solid #3a342e;border-radius:6px;font-size:11px;color:#c9b896;line-height:1.7}
.hl-summary .hs-name{color:#e8d5a0;font-weight:600}
.hl-summary .hs-dates{color:#8a7e72;font-size:10px}
.hl-clear{padding:3px 10px;border-radius:4px;border:1px solid rgba(201,64,64,.3);background:rgba(201,64,64,.08);color:#c94040;font-size:10px;cursor:pointer;font-weight:600}
.stats{margin-top:14px;padding:12px;background:rgba(26,23,20,.53);border-radius:7px;border:1px solid #2a2520;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stats .s{text-align:center}
.stats .s .n{font-size:18px;font-weight:700}
.stats .s .l{font-size:8px;color:#8a7e72;text-transform:uppercase}
.daypanel{position:fixed;right:0;top:0;bottom:0;width:420px;background:#1e1b18;border-left:1px solid #3a342e;z-index:900;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.4);display:flex;flex-direction:column}
.daypanel .dp-head{padding:16px 20px;border-bottom:1px solid #3a342e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.daypanel .dp-head h2{font-family:'EB Garamond',Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400}
.daypanel .dp-body{flex:1;overflow-y:auto;padding:16px}
.dp-section{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.dp-callsheet{padding:8px;background:rgba(20,18,16,.53);border-radius:5px;border:1px solid #3a342e;font-size:10px;color:#a09585;line-height:1.6;margin-top:8px}
.dp-callsheet strong{color:#c9b896}
.res-box{padding:12px;background:#141210;border-radius:8px;border:1px solid #3a342e;margin-bottom:12px}
.res-box .rb-title{font-size:11px;color:#e8d5a0;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.res-box .rb-hint{font-size:10px;color:#8a7e72;margin-bottom:8px}
.res-cat{margin-bottom:8px}
.res-cat .rc-label{font-size:9px;color:#6a5e52;text-transform:uppercase;margin-bottom:3px}
.tog-row{display:flex;flex-wrap:wrap;gap:4px}
/* Three-state toggles: off (grey), on/positive (colored), negative/exclude (red) */
.tog{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .12s;border:1px solid #3a342e;background:#1a1714;color:#8a7e72;user-select:none}
.tog.pos{border-color:var(--tc,#c49b2a);background:color-mix(in srgb,var(--tc,#c49b2a) 13%,transparent);color:#e8d5a0}
.tog.neg{border-color:#c94040;background:rgba(201,64,64,.15);color:#c94040;text-decoration:line-through}
.match-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.match-item .mi-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer}
.match-item .mi-info .mi-name{font-size:11px;color:#e8e0d6;font-weight:500}
.match-item .mi-info .mi-meta{font-size:9px;color:#8a7e72;margin-top:2px}
.match-item .mi-add{padding:4px 8px;border-radius:4px;border:1px solid rgba(74,158,110,.27);background:rgba(74,158,110,.07);color:#4a9e6e;font-size:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.asgn-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.asgn-row .ar-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:11px;color:#e8e0d6;font-weight:500}
.asgn-row .ar-rem{padding:3px 7px;border-radius:3px;border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040;font-size:9px;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;justify-content:center;align-items:center}
.modal{background:#1e1b18;border:1px solid #3a342e;border-radius:12px;width:92%;max-width:600px;max-height:88vh;overflow-y:auto;padding:24px}
.modal h2{font-family:'EB Garamond',Georgia,serif;font-size:20px;color:#e8d5a0;font-weight:400;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #3a342e}
.modal label{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
.modal input,.modal textarea{width:100%;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:13px;outline:none}
.modal textarea{resize:vertical}
.modal .field{margin-bottom:10px}
.mbtn{padding:7px 20px;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600}
.mbtn.gold{border:none;background:#c49b2a;color:#1a1714}
.mbtn.ghost{border:1px solid #3a342e;background:none;color:#a09585}
.mbtn.red{border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040;font-size:11px}
.settings-wrap{display:flex;overflow:hidden;border-radius:12px;max-height:80vh}
.settings-nav{width:180px;min-width:180px;border-right:1px solid #3a342e;padding:20px 0;background:#1a1714;overflow-y:auto}
.settings-nav .sn-title{padding:0 14px 14px;font-size:16px;color:#e8d5a0;font-family:'EB Garamond',Georgia,serif}
.settings-nav .sn-item{padding:7px 14px;font-size:12px;cursor:pointer;color:#8a7e72;border-left:3px solid transparent;transition:all .12s}
.settings-nav .sn-item.active{color:#e8d5a0;background:#2a2520;border-left-color:#c49b2a}
.settings-body{flex:1;padding:20px;overflow-y:auto}
.cx-row{display:flex;gap:5px}
.cx-btn{width:48px;height:30px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer}
.legend{margin-top:14px;padding-top:10px;border-top:1px solid #2a2520}
.legend .lg-title{font-size:9px;color:#6a5e52;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.legend .lg-item{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.legend .lg-dot{width:8px;height:8px;border-radius:2px}
.legend .lg-label{font-size:9px;color:#8a7e72}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:6px;font-size:11px;z-index:2000;transition:all .3s;opacity:0;transform:translateY(10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#4a9e6e;color:#fff}
.toast.err{background:#c94040;color:#fff}
.toast.info{background:#c49b2a;color:#1a1714}
.cat-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;margin-bottom:1px}
.cat-row:nth-child(odd){background:rgba(26,23,20,.53)}
.cat-row .cr-name{flex:1;font-size:12px;color:#e8e0d6}
.cat-row .cr-count{font-size:9px;color:#5a5248}
.cat-row button{padding:2px 7px;border-radius:3px;font-size:10px;cursor:pointer}
.cat-row .cr-ren{border:1px solid #3a342e;background:none;color:#a09585}
.cat-row .cr-del{border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040}
.cat-row .cr-up,.cat-row .cr-dn{border:1px solid #3a342e;background:none;color:#8a7e72;padding:2px 5px;font-size:9px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="header">
  <div><h1>PROJECT HAIRPIN</h1><div class="sub">Production Scheduler</div></div>
  <div style="display:flex;gap:6px">
    <button class="hbtn" onclick="openSettings()">⚙ Settings</button>
    <button class="hbtn gold" onclick="openEditor(null)">+ New Scene</button>
  </div>
</div>
<div class="main">
  <div class="left" id="leftPanel"></div>
  <div class="cal-wrap" id="calWrap"></div>
  <div id="dayPanelMount"></div>
</div>
<div id="modalMount"></div>

<script>
var API_URL="https://script.google.com/macros/s/AKfycbwzCJsQSZXeK5cQS7V2A_f9GUS6nxw0OVJKGb15xY2bGplpJU-luOfPpIiZcB7bBxnt/exec";

/*
  CATEGORIES are now a dynamic ordered array of objects:
  [ { key:"cast", label:"Cast", color:"#c49b2a", options:[...] }, ... ]
  This lets the user rename, reorder, add, remove entire categories.
*/
var DEFAULT_CAT_LIST = [
  {key:"cast",label:"Cast",color:"#c49b2a",options:["Tom","Kim","Rhodes","Cobb/Drummond","Peter","Commissioner","Lawyer/Hadley","Forensics Officer"]},
  {key:"locations",label:"Locations",color:"#5ab87a",options:["Reese Air Force Base","Cook's Garage","Winery","Landfill","Police Station","McDougal Building","Kim's Apartment","Tom's Apartment","Donut Shop","Police Cruiser/Rural Road","Whataburger","Wind Farm/Dirt Field","Country Roads","The Void"]},
  {key:"timeOfDay",label:"Time of Day",color:"#7aaad4",options:["Dawn/Sunrise","Morning","Day","Afternoon","Sunset/Dusk","Night"]},
  {key:"lighting",label:"Lighting",color:"#9b8ad4",options:["Golden Hour","Blue Hour","Harsh Sun","Overcast OK","Controlled Interior","Moonlight/Night Ext","Practical Lights Only"]},
  {key:"weather",label:"Weather",color:"#8b7bc4",options:["Clear Required","Any Weather","Overcast Preferred","Wind Needed"]},
  {key:"props",label:"Props & Vehicles",color:"#d4772a",options:["Tommy's Red Civic","Kim's Red Car","White Van","Peter's Truck","Police Cruiser","Pursuit Vehicles","Ambulances","The Machine","Kevlar Vest","Shotgun","Snub Revolver","Rifles","Neon Signs"]},
  {key:"extras",label:"Extras",color:"#d4a22a",options:["Winery Guards (3-5)","Cook's Bar Patrons (12)","Storage Bay Goons (3)","Burly Guard (1)","Landfill Mercs (3-4)","Reese Mercs (7)","Uniformed Police (4-6)","Ambulance Crew (2)","Night Receptionist (1)"]}
];

var catList=JSON.parse(JSON.stringify(DEFAULT_CAT_LIST));
var scenes=[];
var sched={};
var yr=2026,mo=7,selDay=null,dragId=null,dragFromKey=null;
var sortMode="name";   // unscheduled sort: name | complexity | location
var sortModeS="date";  // scheduled sort: date | name | complexity | location
var openUn=true, openSch=true;  // sidebar section collapse state
var highlight={};      // {catKey:[values]} — highlight/dim filter for calendar
var hlOpen=false;      // is the highlight bar expanded

var CC={1:"#4a9e6e",2:"#6b9e4a",3:"#c49b2a",4:"#d4772a",5:"#c94040"};
var CL={1:"Simple",2:"Easy",3:"Medium",4:"Hard",5:"Major"};
var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function firstDow(y,m){return new Date(y,m,1).getDay()}
function pad2(n){return n<10?"0"+n:""+n}
function mkdk(y,m,d){return y+"-"+pad2(m+1)+"-"+pad2(d)}
function dkey(d){return mkdk(yr,mo,d)}
function getScene(id){for(var i=0;i<scenes.length;i++){if(scenes[i].id===id)return scenes[i]}return null}
function scheduledSet(){var s=new Set();var keys=Object.keys(sched);for(var i=0;i<keys.length;i++){var a=sched[keys[i]];for(var j=0;j<a.length;j++)s.add(a[j])}return s}
function getCat(key){for(var i=0;i<catList.length;i++){if(catList[i].key===key)return catList[i]}return null}
// Build a flat cats object for saving to sheet
function catsObj(){var o={};o._order=catList.map(function(c){return{key:c.key,label:c.label,color:c.color}});for(var i=0;i<catList.length;i++)o[catList[i].key]=catList[i].options;return o}

// ── JSONP ────────────────────────────────────────────────────
function api(params){
  return new Promise(function(resolve){
    var cb="jcb_"+Date.now()+"_"+Math.floor(Math.random()*10000);
    var sc=document.createElement("script");var done=false;
    var t=setTimeout(function(){if(done)return;done=true;delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Timeout"})},25000);
    window[cb]=function(data){if(done)return;done=true;clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve(data)};
    sc.onerror=function(){if(done)return;done=true;clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Network error"})};
    sc.src=API_URL+"?"+params+"&callback="+cb;
    document.body.appendChild(sc);
  });
}
function apiWrite(p){return api("payload="+encodeURIComponent(JSON.stringify(p)))}
function toast(msg,type){var t=document.getElementById("toast");t.textContent=msg;t.className="toast "+type+" show";setTimeout(function(){t.className="toast"},3000)}

// ── LOAD ─────────────────────────────────────────────────────
async function loadFromSheet(){
  var data=await api("action=getAll");
  if(data.error){toast("Load failed: "+data.error,"err");render();return}
  if(data.scenes&&data.scenes.length>0)scenes=data.scenes;
  sched={};
  if(data.schedule){var keys=Object.keys(data.schedule);for(var i=0;i<keys.length;i++){var k=String(keys[i]).trim();var ids=data.schedule[keys[i]];var clean=[];for(var j=0;j<ids.length;j++){var id=String(ids[j]).trim();if(id)clean.push(id)}if(clean.length)sched[k]=clean}}
  if(data.cats){
    // Restore category order if saved
    if(data.cats._order){
      var order=data.cats._order;
      // jp might have parsed it
      if(typeof order==="string")try{order=JSON.parse(order)}catch(e){}
      if(Array.isArray(order)){
        var newList=[];
        for(var i=0;i<order.length;i++){
          var o=order[i];
          var opts=data.cats[o.key]||[];
          newList.push({key:o.key,label:o.label||o.key,color:o.color||"#c49b2a",options:opts});
        }
        // Add any default cats not in saved order
        for(var i=0;i<DEFAULT_CAT_LIST.length;i++){
          var found=false;for(var j=0;j<newList.length;j++){if(newList[j].key===DEFAULT_CAT_LIST[i].key){found=true;break}}
          if(!found){var dc=DEFAULT_CAT_LIST[i];var opts=data.cats[dc.key]||dc.options;newList.push({key:dc.key,label:dc.label,color:dc.color,options:opts})}
        }
        catList=newList;
      }
    } else {
      // No order saved — use defaults but load options from sheet
      for(var i=0;i<catList.length;i++){if(data.cats[catList[i].key]&&data.cats[catList[i].key].length>0)catList[i].options=data.cats[catList[i].key]}
    }
  }
  toast("Loaded from Google Sheets","ok");
  render();
}

// ── SAVES ────────────────────────────────────────────────────
async function saveSceneToSheet(scene){var r=await apiWrite({action:"saveScene",scene:scene});if(r.error)toast("Save failed: "+r.error,"err")}
async function deleteSceneFromSheet(id){var r=await apiWrite({action:"deleteScene",id:id});if(r.error)toast("Delete failed: "+r.error,"err")}
async function saveScheduleRow(dk){var ids=sched[dk]||[];var r=await apiWrite({action:"saveScheduleRow",dateKey:dk,sceneIds:ids});if(r.error)toast("Schedule save failed: "+r.error,"err")}
async function saveCatsToSheet(){var r=await apiWrite({action:"saveCategories",cats:catsObj()});if(r.error)toast("Settings save failed: "+r.error,"err");else toast("Settings saved","ok")}

// ── RENDER ───────────────────────────────────────────────────
function render(){renderLeft();renderCal();if(selDay)renderDayPanel(selDay)}

function setSort(mode){sortMode=mode;renderLeft()}
function setSortS(mode){sortModeS=mode;renderLeft()}
function toggleSec(which){if(which==="un")openUn=!openUn;else openSch=!openSch;renderLeft()}

// Map every scheduled scene id -> its date key
function schedDateMap(){
  var m={},ks=Object.keys(sched);
  for(var i=0;i<ks.length;i++){var ids=sched[ks[i]];for(var j=0;j<ids.length;j++)m[ids[j]]=ks[i]}
  return m;
}

function alphaCmp(a,b){return String(a||"").localeCompare(String(b||""),undefined,{numeric:true,sensitivity:"base"})}

function sortFn(mode,dateMap){
  mode=mode||sortMode;
  if(mode==="date"){
    // Chronological by shoot date, then alphabetical within a day
    return function(a,b){
      var da=(dateMap&&dateMap[a.id])||"9999",db=(dateMap&&dateMap[b.id])||"9999";
      if(da!==db)return da<db?-1:1;
      return alphaCmp(a.name,b.name);
    }
  }
  if(mode==="complexity"){
    // Hardest first, then alphabetical within the same complexity
    return function(a,b){return (b.complexity||0)-(a.complexity||0)||alphaCmp(a.name,b.name)}
  }
  if(mode==="location"){
    // Group by first location, then alphabetical within each location
    return function(a,b){
      var la=(a.locations&&a.locations.length)?a.locations[0]:"~none";
      var lb=(b.locations&&b.locations.length)?b.locations[0]:"~none";
      return alphaCmp(la,lb)||alphaCmp(a.name,b.name);
    }
  }
  // default: sequential / alphabetical by scene name
  return function(a,b){return alphaCmp(a.name,b.name)}
}

function chipHTML(s,fromKey,dateLabel){
  var cls="chip";
  if(hlActive())cls+=hlMatch(s)?" hl-on":" hl-off";
  var fk=fromKey?("'"+fromKey+"'"):"null";
  var h='<div class="'+cls+'" draggable="true" ondragstart="startDrag(\''+s.id+'\','+fk+')" onclick="openEditor(\''+s.id+'\')" style="background:linear-gradient(135deg,'+CC[s.complexity]+'22,'+CC[s.complexity]+'11);border:1.5px solid '+CC[s.complexity]+'55;border-left:4px solid '+CC[s.complexity]+'">';
  h+='<div class="name">'+(dateLabel?'<span class="cdate">'+dateLabel+'</span>':'')+esc(s.name)+'</div><div class="tags">';
  if(s.cast)for(var j=0;j<s.cast.length;j++)h+='<span>'+esc(s.cast[j])+'</span>';
  if(s.timeOfDay)for(var j=0;j<s.timeOfDay.length;j++)h+='<span class="tod">'+esc(s.timeOfDay[j])+'</span>';
  return h+'</div></div>';
}

function sortSelect(fnName,current,opts){
  var h='<select class="sort-sel" onchange="'+fnName+'(this.value)">';
  for(var i=0;i<opts.length;i++)h+='<option value="'+opts[i][0]+'"'+(current===opts[i][0]?' selected':'')+'>'+opts[i][1]+'</option>';
  return h+'</select>';
}

// ── HIGHLIGHT HELPERS ────────────────────────────────────────
function hlActive(){for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v&&v.length)return true}return false}

// OR within a category, AND across categories (same logic as the day panel)
function hlMatch(s){
  for(var ci=0;ci<catList.length;ci++){
    var ck=catList[ci].key,sel=highlight[ck];
    if(!sel||!sel.length)continue;
    var sv=s[ck]||[],found=false;
    for(var j=0;j<sv.length;j++){if(sel.indexOf(sv[j])>=0){found=true;break}}
    if(!found)return false;
  }
  return true;
}

function toggleHL(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx];
  if(!highlight[catKey])highlight[catKey]=[];
  var i=highlight[catKey].indexOf(val);
  if(i>=0)highlight[catKey].splice(i,1);else highlight[catKey].push(val);
  if(!highlight[catKey].length)delete highlight[catKey];
  renderCal();renderLeft();
}
function clearHL(){highlight={};renderCal();renderLeft()}
function toggleHLBar(){hlOpen=!hlOpen;renderCal()}

// Every scheduled date that contains at least one matching scene, sorted
function hlDates(){
  var out=[],ks=Object.keys(sched);
  for(var i=0;i<ks.length;i++){
    var ids=sched[ks[i]];
    for(var j=0;j<ids.length;j++){
      var s=getScene(ids[j]);
      if(s&&hlMatch(s)){out.push(ks[i]);break}
    }
  }
  out.sort();
  return out;
}
function fmtDK(k){
  var p=String(k).split("-");
  if(p.length!==3)return k;
  return MO[parseInt(p[1],10)-1].slice(0,3)+" "+parseInt(p[2],10);
}

function renderHLBar(){
  var on=hlActive(),n=0;
  for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v)n+=v.length}
  var h='<div class="hl-bar"><div class="hl-head" onclick="toggleHLBar()">';
  h+='<span class="hl-arrow">'+(hlOpen?"&#9660;":"&#9654;")+'</span>';
  h+='<span class="hl-t">Highlight Scenes</span>';
  if(on)h+='<span class="hl-badge">'+n+' active</span>';
  h+='</div>';
  if(hlOpen){
    h+='<div class="hl-body">';
    for(var ci=0;ci<catList.length;ci++){
      var cat=catList[ci];
      if(!cat.options.length)continue;
      h+='<div class="hl-cat"><div class="hl-label">'+esc(cat.label)+'</div><div class="tog-row">';
      for(var oi=0;oi<cat.options.length;oi++){
        var o=cat.options[oi];
        var sel=highlight[cat.key]&&highlight[cat.key].indexOf(o)>=0;
        h+='<button class="tog'+(sel?' pos':'')+'" style="--tc:'+cat.color+'" onclick="toggleHL(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
      }
      h+='</div></div>';
    }
    if(on){
      var total=0,ks=Object.keys(sched);
      for(var i=0;i<ks.length;i++){for(var j=0;j<sched[ks[i]].length;j++){var s=getScene(sched[ks[i]][j]);if(s&&hlMatch(s))total++}}
      var dts=hlDates(),labels=[];
      for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v&&v.length)labels=labels.concat(v)}
      var shown=dts.slice(0,14).map(fmtDK).join(" &middot; ");
      if(dts.length>14)shown+=" &middot; +"+(dts.length-14)+" more";
      h+='<div class="hl-summary"><span class="hs-name">'+esc(labels.join(" + "))+'</span> &mdash; '+total+' scene'+(total===1?"":"s")+' across '+dts.length+' shoot day'+(dts.length===1?"":"s");
      if(dts.length)h+='<br><span class="hs-dates">'+shown+'</span>';
      h+='</div>';
      h+='<div style="margin-top:8px"><button class="hl-clear" onclick="clearHL()">Clear highlights</button></div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

function renderCal(){
  var el=document.getElementById("calWrap");
  var dim=daysIn(yr,mo),fd=firstDow(yr,mo),sset=scheduledSet();
  var HLON=hlActive();
  var unschedCount=0;for(var i=0;i<scenes.length;i++){if(!sset.has(scenes[i].id))unschedCount++}
  var h='<div class="cal-nav"><button onclick="prevMo()">&#8249;</button><h2>'+MO[mo]+' '+yr+'</h2><button onclick="nextMo()">&#8250;</button></div><div class="cal-grid">';
  for(var i=0;i<7;i++)h+='<div class="cal-head">'+DN[i]+'</div>';
  for(var i=0;i<fd;i++)h+='<div></div>';
  for(var d=1;d<=dim;d++){
    var k=dkey(d),ids=sched[k]||[],ds=[];
    for(var j=0;j<ids.length;j++){var sc=getScene(ids[j]);if(sc)ds.push(sc)}
    var sel=selDay===d,we=(fd+d-1)%7===0||(fd+d-1)%7===6,tc=0;
    for(var j=0;j<ds.length;j++)tc+=ds[j].complexity;

    // When highlighting, float matching scenes to the top of the cell
    var hitCount=0;
    if(HLON){
      var hit=[],miss=[];
      for(var j=0;j<ds.length;j++){if(hlMatch(ds[j]))hit.push(ds[j]);else miss.push(ds[j])}
      hitCount=hit.length;
      ds=hit.concat(miss);
    }
    var dayCls="cal-day"+(sel?" sel":"")+(we?" we":"");
    if(HLON)dayCls+=hitCount?" hl-hit":" hl-dim";

    h+='<div class="'+dayCls+'" onclick="selectDay('+d+')" ondragover="event.preventDefault()" ondrop="dropOnDay(event,'+d+')">';
    h+='<div class="dnum"><span>'+d+'</span>';
    if(HLON&&hitCount)h+='<span class="hl-count">'+hitCount+'</span>';
    else if(ds.length)h+='<span class="badge" style="background:'+(tc>8?'#c9404033':'#c49b2a22')+';color:'+(tc>8?'#e8a0a0':'#c49b2a')+'">'+ds.length+'s</span>';
    h+='</div>';
    for(var j=0;j<Math.min(ds.length,5);j++){var s=ds[j];
      var cls="mini-chip";
      if(HLON)cls+=hlMatch(s)?" hl-on":" hl-off";
      h+='<div class="'+cls+'" draggable="true" ondragstart="event.stopPropagation();startDrag(\''+s.id+'\',\''+k+'\')" style="background:'+CC[s.complexity]+'22;border-left:2px solid '+CC[s.complexity]+';color:'+CC[s.complexity]+'">'+esc(s.name)+'</div>';}
    if(ds.length>5)h+='<div style="font-size:8px;color:#6a5e52;text-align:center">+'+(ds.length-5)+'</div>';
    h+='</div>';
  }
  h+='</div><div class="stats">';
  var sd=0;var ks=Object.keys(sched);for(var i=0;i<ks.length;i++){if(sched[ks[i]].length)sd++}
  var arr=[{v:sd,l:"Shoot Days",c:"#e8d5a0"},{v:sset.size,l:"Scheduled",c:"#e8d5a0"},{v:unschedCount,l:"Remaining",c:unschedCount?"#c49b2a":"#4a9e6e"},{v:scenes.length,l:"Total",c:"#e8d5a0"}];
  for(var i=0;i<arr.length;i++)h+='<div class="s"><div class="n" style="color:'+arr[i].c+'">'+arr[i].v+'</div><div class="l">'+arr[i].l+'</div></div>';
  h+='</div>';
  h+=renderHLBar();
  el.innerHTML=h;
}

// ── DAY PANEL — Three-state toggles: off / positive / negative ──
// dpAvail stores {catKey: {pos:[], neg:[]}}
var dpAvail={};
function initDpAvail(){dpAvail={};for(var i=0;i<catList.length;i++)dpAvail[catList[i].key]={pos:[],neg:[]}}
initDpAvail();

function renderDayPanel(day){
  var k=dkey(day),ids=sched[k]||[],assigned=[];
  for(var i=0;i<ids.length;i++){var sc=getScene(ids[i]);if(sc)assigned.push(sc)}
  var sset=scheduledSet();
  var unsched=[];for(var i=0;i<scenes.length;i++){if(!sset.has(scenes[i].id))unsched.push(scenes[i])}
  var tc=0;for(var i=0;i<assigned.length;i++)tc+=assigned[i].complexity;

  // Check if any filters active
  var hasF=false;
  for(var ci=0;ci<catList.length;ci++){var ck=catList[ci].key;if(!dpAvail[ck])dpAvail[ck]={pos:[],neg:[]};if(dpAvail[ck].pos.length||dpAvail[ck].neg.length){hasF=true;break}}

  // Match logic: positive = scene must have ANY of those. negative = scene must NOT have ANY of those.
  var matches=[];
  if(hasF){
    for(var i=0;i<unsched.length;i++){
      var s=unsched[i],ok=true;
      for(var ci=0;ci<catList.length;ci++){
        var ck=catList[ci].key;
        if(!dpAvail[ck])continue;
        var pos=dpAvail[ck].pos,neg=dpAvail[ck].neg;
        var svals=s[ck]||[];
        // Positive: at least one of the scene's values must be in the positive list
        if(pos.length>0){var found=false;for(var j=0;j<svals.length;j++){if(pos.indexOf(svals[j])>=0){found=true;break}}if(!found){ok=false;break}}
        // Negative: none of the scene's values can be in the negative list
        if(neg.length>0){for(var j=0;j<svals.length;j++){if(neg.indexOf(svals[j])>=0){ok=false;break}}if(!ok)break}
      }
      if(ok)matches.push(s);
    }
    matches.sort(function(a,b){return b.complexity-a.complexity});
  }

  var h='<div class="daypanel"><div class="dp-head"><h2>'+MO[mo]+' '+day+', '+yr+'</h2><button class="hbtn" onclick="closeDay()">&#10005;</button></div><div class="dp-body">';

  // Assigned scenes
  if(assigned.length){
    h+='<div class="dp-section">Shooting This Day ('+assigned.length+' &middot; complexity '+tc+')</div>';
    for(var i=0;i<assigned.length;i++){var s=assigned[i];
      h+='<div class="asgn-row"><div class="ar-info" onclick="openEditor(\''+s.id+'\')" style="background:'+CC[s.complexity]+'15;border:1px solid '+CC[s.complexity]+'44;border-left:3px solid '+CC[s.complexity]+'">'+esc(s.name)+'</div><button class="ar-rem" onclick="remFromDay(\''+s.id+'\',\''+k+'\')">Remove</button></div>';}
    var allC=[],allL=[],allP=[],allE=[];
    for(var i=0;i<assigned.length;i++){var s=assigned[i];
      if(s.cast)for(var j=0;j<s.cast.length;j++){if(allC.indexOf(s.cast[j])<0)allC.push(s.cast[j])}
      if(s.locations)for(var j=0;j<s.locations.length;j++){if(allL.indexOf(s.locations[j])<0)allL.push(s.locations[j])}
      if(s.props)for(var j=0;j<s.props.length;j++){if(allP.indexOf(s.props[j])<0)allP.push(s.props[j])}
      if(s.extras)for(var j=0;j<s.extras.length;j++){if(allE.indexOf(s.extras[j])<0)allE.push(s.extras[j])}}
    h+='<div class="dp-callsheet"><strong>Cast:</strong> '+allC.join(", ")+'<br><strong>Locations:</strong> '+allL.join(", ")+'<br><strong>Props:</strong> '+(allP.join(", ")||"—")+'<br><strong>Extras:</strong> '+(allE.join(", ")||"—")+'</div><div style="height:16px"></div>';
  }

  // Resource toggles
  h+='<div class="res-box"><div class="rb-title">What do you have this day?</div>';
  h+='<div class="rb-hint">Click = available (include). Click again = exclude (red). Click again = off.</div>';
  for(var ci=0;ci<catList.length;ci++){
    var cat=catList[ci];
    if(!dpAvail[cat.key])dpAvail[cat.key]={pos:[],neg:[]};
    h+='<div class="res-cat"><div class="rc-label">'+esc(cat.label)+'</div><div class="tog-row">';
    for(var oi=0;oi<cat.options.length;oi++){
      var o=cat.options[oi];
      var inPos=dpAvail[cat.key].pos.indexOf(o)>=0;
      var inNeg=dpAvail[cat.key].neg.indexOf(o)>=0;
      var cls="tog";
      if(inPos)cls+=" pos";else if(inNeg)cls+=" neg";
      h+='<button class="'+cls+'" style="--tc:'+cat.color+'" onclick="cycleAvail(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
    }
    h+='</div></div>';
  }
  h+='</div>';

  // Matches
  if(hasF){
    h+='<div class="dp-section">Scenes That Fit ('+matches.length+')</div>';
    if(!matches.length)h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:12px">No unscheduled scenes match</div>';
    for(var i=0;i<matches.length;i++){var s=matches[i];
      h+='<div class="match-item"><div class="mi-info" onclick="openEditor(\''+s.id+'\')" style="background:'+CC[s.complexity]+'15;border:1px solid '+CC[s.complexity]+'44;border-left:3px solid '+CC[s.complexity]+'"><div class="mi-name">'+esc(s.name)+'</div><div class="mi-meta">'+(s.cast||[]).join(", ")+' &middot; '+(s.locations||[]).join(", ")+'</div></div><button class="mi-add" onclick="addToDay(\''+s.id+'\','+day+')">+ Add</button></div>';}
  }else{
    h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:16px">Toggle resources above to find matching scenes</div>';
  }
  h+='</div></div>';
  document.getElementById("dayPanelMount").innerHTML=h;
}

// Three-state cycle: off → positive → negative → off
function cycleAvail(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx];
  if(!dpAvail[catKey])dpAvail[catKey]={pos:[],neg:[]};
  var inPos=dpAvail[catKey].pos.indexOf(val);
  var inNeg=dpAvail[catKey].neg.indexOf(val);
  if(inPos>=0){
    // positive → negative
    dpAvail[catKey].pos.splice(inPos,1);
    dpAvail[catKey].neg.push(val);
  }else if(inNeg>=0){
    // negative → off
    dpAvail[catKey].neg.splice(inNeg,1);
  }else{
    // off → positive
    dpAvail[catKey].pos.push(val);
  }
  if(selDay)renderDayPanel(selDay);
}

function togCat(key,label,current,color){
  var cat=getCat(key);if(!cat)return'';
  var h='<div class="res-cat"><div class="rc-label">'+label+'</div><div class="tog-row">';
  for(var i=0;i<cat.options.length;i++){var o=cat.options[i],on=current.indexOf(o)>=0;
    h+='<button class="tog'+(on?' pos':'')+'" style="--tc:'+color+'" onclick="toggleAvail(\''+key+'\','+i+')">'+esc(o)+'</button>';}
  return h+'</div></div>';
}

// ── ACTIONS ──────────────────────────────────────────────────
function prevMo(){if(mo===0){mo=11;yr--}else mo--;render()}
function nextMo(){if(mo===11){mo=0;yr++}else mo++;render()}
function selectDay(d){selDay=selDay===d?null:d;initDpAvail();render();if(selDay)renderDayPanel(selDay)}
function closeDay(){selDay=null;document.getElementById("dayPanelMount").innerHTML="";render()}

function addToDay(sid,day){
  var k=dkey(day);if(!sched[k])sched[k]=[];
  if(sched[k].indexOf(sid)<0)sched[k].push(sid);
  render();if(selDay)renderDayPanel(selDay);saveScheduleRow(k);
}
function remFromDay(sid,k){
  if(!sched[k])return;var arr=[];for(var i=0;i<sched[k].length;i++){if(sched[k][i]!==sid)arr.push(sched[k][i])}
  if(arr.length)sched[k]=arr;else delete sched[k];
  render();if(selDay)renderDayPanel(selDay);saveScheduleRow(k);
}
function startDrag(id,fromKey){dragId=id;dragFromKey=fromKey}
function dropOnDay(e,day){
  e.preventDefault();if(!dragId)return;
  var toK=dkey(day),sid=dragId,fromK=dragFromKey;dragId=null;dragFromKey=null;
  if(fromK&&sched[fromK]){var arr=[];for(var i=0;i<sched[fromK].length;i++){if(sched[fromK][i]!==sid)arr.push(sched[fromK][i])}if(arr.length)sched[fromK]=arr;else delete sched[fromK]}
  if(!sched[toK])sched[toK]=[];if(sched[toK].indexOf(sid)<0)sched[toK].push(sid);
  render();if(selDay)renderDayPanel(selDay);
  if(fromK&&fromK!==toK)saveScheduleRow(fromK);saveScheduleRow(toK);
}

// ── EDITOR ───────────────────────────────────────────────────
function openEditor(id){
  var isNew=!id;
  var s=isNew?{id:"",name:"",complexity:3,notes:""}:JSON.parse(JSON.stringify(getScene(id)));
  // Ensure all category keys exist on scene
  for(var i=0;i<catList.length;i++){if(!s[catList[i].key])s[catList[i].key]=[]}
  window._ed=s;renderEditor(isNew);
}
function renderEditor(isNew){
  var s=window._ed;
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">';
  h+='<h2>'+(isNew?'New Scene':'Edit Scene')+'</h2>';
  h+='<div class="field"><label>Scene Name</label><input id="ed-name" value="'+esc(s.name)+'" onchange="window._ed.name=this.value"></div>';
  for(var ci=0;ci<catList.length;ci++){
    var cat=catList[ci];
    h+='<div class="field"><label>'+esc(cat.label)+'</label><div class="tog-row">';
    for(var oi=0;oi<cat.options.length;oi++){
      var o=cat.options[oi],on=(s[cat.key]||[]).indexOf(o)>=0;
      h+='<button class="tog'+(on?' pos':'')+'" style="--tc:'+cat.color+'" onclick="togEdit(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';}
    h+='</div></div>';
  }
  h+='<div class="field"><label>Complexity</label><div class="cx-row">';
  for(var n=1;n<=5;n++)h+='<button class="cx-btn" onclick="setCx('+n+')" style="border:'+(s.complexity===n?'2px solid '+CC[n]:'1px solid #3a342e')+';background:'+(s.complexity===n?CC[n]+'33':'#1a1714')+';color:'+(s.complexity===n?CC[n]:'#8a7e72')+'">'+CL[n]+'</button>';
  h+='</div></div>';
  h+='<div class="field"><label>Notes</label><textarea id="ed-notes" rows="3" onchange="window._ed.notes=this.value">'+esc(s.notes)+'</textarea></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:8px"><div style="display:flex;gap:8px"><button class="mbtn gold" onclick="saveEdit()">Save</button><button class="mbtn ghost" onclick="closeModal()">Cancel</button></div>';
  if(!isNew)h+='<button class="mbtn red" onclick="deleteEdit(\''+s.id+'\')">Delete</button>';
  h+='</div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
}
function togEdit(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;var val=cat.options[idx];
  var s=window._ed;if(!s[catKey])s[catKey]=[];
  var i=s[catKey].indexOf(val);if(i>=0)s[catKey].splice(i,1);else s[catKey].push(val);
  renderEditor(!s.id);
}
function setCx(n){window._ed.complexity=n;renderEditor(!window._ed.id)}
function saveEdit(){
  var s=window._ed;s.name=document.getElementById("ed-name").value;s.notes=document.getElementById("ed-notes").value;
  if(!s.name.trim())return;if(!s.id)s.id="s"+Date.now();
  var idx=-1;for(var i=0;i<scenes.length;i++){if(scenes[i].id===s.id){idx=i;break}}
  if(idx>=0)scenes[idx]=s;else scenes.push(s);
  closeModal();render();if(selDay)renderDayPanel(selDay);saveSceneToSheet(s);toast("Scene saved","ok");
}
function deleteEdit(id){
  if(!confirm("Delete this scene?"))return;
  var ns=[];for(var i=0;i<scenes.length;i++){if(scenes[i].id!==id)ns.push(scenes[i])}scenes=ns;
  var ks=Object.keys(sched);for(var i=0;i<ks.length;i++){var arr=[];for(var j=0;j<sched[ks[i]].length;j++){if(sched[ks[i]][j]!==id)arr.push(sched[ks[i]][j])}if(arr.length)sched[ks[i]]=arr;else delete sched[ks[i]]}
  closeModal();render();if(selDay)renderDayPanel(selDay);deleteSceneFromSheet(id);toast("Scene deleted","ok");
}
function closeModal(){document.getElementById("modalMount").innerHTML=""}

// ── SETTINGS — Full category management ──────────────────────
var sTab=0,sRen=null,sRenVal="",sMode="options"; // sMode: "options" or "categories"

function openSettings(){sTab=0;sRen=null;sMode="options";renderSettings()}

function renderSettings(){
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" style="padding:0;max-width:720px" onclick="event.stopPropagation()"><div class="settings-wrap">';

  // Nav
  h+='<div class="settings-nav"><div class="sn-title">Settings</div>';
  // Category tabs
  for(var i=0;i<catList.length;i++){
    var c=catList[i];
    h+='<div class="sn-item'+(sMode==="options"&&sTab===i?' active':'')+'" onclick="sTab='+i+';sMode=\'options\';sRen=null;renderSettings()">'+esc(c.label)+' ('+c.options.length+')</div>';
  }
  h+='<div style="border-top:1px solid #3a342e;margin:12px 0"></div>';
  h+='<div class="sn-item'+(sMode==="categories"?' active':'')+'" style="font-weight:600" onclick="sMode=\'categories\';sRen=null;renderSettings()">Manage Categories</div>';
  h+='<div class="sn-item" style="color:#4a9e6e;font-weight:600" onclick="saveCatsToSheet()">Save Settings</div>';
  h+='<div class="sn-item" style="color:#c94040" onclick="closeModal()">Close</div></div>';

  h+='<div class="settings-body">';

  if(sMode==="options"&&catList[sTab]){
    // Edit options within a category
    var cat=catList[sTab];
    h+='<h3 style="font-family:EB Garamond,Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400;margin-bottom:14px">'+esc(cat.label)+'</h3>';
    h+='<div style="display:flex;gap:8px;margin-bottom:14px"><input id="set-new" placeholder="Add new '+esc(cat.label).toLowerCase()+' option..." style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:13px;outline:none" onkeydown="if(event.key===\'Enter\')addOpt()"><button class="mbtn gold" style="padding:7px 14px" onclick="addOpt()">Add</button></div>';
    for(var i=0;i<cat.options.length;i++){
      var v=cat.options[i];
      h+='<div class="cat-row">';
      if(sRen===i){
        h+='<input id="set-ren" value="'+esc(sRenVal)+'" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid #c49b2a66;background:#141210;color:#e8e0d6;font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')renameOpt('+i+');if(event.key===\'Escape\'){sRen=null;renderSettings()}">';
        h+='<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameOpt('+i+')">Save</button>';
        h+='<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="sRen=null;renderSettings()">Esc</button>';
      }else{
        var cnt=0;for(var j=0;j<scenes.length;j++){if(scenes[j][cat.key]&&scenes[j][cat.key].indexOf(v)>=0)cnt++}
        h+='<span class="cr-name">'+esc(v)+'</span>';
        h+='<span class="cr-count">'+cnt+'&times;</span>';
        if(i>0)h+='<button class="cat-row cr-up" onclick="moveOpt('+i+',-1)">&#9650;</button>';
        if(i<cat.options.length-1)h+='<button class="cat-row cr-dn" onclick="moveOpt('+i+',1)">&#9660;</button>';
        h+='<button class="cat-row cr-ren" onclick="sRen='+i+';sRenVal=catList[sTab].options['+i+'];renderSettings()">Rename</button>';
        h+='<button class="cat-row cr-del" onclick="delOpt('+i+')">Del</button>';
      }
      h+='</div>';
    }
  }

  if(sMode==="categories"){
    h+='<h3 style="font-family:EB Garamond,Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400;margin-bottom:14px">Manage Categories</h3>';
    h+='<div style="font-size:10px;color:#8a7e72;margin-bottom:12px">Add, rename, reorder, or remove entire categories. Changes affect the scene editor and day panel filters.</div>';
    h+='<div style="display:flex;gap:8px;margin-bottom:14px"><input id="cat-new-key" placeholder="Key (no spaces)" style="width:100px;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none"><input id="cat-new-label" placeholder="Display name" style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none"><input id="cat-new-color" placeholder="#color" value="#c49b2a" style="width:80px;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none"><button class="mbtn gold" style="padding:7px 14px" onclick="addCategory()">Add</button></div>';
    for(var i=0;i<catList.length;i++){
      var c=catList[i];
      h+='<div class="cat-row">';
      if(sRen===i){
        h+='<input id="cat-ren-label" value="'+esc(c.label)+'" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid #c49b2a66;background:#141210;color:#e8e0d6;font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')renameCat('+i+')">';
        h+='<input id="cat-ren-color" value="'+esc(c.color)+'" style="width:70px;padding:3px 7px;border-radius:4px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:11px;outline:none">';
        h+='<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameCat('+i+')">Save</button>';
        h+='<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="sRen=null;renderSettings()">Esc</button>';
      }else{
        h+='<div style="width:12px;height:12px;border-radius:3px;background:'+c.color+';flex-shrink:0"></div>';
        h+='<span class="cr-name">'+esc(c.label)+' <span style="color:#5a5248;font-size:10px">('+c.key+')</span></span>';
        h+='<span class="cr-count">'+c.options.length+' opts</span>';
        if(i>0)h+='<button class="cat-row cr-up" onclick="moveCat('+i+',-1)">&#9650;</button>';
        if(i<catList.length-1)h+='<button class="cat-row cr-dn" onclick="moveCat('+i+',1)">&#9660;</button>';
        h+='<button class="cat-row cr-ren" onclick="sRen='+i+';renderSettings()">Edit</button>';
        h+='<button class="cat-row cr-del" onclick="delCategory('+i+')">Del</button>';
      }
      h+='</div>';
    }
  }

  h+='</div></div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
  if(sRen!==null){var el=document.getElementById("set-ren")||document.getElementById("cat-ren-label");if(el)el.focus()}
}

// Options management
function addOpt(){var el=document.getElementById("set-new");var v=el.value.trim();if(!v)return;var cat=catList[sTab];if(cat.options.indexOf(v)>=0)return;cat.options.push(v);el.value="";renderSettings()}
function delOpt(idx){catList[sTab].options.splice(idx,1);renderSettings()}
function moveOpt(idx,dir){var opts=catList[sTab].options;var t=opts[idx];opts[idx]=opts[idx+dir];opts[idx+dir]=t;renderSettings()}
function renameOpt(idx){
  var nw=document.getElementById("set-ren").value.trim();var old=catList[sTab].options[idx];
  if(!nw||nw===old){sRen=null;renderSettings();return}
  catList[sTab].options[idx]=nw;
  var ck=catList[sTab].key;
  for(var i=0;i<scenes.length;i++){if(scenes[i][ck])for(var j=0;j<scenes[i][ck].length;j++){if(scenes[i][ck][j]===old)scenes[i][ck][j]=nw}}
  sRen=null;renderSettings();
}

// Category management
function addCategory(){
  var key=document.getElementById("cat-new-key").value.trim().replace(/\s+/g,"_");
  var label=document.getElementById("cat-new-label").value.trim();
  var color=document.getElementById("cat-new-color").value.trim()||"#c49b2a";
  if(!key||!label)return;
  for(var i=0;i<catList.length;i++){if(catList[i].key===key){toast("Key already exists","err");return}}
  catList.push({key:key,label:label,color:color,options:[]});
  renderSettings();
}
function delCategory(idx){
  if(!confirm("Delete category '"+catList[idx].label+"'? This won't remove data from existing scenes."))return;
  catList.splice(idx,1);if(sTab>=catList.length)sTab=Math.max(0,catList.length-1);renderSettings();
}
function moveCat(idx,dir){var t=catList[idx];catList[idx]=catList[idx+dir];catList[idx+dir]=t;renderSettings()}
function renameCat(idx){
  var nl=document.getElementById("cat-ren-label").value.trim();
  var nc=document.getElementById("cat-ren-color").value.trim();
  if(nl)catList[idx].label=nl;
  if(nc)catList[idx].color=nc;
  sRen=null;renderSettings();
}

function esc(s){if(!s)return"";var d=document.createElement("div");d.textContent=s;return d.innerHTML}

render();
loadFromSheet();
</script>
</body>
</html>
