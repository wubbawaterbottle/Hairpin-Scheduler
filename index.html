// ── COMPLETION: Shot / Pickup ────────────────────────────────
/* Both live in the sheet's STATUS column (roster category "status"). "Shot" means
   the scene is in the can; "Pickup" means shot but something still owed. The
   pickup note is a "Pickup: ..." line inside SCHED NOTES, so it stays visible in
   the sheet next to the scene. */
var SHOT="Shot",PICKUP="Pickup";
function isShot(s){return (s.status||[]).indexOf(SHOT)>=0}
function needsPickup(s){return (s.status||[]).indexOf(PICKUP)>=0}

/* ── PAGE WEIGHTS (hardcoded) ─────────────────────────────────
   How much of the screenplay each sequence is, in script pages, so the Shot stats can
   show "% of pages shot" as well as "% of sequences shot". Measured from "Project Hairpin
   Gold Draft.docx" (saved 2026-10-09) paginated by Word: one page = 55 lines, a sequence
   runs from its heading to the next one, and blank lines, scene gaps and page breaks
   count. Act / Midpoint headings belong to the sequence that follows them; FADE IN to
   SEQ 1. The key is the sequence number as the sheet writes it. The draft's second "45"
   (KIM'S BETRAYAL) is SEQ 46 here, matching the sheet. 64 sequences, 92.602 pages.
   The script is not changing, so these are fixed; if a sequence is added or renumbered,
   add or edit its line here. A shot sequence missing from this table is listed in the
   hover text of the Pages card instead of being silently dropped. */
var SEQ_PAGES={
  "1":1.545,"2":0.291,"3":3.673,"4":1.782,"5":1.909,"6":1.472,
  "7":1.474,"8":2.946,"9":0.454,"10":1.327,"11":2.128,"12":2.236,
  "13":1.327,"14":1.163,"15":0.800,"15.5":0.819,"16":1.454,"17":3.819,
  "18":0.437,"19":2.127,"20":0.672,"21":0.183,"21.5":0.963,"22":3.218,
  "23":0.454,"24":0.491,"24.5":0.255,"25":0.727,"26":0.180,"27":4.747,
  "27.5":0.291,"28":0.381,"28.5":0.255,"29":0.545,"29.5":1.728,"30":0.146,
  "30.5":0.655,"31":0.490,"32":0.945,"33":0.327,"33.5":1.164,"34":0.654,
  "34.5":0.782,"35":2.436,"36":0.492,"37":3.710,"38":1.236,"39":4.236,
  "40":1.109,"40.5":2.000,"41":4.946,"42":0.746,"43":1.000,"44":0.308,
  "44.25":0.200,"44.5":0.746,"45":1.272,"46":2.346,"46.5":3.855,"47":1.381,
  "48":1.109,"48.5":1.945,"49":2.746,"50":1.347
};
var SEQ_PAGES_TOTAL=(function(){var t=0;for(var k in SEQ_PAGES)if(SEQ_PAGES.hasOwnProperty(k))t+=SEQ_PAGES[k];return t})();
function seqPageKey(s){var m=String(s.seq!=null&&s.seq!==""?s.seq:(s.seqLabel||"")).match(/[0-9]+(?:\.[0-9]+)?/);return m?String(parseFloat(m[0])):""}
/** 0 -> "0%", all -> "100%", otherwise one decimal ("23.4%"). */
function fmtPct(n,d){if(!d||!n)return"0%";if(n>=d-1e-9)return"100%";return(Math.round(n/d*1000)/10).toFixed(1)+"%"}
/** How much of a sequence is shot: 1 when marked Shot, 0.5 when marked Pickup (pickups are still owed), else 0. */
function shotWeight(s){return needsPickup(s)?0.5:(isShot(s)?1:0)}
function fmtN(x){return String(Math.round(x*10)/10)}
/** Sequences shot + pages shot, both weighted by shotWeight (a Pickup sequence counts as half a sequence and half its pages). */
function shotStats(){
  var seen={},pg=0,unmapped=[],n=0;
  for(var i=0;i<scenes.length;i++){
    var s=scenes[i],w=shotWeight(s);if(!w)continue;n+=w;
    var k=seqPageKey(s);
    if(k&&SEQ_PAGES.hasOwnProperty(k)){if(!seen[k]){seen[k]=1;pg+=SEQ_PAGES[k]*w}}
    else unmapped.push(s.seqLabel||s.seq||"?");
  }
  return {seqShot:n,seqTotal:scenes.length,pgShot:pg,pgTotal:SEQ_PAGES_TOTAL,unmapped:unmapped};
}
function splitNotes(notes){
  var lines=String(notes||"").split(/\r?\n/),pk=[],rest=[];
  for(var i=0;i<lines.length;i++){if(/^\s*pickup\s*:/i.test(lines[i]))pk.push(lines[i].replace(/^\s*pickup\s*:\s*/i,""));else rest.push(lines[i])}
  return {pickup:pk.join(" ").trim(),notes:rest.join("\n").trim()};
}
function joinNotes(notes,pickup){var out=[];if(notes)out.push(notes);if(pickup)out.push("Pickup: "+String(pickup).replace(/\s*\n\s*/g," ").trim());return out.join("\n")}
function pickupNote(s){return splitNotes(s.notes).pickup}
/** Makes sure the roster category has the value, so highlight and editor rows show it. */
function ensureStatusOption(val){var cat=getCat("status");if(cat&&cat.options.indexOf(val)<0){cat.options.push(val);if(cat.meta)cat.meta[val]={color:"",note:"",aliases:[]}}}
/** One-click toggle from a chip or call sheet. Writes only the STATUS cell. */
function toggleFlag(uid,flag){
  var s=getScene(uid);if(!s)return;
  if(!canEdit()){promptEditKey();return}
  if(!s.status)s.status=[];
  var i=s.status.indexOf(flag);
  if(i>=0)s.status.splice(i,1);else s.status.push(flag);
  ensureStatusOption(flag);
  render();
  if(window.tmOnSceneFlag)tmOnSceneFlag(uid);   // Task Manager shows the same flag
  saveSceneFields(s,{"STATUS":s.status},null).then(function(){toast(flag===SHOT?(isShot(s)?"Marked shot":"Back to unshot"):(needsPickup(s)?"Pickup flagged":"Pickup cleared"),"ok")});
}
/** The two small buttons that appear on chips and scene cards. */
function flagButtons(s){
  if(!canEdit())return"";
  return'<span class="flag-acts">'+
    '<button class="fa'+(isShot(s)?' on':'')+'" title="'+(isShot(s)?'Shot — click to unmark':'Mark as shot')+'" onclick="event.stopPropagation();toggleFlag(\''+s.uid+'\',SHOT)">&#10003;</button>'+
    '<button class="fa pk'+(needsPickup(s)?' on':'')+'" title="'+(needsPickup(s)?'Pickup owed'+(pickupNote(s)?': '+esc(pickupNote(s)):'')+' — click to clear':'Flag a pickup')+'" onclick="event.stopPropagation();toggleFlag(\''+s.uid+'\',PICKUP)">&#9685;</button></span>';
}
function flagClasses(s){return (isShot(s)?" done":"")+(needsPickup(s)?" pickup":"")}
function pickupTag(s){return needsPickup(s)?'<span class="pk-tag" title="'+esc(pickupNote(s)||"Pickup owed")+'">pickup</span>':''}

/** Loose match, mirroring normKey() in the Apps Script. */
function nk(s){
  return String(s||"").toUpperCase().replace(/’/g,"'").replace(/\([^)]*\)/g," ")
    .replace(/['.\-]/g,"").replace(/[^A-Z0-9 /&]/g," ").replace(/\s+/g," ").trim();
}

function saveRosters(){
  var rows=[],seen={};
  for(var i=0;i<catList.length;i++){
    var c=catList[i];
    for(var j=0;j<c.options.length;j++){
      var nm=c.options[j],m=(c.meta&&c.meta[nm])||{};
      var k=c.key+"|"+nk(nm);
      if(seen[k])continue;            // never write the same value twice
      seen[k]=true;
      // aliases and notes ride along untouched — losing them would break the
      // consolidation that maps "MR. DRUMMOND" onto "Cobb/Drummond"
      rows.push([c.key,nm,m.color||c.color,(m.aliases||[]).join("; "),m.note||""]);
    }
  }
  return apiWrite({action:"saveRosters",rows:rows}).then(function(r){
    if(r&&r.error)toast("Settings save failed: "+r.error,"err");else toast("Settings saved","ok");
  });
}

// ── RENDER ───────────────────────────────────────────────────
function render(){renderLeft();renderCal();if(selDay)renderDayPanel(selDay)}

function toggleSidebar(){sidebarOpen=!sidebarOpen;applySidebar()}
function applySidebar(){
  var el=document.getElementById("leftPanel"),bd=document.getElementById("sbBackdrop"),bt=document.getElementById("sbToggle");
  if(!el)return;
  if(sidebarOpen){el.classList.add("open");if(bd)bd.classList.add("show");if(bt)bt.classList.add("gold")}
  else{el.classList.remove("open");if(bd)bd.classList.remove("show");if(bt)bt.classList.remove("gold")}
}
function setSort(m){sortMode=m;renderLeft()}
function setSortS(m){sortModeS=m;renderLeft()}
function toggleSec(w){if(w==="un")openUn=!openUn;else openSch=!openSch;renderLeft()}

function alphaCmp(a,b){return String(a||"").localeCompare(String(b||""),undefined,{numeric:true,sensitivity:"base"})}
function sortFn(mode){
  if(mode==="date")return function(a,b){
    var da=a.shootDay||"9999",db=b.shootDay||"9999";
    if(da!==db)return da<db?-1:1;
    return seqNum(a)-seqNum(b);
  };
  if(mode==="complexity")return function(a,b){return (b.complexity||0)-(a.complexity||0)||seqNum(a)-seqNum(b)};
  if(mode==="location")return function(a,b){
    var la=(a.locations&&a.locations.length)?a.locations[0]:"~none";
    var lb=(b.locations&&b.locations.length)?b.locations[0]:"~none";
    return alphaCmp(la,lb)||seqNum(a)-seqNum(b);
  };
  return function(a,b){return seqNum(a)-seqNum(b)};
}

function chipHTML(s,dateLabel){
  var cls="chip"+flagClasses(s);

  h+='<div class="name">'+(dateLabel?'<span class="cdate">'+dateLabel+'</span>':'')+flagButtons(s)+esc(s.name)+pickupTag(s)+'</div><div class="tags">';
  for(var j=0;j<(s.cast||[]).length;j++)h+='<span>'+esc(s.cast[j])+'</span>';
  for(var j=0;j<(s.timeOfDay||[]).length;j++)h+='<span class="tod">'+esc(s.timeOfDay[j])+'</span>';
  return h+'</div></div>';
}
function sortSelect(fn,cur,opts){

// ── HIGHLIGHT ────────────────────────────────────────────────
function hlActive(){for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v&&v.length)return true}return false}

/* AND, not OR. Toggling Rhodes then Peter highlights only the scenes that have
   BOTH of them — every selected value must be present, in every category. */
function hlMatch(s){
  for(var ci=0;ci<catList.length;ci++){
    var ck=catList[ci].key,sel=highlight[ck];
    if(!sel||!sel.length)continue;
    var sv=s[ck]||[];
    for(var j=0;j<sel.length;j++){if(sv.indexOf(sel[j])<0)return false}
  }
  return true;
}
function toggleHL(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx];
  if(!highlight[catKey])highlight[catKey]=[];
  var i=highlight[catKey].indexOf(val);
  if(i>=0)highlight[catKey].splice(i,1);else highlight[catKey].push(val);
  if(!highlight[catKey].length)delete highlight[catKey];
  renderCal();renderLeft();
}
function clearHL(){highlight={};renderCal();renderLeft()}
function toggleHLBar(){hlOpen=!hlOpen;renderCal()}
function hlDates(){
  var out=[],dts=shootDates();
  for(var i=0;i<dts.length;i++){
    var list=scenesOn(dts[i]);
    for(var j=0;j<list.length;j++){if(hlMatch(list[j])){out.push(dts[i]);break}}
  }
  return out;
}

function renderHLBar(){
  var on=hlActive(),n=0;
  for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v)n+=v.length}
  var h='<div class="hl-bar"><div class="hl-head" onclick="toggleHLBar()">';
  h+='<span class="hl-arrow">'+(hlOpen?"&#9660;":"&#9654;")+'</span>';
  h+='<span class="hl-t">Highlight Scenes</span>';
  if(on)h+='<span class="hl-badge">'+n+' active</span>';
  h+='</div>';
  if(hlOpen){
    h+='<div class="hl-body">';
    for(var ci=0;ci<catList.length;ci++){
      var cat=catList[ci];
      if(!cat.options.length)continue;
      h+='<div class="hl-cat"><div class="hl-label">'+esc(cat.label)+'</div><div class="tog-row">';
      for(var oi=0;oi<cat.options.length;oi++){
        var o=cat.options[oi];
        var sel=highlight[cat.key]&&highlight[cat.key].indexOf(o)>=0;
        h+='<button class="tog'+(sel?' pos':'')+'" style="--tc:'+cat.color+'" onclick="toggleHL(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
      }
      h+='</div></div>';
    }
    if(on){
      var total=0,dts=shootDates();
      for(var i=0;i<dts.length;i++){var L=scenesOn(dts[i]);for(var j=0;j<L.length;j++){if(hlMatch(L[j]))total++}}
      var hd=hlDates(),labels=[];
      for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v&&v.length)labels=labels.concat(v)}
      var shown=hd.slice(0,14).map(fmtDK).join(" &middot; ");
      if(hd.length>14)shown+=" &middot; +"+(hd.length-14)+" more";
      h+='<div class="hl-summary"><span class="hs-name">'+esc(labels.join(" + "))+'</span> &mdash; '+total+' scene'+(total===1?"":"s")+' across '+hd.length+' shoot day'+(hd.length===1?"":"s");
      if(hd.length)h+='<br><span class="hs-dates">'+shown+'</span>';
      h+='</div><div style="margin-top:8px"><button class="hl-clear" onclick="clearHL()">Clear highlights</button></div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

// ── CALENDAR ─────────────────────────────────────────────────
function dayMinutes(list){var m=0;for(var i=0;i<list.length;i++)m+=list[i].lengthMin||0;return m}
function dayUnlocked(list){
  for(var i=0;i<list.length;i++){
    var st=(list[i].locStatus||"").toLowerCase();
    if(!st||st.indexOf("need")>=0||st.indexOf("undecided")>=0||st.indexOf("decid")>=0)return true;
  }
  return false;
}
function dayLenses(list){
  var out=[];
  for(var i=0;i<list.length;i++)for(var j=0;j<(list[i].lens||[]).length;j++){
    if(out.indexOf(list[i].lens[j])<0)out.push(list[i].lens[j]);
  }
  return out;
}

/* Phones only (hidden by CSS on wider screens): the month's shoot days as a
   readable list, because calendar cells are too narrow to show scene names.
   Tapping a day opens the same day panel as tapping its calendar cell. */
function renderAgenda(HLON){
  var dim=daysIn(yr,mo),rows="",n=0;
  for(var d=1;d<=dim;d++){
    var k=dkey(d),ds=scenesOn(k);
    if(!ds.length)continue;
    n++;
    var dt=new Date(yr,mo,d),past=k<TODAY_KEY,isToday=k===TODAY_KEY;
    var shotN=0;for(var j=0;j<ds.length;j++)if(isShot(ds[j]))shotN++;
    var cls="ag-day"+(isToday?" today":"")+(past?" past":"")+(shotN===ds.length?" alldone":"")+(selDay===d?" sel":"");
    if(HLON){var hits=0;for(var j=0;j<ds.length;j++)if(hlMatch(ds[j]))hits++;if(!hits)cls+=" hl-dim"}
    rows+='<div class="'+cls+'" onclick="selectDay('+d+')">';
    rows+='<div class="ag-date"><span class="ag-dow">'+DN[dt.getDay()]+'</span><span class="ag-num">'+d+'</span>'+(isToday?'<span class="ag-today">Today</span>':'')+'</div>';
    rows+='<div class="ag-body">';
    for(var j=0;j<ds.length;j++){
      var s=ds[j],loc=(s.locations||[])[0]||"";
      rows+='<div class="ag-scene'+flagClasses(s)+(HLON?(hlMatch(s)?" hl-on":" hl-off"):"")+'" style="border-left-color:'+CC[s.complexity]+'">'
          +'<span class="ag-name">'+(isShot(s)?'&#10003; ':'')+esc(s.name)+'</span>'
          +(loc?'<span class="ag-loc">'+esc(loc)+'</span>':'')
          +(needsPickup(s)?'<span class="ag-pk">pickup</span>':'')+'</div>';
    }
    rows+='</div>'+(dayUnlocked(ds)?'<span class="ag-warn" title="A location on this day is not confirmed">&#9888;</span>':'')+'</div>';
  }
  return '<div class="agenda"><div class="ag-title">Shoot days in '+MO[mo]+'</div>'+(n?rows:'<div class="ag-empty">No shoot days this month.</div>')+'</div>';
}

/** Sequences shot / pages shot, drawn in the header strip so they stay at the top of the page. */
function renderShotStrip(){
  var el=document.getElementById("shotStrip");if(!el)return;
  var ss=shotStats();
  if(!ss.seqTotal){el.hidden=true;el.innerHTML="";fitHeader();return}
  function card(label,frac,n,d,tip){
    var done=d>0&&n>=d-1e-9,p=d>0?Math.min(100,n/d*100):0;
    return'<div class="shot-card'+(done?' done':'')+'" title="'+esc(tip)+'"><div class="sc-top"><span class="sc-l">'+label+'</span><span class="sc-pc">'+fmtPct(n,d)+'</span></div><div class="sc-n">'+frac+'</div><div class="sc-bar"><i style="width:'+p.toFixed(1)+'%"></i></div></div>'
  }
  var pgTip="Script pages shot / total script pages (one page = 55 lines of the Gold Draft). A Pickup sequence counts half its pages."+(ss.unmapped.length?" Not in the page table, so not counted: "+ss.unmapped.join(", "):"");
  var seqPc=ss.seqTotal>0?ss.seqShot/ss.seqTotal*100:0,pgPc=ss.pgTotal>0?ss.pgShot/ss.pgTotal*100:0,avgPc=(seqPc+pgPc)/2,allDone=avgPc>=100-1e-9;
  var totalCard='<div class="shot-card total'+(allDone?' done':'')+'" title="'+esc("Total complete = the average of % of sequences shot ("+fmtPct(ss.seqShot,ss.seqTotal)+") and % of pages shot ("+fmtPct(ss.pgShot,ss.pgTotal)+")")+'"><div class="sc-top"><span class="sc-l">Total complete</span></div><div class="sc-n">'+fmtPct(avgPc,100)+'</div><div class="sc-sub">avg of sequences + pages</div><div class="sc-bar"><i style="width:'+Math.min(100,avgPc).toFixed(1)+'%"></i></div></div>';
  el.innerHTML=card("Sequences shot",fmtN(ss.seqShot)+" / "+ss.seqTotal,ss.seqShot,ss.seqTotal,"Sequences marked Shot count 1, sequences marked Pickup count 0.5")+totalCard
    +card("Pages shot",(Math.round(ss.pgShot*10)/10).toFixed(1)+" / "+(Math.round(ss.pgTotal*10)/10).toFixed(1),ss.pgShot,ss.pgTotal,pgTip);
  el.hidden=false;fitHeader();
}

function renderCal(){
  var el=document.getElementById("calWrap");
  var dim=daysIn(yr,mo),fd=firstDow(yr,mo);
  var HLON=hlActive();
  var warnMin=(parseFloat(settings.dayHoursWarn)||10)*60;
  var unschedCount=0,schedCount=0;
  for(var i=0;i<scenes.length;i++){if(scenes[i].shootDay)schedCount++;else unschedCount++}

  var onNow=(yr===TODAY.getFullYear()&&mo===TODAY.getMonth());
  var h='<div class="cal-nav"><button onclick="prevMo()">&#8249;</button><h2>'+MO[mo]+' '+yr+'</h2><button onclick="nextMo()">&#8250;</button>'
       +'<button class="cal-today" onclick="goToday()" title="Jump to today"'+(onNow?' disabled':'')+'>Today</button></div><div class="cal-grid">';
  for(var i=0;i<7;i++)h+='<div class="cal-head">'+DN[i]+'</div>';
  for(var i=0;i<fd;i++)h+='<div></div>';
  for(var d=1;d<=dim;d++){
    var k=dkey(d),ds=scenesOn(k);
    var sel=selDay===d,we=(fd+d-1)%7===0||(fd+d-1)%7===6;
    var mins=dayMinutes(ds);

    var hitCount=0;
    if(HLON){
      var hit=[],miss=[];
      for(var j=0;j<ds.length;j++){if(hlMatch(ds[j]))hit.push(ds[j]);else miss.push(ds[j])}
      hitCount=hit.length;ds=hit.concat(miss);
    }
    var cls="cal-day"+(sel?" sel":"")+(we?" we":"")+(k===TODAY_KEY?" today":"");
    if(HLON)cls+=hitCount?" hl-hit":" hl-dim";
    var shotN=0,pkN=0;for(var j=0;j<ds.length;j++){if(isShot(ds[j]))shotN++;if(needsPickup(ds[j]))pkN++}
    if(ds.length&&shotN===ds.length)cls+=" alldone";

    h+='<div class="'+cls+'" onclick="selectDay('+d+')" ondragover="event.preventDefault()" ondrop="dropOnDay(event,'+d+')">';
    h+='<div class="dnum"><span>'+d+'</span>';
    if(HLON&&hitCount)h+='<span class="hl-count">'+hitCount+'</span>';
    else if(ds.length&&shotN===ds.length)h+='<span class="badge done-badge" title="Every scene this day is shot">&#10003; shot'+(pkN?' · '+pkN+' pickup':'')+'</span>';
    else if(ds.length){
      var over=mins>warnMin;
      h+='<span class="badge" style="background:'+(over?'rgb(var(--red-rgb) / 0.2)':'rgb(var(--amber-rgb) / 0.133)')+';color:'+(over?'var(--red-hi)':'var(--amber)')+'">'+(mins?fmtMin(mins):ds.length+"s")+(shotN?' · '+shotN+'&#10003;':'')+'</span>';
    }
    h+='</div>';
    for(var j=0;j<Math.min(ds.length,4);j++){
      var s=ds[j],mc="mini-chip"+flagClasses(s);
      if(HLON)mc+=hlMatch(s)?" hl-on":" hl-off";
      h+='<div class="'+mc+'" title="'+esc(s.name)+(isShot(s)?' — shot':'')+(needsPickup(s)?' — pickup: '+esc(pickupNote(s)||'owed'):'')+'" draggable="'+(canEdit()?'true':'false')+'" ondragstart="event.stopPropagation();startDrag(\''+s.uid+'\')" style="background:'+CC[s.complexity]+'22;border-left:2px solid '+CC[s.complexity]+';color:'+CC[s.complexity]+'">'+(isShot(s)?'&#10003; ':'')+esc(s.name)+'</div>';
    }
    if(ds.length>4)h+='<div style="font-size:8px;color:var(--faint);text-align:center">+'+(ds.length-4)+'</div>';
    if(ds.length&&dayUnlocked(ds))h+='<div class="warn" title="A location on this day is not confirmed">&#9888;</div>';
    h+='</div>';
  }
  h+='</div>'+renderAgenda(HLON)+'<div class="stats">';
  var pkCount=0;for(var i=0;i<scenes.length;i++){if(needsPickup(scenes[i]))pkCount++}
  var arr=[{v:shootDates().length,l:"Shoot Days",c:"var(--ink-hi)"},
           {v:schedCount,l:"Scheduled",c:"var(--ink-hi)"},
           {v:unschedCount,l:"Unscheduled",c:unschedCount?"var(--amber)":"var(--green)"},
           {v:pkCount,l:"Pickups owed",c:pkCount?"var(--purple-hi)":"var(--faint)"}];
  for(var i=0;i<arr.length;i++)h+='<div class="s"><div class="n" style="color:'+arr[i].c+'">'+arr[i].v+'</div><div class="l">'+arr[i].l+'</div></div>';
  h+='</div>'+renderHLBar();
  el.innerHTML=h;
  renderShotStrip();
}

// ── DAY PANEL / CALL SHEET ───────────────────────────────────
var dpAvail={};
function initDpAvail(){dpAvail={};for(var i=0;i<catList.length;i++)dpAvail[catList[i].key]={pos:[],neg:[]}}

function collect(list,pick){
  var out=[];
  for(var i=0;i<list.length;i++){
    var v=pick(list[i])||[];
    for(var j=0;j<v.length;j++){if(out.indexOf(v[j])<0)out.push(v[j])}
  }
  return out;
}
function personFor(canonName){
  for(var i=0;i<people.length;i++){
    var p=people[i];if(p.group!=="Cast")continue;
    var role=(p.role||"").toLowerCase();
    if(role.indexOf(canonName.toLowerCase())>=0)return p;
    var parts=canonName.toLowerCase().split("/");
    for(var j=0;j<parts.length;j++){if(parts[j].trim()&&role.indexOf(parts[j].trim())>=0)return p}
  }
  return null;
}

function renderDayPanel(day){
  var k=dkey(day),assigned=scenesOn(k);
  var meta=days[k]||{label:"",call:"",wrap:"",notes:""};
  var unsched=[];for(var i=0;i<scenes.length;i++){if(!scenes[i].shootDay)unsched.push(scenes[i])}
  var mins=dayMinutes(assigned);
  var warnMin=(parseFloat(settings.dayHoursWarn)||10)*60;

  var hasF=false;
  for(var ci=0;ci<catList.length;ci++){var ck=catList[ci].key;if(!dpAvail[ck])dpAvail[ck]={pos:[],neg:[]};if(dpAvail[ck].pos.length||dpAvail[ck].neg.length){hasF=true;break}}

  var matches=[];
  if(hasF){
    for(var i=0;i<unsched.length;i++){
      var s=unsched[i],ok=true;
      for(var ci=0;ci<catList.length;ci++){
        var ck=catList[ci].key;
        if(!dpAvail[ck])continue;
        var pos=dpAvail[ck].pos,neg=dpAvail[ck].neg,sv=s[ck]||[];
        // include = AND: every ticked value must be on the scene, matching the
        // highlight bar. Tom + Rhodes means scenes with both, not either.
        if(pos.length>0){for(var j=0;j<pos.length;j++){if(sv.indexOf(pos[j])<0){ok=false;break}}if(!ok)break}
        // exclude = the scene must have none of these
        if(neg.length>0){for(var j=0;j<sv.length;j++){if(neg.indexOf(sv[j])>=0){ok=false;break}}if(!ok)break}
      }
      if(ok)matches.push(s);
    }
    matches.sort(function(a,b){return b.complexity-a.complexity});
  }

  var h='<div class="daypanel"><div class="dp-head"><h2>'+DN[new Date(yr,mo,day).getDay()]+' '+MO[mo]+' '+day+', '+yr+'</h2>';
  h+='<div style="display:flex;gap:5px"><button class="hbtn" onclick="window.print()" title="Print call sheet" aria-label="Print call sheet">'+ICON.print+'</button>';
  h+='<button class="hbtn icon" onclick="closeDay()" title="Close" aria-label="Close">'+ICON.close+'</button></div></div><div class="dp-body">';

  if(assigned.length){
    var cams=collect(assigned,function(s){return s.camera});
    var lenses=dayLenses(assigned);
    var tc=0;for(var i=0;i<assigned.length;i++)tc+=assigned[i].complexity;

    h+='<div class="cs-top">';
    h+='<div class="cs-stat"><div class="v">'+(mins?fmtMin(mins):"—")+'</div><div class="l">Est. Hours</div></div>';
    h+='<div class="cs-stat"><div class="v">'+assigned.length+'</div><div class="l">Scenes</div></div>';
    h+='<div class="cs-stat"><div class="v">'+tc+'</div><div class="l">Complexity</div></div>';
    h+='</div>';

    if(mins>warnMin)h+='<div class="cs-warn red">Over '+(settings.dayHoursWarn||10)+' hours &mdash; '+fmtMin(mins)+' scheduled.</div>';
    if(lenses.length>1)h+='<div class="cs-warn amber">Two lens packages on one day: '+esc(lenses.join(" &middot; "))+'. Budget a rebuild.</div>';
    if(dayUnlocked(assigned))h+='<div class="cs-warn amber">A location on this day is not confirmed yet.</div>';

    if(cams.length)h+='<div style="font-size:10px;color:var(--muted);margin-bottom:4px">Camera: <span style="color:var(--ink-3)">'+esc(cams.join(", "))+'</span> &nbsp;·&nbsp; Lens: <span style="color:var(--ink-3)">'+esc(lenses.join(", "))+'</span></div>';

    // Locations with address + lock status
    var locs=collect(assigned,function(s){return s.locations});
    if(locs.length){
      h+='<div class="dp-section">Locations</div>';
      for(var i=0;i<locs.length;i++){
        var addr="",stat="";
        for(var j=0;j<assigned.length;j++){
          if((assigned[j].locations||[]).indexOf(locs[i])>=0){
            if(!addr&&assigned[j].address)addr=assigned[j].address;
            if(!stat&&assigned[j].locStatus)stat=assigned[j].locStatus;
          }
        }
        var bad=!stat||stat.toLowerCase().indexOf("need")>=0||stat.toLowerCase().indexOf("undecided")>=0;
        h+='<div class="loc-row"><div class="lr-n">'+esc(locs[i])+'</div>';
        if(addr)h+='<div class="lr-a">'+esc(addr.replace(/\n+/g," · "))+'</div>';
        h+='<div class="lr-s" style="color:'+(bad?"var(--amber)":"var(--green)")+'">'+esc(stat||"Not confirmed")+'</div></div>';
      }
    }

    // Cast call
    var cast=collect(assigned,function(s){return s.cast});
    if(cast.length){
      h+='<div class="dp-section">Cast Call ('+cast.length+')</div>';
      for(var i=0;i<cast.length;i++){
        var inSeqs=[];
        for(var j=0;j<assigned.length;j++){if((assigned[j].cast||[]).indexOf(cast[i])>=0)inSeqs.push("SEQ "+assigned[j].seq)}
        var p=personFor(cast[i]);
        h+='<div class="cast-row"><span class="cr-n">'+esc(cast[i])+'</span>';
        h+='<span class="cr-a">'+esc(p?p.name:"")+(p&&p.availability?' <span class="cr-s">('+esc(p.availability.split("\n")[0])+')</span>':"")+'</span>';
        h+='<span class="cr-s">'+inSeqs.join(", ")+'</span></div>';
      }
    }

    // Scene cards
    h+='<div class="dp-section">Scenes</div>';
    for(var i=0;i<assigned.length;i++){
      var s=assigned[i],open=!!openScene[s.uid];
      h+='<div class="sc-card'+flagClasses(s)+'">';
      h+='<div class="sc-h" onclick="toggleScene(\''+s.uid+'\')">';
      h+='<span class="sc-seq" style="background:'+CC[s.complexity]+'">'+esc(s.seqLabel||("SEQ "+s.seq))+'</span>';
      h+='<div class="sc-t"><div class="sc-name">'+esc(s.title)+pickupTag(s)+'</div><div class="sc-slug">'+esc(s.slugline)+'</div></div>';
      h+=flagButtons(s);
      h+='<div class="sc-len">'+(s.length?esc(s.length.replace(/:00$/,"")):"—")+'</div></div>';
      if(open){
        h+='<div class="sc-body">';
        if(needsPickup(s))h+='<div class="pk-note"><b>Pickup owed:</b> '+esc(pickupNote(s)||"(no note yet — add one in Edit scheduling)")+'</div>';
        if(s.shortSummary)h+='<p style="color:var(--ink-hi)">'+esc(s.shortSummary)+'</p>';
        if(s.detail)h+='<p>'+esc(s.detail)+'</p>';
        var dept=[["Cast",s.raw.cast],["Extras",s.raw.extras],["Vehicles",s.raw.vehicles],
                  ["Props / Weapons",s.raw.props],["Wardrobe",s.raw.wardrobe],
                  ["Hair / Makeup",s.raw.hairMakeup],["Stunts / Action",s.raw.stunts],
                  ["VFX / SFX",s.raw.vfx]];
        for(var d2=0;d2<dept.length;d2++){
          if(!dept[d2][1]||!dept[d2][1].length)continue;
          h+='<div class="sc-dept"><div class="dl">'+dept[d2][0]+'</div><div class="dv">'+esc(dept[d2][1].join(" · "))+'</div></div>';
        }
        h+='<div style="display:flex;gap:5px;margin-top:10px">';
        h+='<button class="mbtn ghost" style="padding:4px 10px;font-size:10px" onclick="event.stopPropagation();openEditor(\''+s.uid+'\')">'+(canEdit()?'Edit scheduling':'Open scene')+'</button>';
        if(canEdit())h+='<button class="mbtn red" style="padding:4px 10px;font-size:10px" onclick="event.stopPropagation();unschedule(\''+s.uid+'\')">Unschedule</button>';
        h+='</div>';
        h+='</div>';
      }
      h+='</div>';
    }

    // Department roll-ups
    h+='<div class="dp-section">Department Roll-up</div>';
    var rolls=[["Props / Weapons",collect(assigned,function(s){return s.raw.props})],
               ["Wardrobe",collect(assigned,function(s){return s.raw.wardrobe})],
               ["Hair / Makeup",collect(assigned,function(s){return s.raw.hairMakeup})],
               ["Stunts / Action",collect(assigned,function(s){return s.raw.stunts})],
               ["VFX / SFX",collect(assigned,function(s){return s.raw.vfx})],
               ["Extras",collect(assigned,function(s){return s.raw.extras})]];
    for(var i=0;i<rolls.length;i++){
      if(!rolls[i][1].length)continue;
      h+='<div class="roll"><b>'+rolls[i][0]+'</b>'+esc(rolls[i][1].join(" · "))+'</div>';
    }

    h+='<div class="dp-section">Day Notes</div>';
    h+='<textarea id="dp-notes" rows="2" placeholder="Generator on site, contract signed..."'+(canEdit()?'':' readonly')+' style="width:100%;padding:7px 9px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:11px;outline:none;resize:vertical">'+esc(meta.notes)+'</textarea>';
    if(canEdit())h+='<button class="mbtn ghost" style="margin-top:5px;padding:5px 12px;font-size:11px" onclick="saveDayEdits(\''+k+'\')">Save notes</button>';
    h+='<div style="height:18px"></div>';
  }

  // Resource filter
  h+='<div class="res-box"><div class="rb-title">What do you have this day?</div>';
  h+='<div class="rb-hint">Click = must have (gold). Click again = must not have (red). Click again = off.<br>Picking Tom and Rhodes finds scenes with <strong>both</strong>, not either.</div>';
  for(var ci=0;ci<catList.length;ci++){
    var cat=catList[ci];
    if(!cat.options.length)continue;
    if(!dpAvail[cat.key])dpAvail[cat.key]={pos:[],neg:[]};
    h+='<div class="res-cat"><div class="rc-label">'+esc(cat.label)+'</div><div class="tog-row">';
    for(var oi=0;oi<cat.options.length;oi++){
      var o=cat.options[oi];
      var inPos=dpAvail[cat.key].pos.indexOf(o)>=0;
      var inNeg=dpAvail[cat.key].neg.indexOf(o)>=0;
      var cls2="tog";
      if(inPos)cls2+=" pos";else if(inNeg)cls2+=" neg";
      h+='<button class="'+cls2+'" style="--tc:'+cat.color+'" onclick="cycleAvail(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
    }
    h+='</div></div>';
  }
  h+='</div>';

  if(hasF){
    h+='<div class="dp-section">Scenes That Fit ('+matches.length+')</div>';
    if(!matches.length)h+='<div style="font-size:11px;color:var(--faint);text-align:center;padding:12px">No unscheduled scenes match</div>';
    for(var i=0;i<matches.length;i++){
      var s=matches[i];
      h+='<div class="match-item"><div class="mi-info" onclick="openEditor(\''+s.uid+'\')" style="background:'+CC[s.complexity]+'15;border:1px solid '+CC[s.complexity]+'44;border-left:3px solid '+CC[s.complexity]+'"><div class="mi-name">'+esc(s.name)+'</div><div class="mi-meta">'+esc((s.cast||[]).join(", "))+' &middot; '+esc((s.locations||[]).join(", "))+'</div></div>'+(canEdit()?'<button class="mi-add" onclick="addToDay(\''+s.uid+'\','+day+')">+ Add</button>':'')+'</div>';
    }
  }else{
    h+='<div style="font-size:11px;color:var(--faint);text-align:center;padding:16px">Toggle resources above to find matching scenes</div>';
  }
  h+='</div></div>';
  document.getElementById("dayPanelMount").innerHTML=h;
}

function toggleScene(uid){openScene[uid]=!openScene[uid];if(selDay)renderDayPanel(selDay)}
function saveDayEdits(k){
  // label/call/wrap are no longer edited here; keep whatever the sheet already has
  var prev=days[k]||{label:"",call:"",wrap:"",notes:""},n=document.getElementById("dp-notes");
  var d={label:prev.label||"",call:prev.call||"",wrap:prev.wrap||"",notes:n?n.value:prev.notes||""};
  days[k]=d;saveDayMeta(k,d).then(function(){toast("Day saved","ok")});
}
function cycleAvail(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx];
  if(!dpAvail[catKey])dpAvail[catKey]={pos:[],neg:[]};
  var inPos=dpAvail[catKey].pos.indexOf(val),inNeg=dpAvail[catKey].neg.indexOf(val);
  if(inPos>=0){dpAvail[catKey].pos.splice(inPos,1);dpAvail[catKey].neg.push(val)}
  else if(inNeg>=0){dpAvail[catKey].neg.splice(inNeg,1)}
  else{dpAvail[catKey].pos.push(val)}
  if(selDay)renderDayPanel(selDay);
}

// ── ACTIONS ──────────────────────────────────────────────────
function prevMo(){if(mo===0){mo=11;yr--}else mo--;render()}
function nextMo(){if(mo===11){mo=0;yr++}else mo++;render()}
function goToday(){var n=new Date();TODAY=n;TODAY_KEY=mkdk(n.getFullYear(),n.getMonth(),n.getDate());yr=n.getFullYear();mo=n.getMonth();render()}
function selectDay(d){selDay=selDay===d?null:d;initDpAvail();render();if(selDay)renderDayPanel(selDay)}
function closeDay(){selDay=null;document.getElementById("dayPanelMount").innerHTML="";render()}

/** Scheduling is one cell now — no source row to rewrite. */
function setDay(uid,dateKey){
  var s=getScene(uid);if(!s)return;
  s.shootDay=dateKey||"";
  render();if(selDay)renderDayPanel(selDay);
  saveShootDay(uid,dateKey||"");
}
function addToDay(uid,day){setDay(uid,dkey(day))}
function unschedule(uid){setDay(uid,"")}
function startDrag(uid){dragId=uid}
function dropOnDay(e,day){
  e.preventDefault();
  if(!dragId)return;
  var uid=dragId;dragId=null;
  if(!canEdit()){toast("Editing is locked","err");return}
  setDay(uid,dkey(day));
}

// ── EDITOR ───────────────────────────────────────────────────
function openEditor(uid){
  var isNew=!uid;
  var s=isNew
    ? {uid:"s"+Date.now(),seqLabel:"",title:"",complexity:3,notes:"",shootDay:"",dayOrder:null,raw:{},_new:true}
    : JSON.parse(JSON.stringify(getScene(uid)));
  for(var i=0;i<catList.length;i++){if(!s[catList[i].key])s[catList[i].key]=[]}
  edDetail=false;
  window._ed=s;renderEditor(isNew);
}
function renderEditor(isNew){
  var s=window._ed;
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">';
  h+='<h2>'+(isNew?'New Scene':esc(s.seqLabel||"")+' &mdash; '+esc(s.title))+'</h2>';

  if(isNew){
    h+='<div class="field"><label>SEQ</label><input id="ed-seq" placeholder="SEQ 30.75" value="'+esc(s.seqLabel)+'" onchange="window._ed.seqLabel=this.value">';
    h+='<div class="ro-note">Decimals are fine. The sheet inserts the row in scene order &mdash; 30.75 lands between 30.5 and 31.</div></div>';
    h+='<div class="field"><label>Scene Title</label><input id="ed-title" value="'+esc(s.title)+'" onchange="window._ed.title=this.value"></div>';
  }else if(s.slugline){
    h+='<div style="font-size:11px;color:var(--muted);font-style:italic;margin-bottom:12px">'+esc(s.slugline)+
       (s.length?' &nbsp;·&nbsp; '+esc(s.length):'')+'</div>';
  }

  h+='<div class="field"><label>Short Summary</label>';
  h+='<textarea id="ed-short" rows="2" placeholder="One line on what happens in this scene" onchange="window._ed.shortSummary=this.value">'+esc(s.shortSummary||"")+'</textarea>';
  h+='<div class="ro-note">Column C of the Sequences tab.</div></div>';

  if(s.detail){
    h+='<div class="field"><label>Detailed Summary <span style="color:var(--faint);text-transform:none;letter-spacing:0">— from the sheet</span></label>';
    h+='<div style="font-size:11px;line-height:1.75;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:9px 11px;cursor:pointer;'+
       (edDetail?'':'max-height:56px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)')+
       '" onclick="edDetail=!edDetail;renderEditor('+(isNew?'true':'false')+')">'+esc(s.detail)+'</div>';
    h+='<div class="ro-note">'+(edDetail?'Click to collapse':'Click to read the whole thing')+'</div></div>';
  }

  if(!isNew){
    var pk=splitNotes(s.notes);
    h+='<div class="field"><label>Completion</label><div class="tog-row">';
    h+='<button class="tog cmp-shot'+(isShot(s)?' pos':'')+'" onclick="togFlagEd(SHOT)">&#10003; Shot</button>';
    h+='<button class="tog cmp-pk'+(needsPickup(s)?' pos':'')+'" onclick="togFlagEd(PICKUP)">&#9685; Pickup owed</button></div>';
    if(needsPickup(s))h+='<textarea id="ed-pickup" rows="2" placeholder="What still needs to be picked up — e.g. insert of the watch face, Tom\'s reaction from the stairwell" style="margin-top:6px;border-color:rgb(var(--purple-rgb) / 0.533)">'+esc(pk.pickup)+'</textarea>';
    h+='<div class="ro-note">Shot fades the scene to yellow everywhere. Pickup marks it purple and keeps the note in Sched Notes as a "Pickup:" line.</div></div>';
  }
  h+='<div class="field"><label>Shoot Day</label><input type="date" id="ed-day" value="'+esc(s.shootDay||"")+'" onchange="window._ed.shootDay=this.value">';
  h+='<div class="ro-note">Blank = unscheduled. Writes column X of the Sequences tab.</div></div>';

  h+='<div class="field"><label>Complexity</label><div class="cx-row">';
  for(var n=1;n<=5;n++)h+='<button class="cx-btn" onclick="setCx('+n+')" style="border:'+(s.complexity===n?'2px solid '+CC[n]:'1px solid var(--line-2)')+';background:'+(s.complexity===n?CC[n]+'33':'var(--surface)')+';color:'+(s.complexity===n?CC[n]:'var(--muted)')+'">'+CL[n]+'</button>';
  h+='</div></div>';

  h+='<div style="font-size:10px;color:var(--faint);line-height:1.6;margin:2px 0 12px;padding:7px 9px;background:var(--bg);border:1px solid var(--line);border-radius:5px">';
  h+='Ticking these writes back to the sheet. Wording you already wrote is kept &mdash; a row reading <em style="color:var(--muted)">TOM (post-jump)</em> stays exactly that while Tom is ticked. Untick to remove; newly ticked names are added plainly for you to reword in the sheet.</div>';

  for(var ci=0;ci<catList.length;ci++){
    var cat=catList[ci];
    if(!cat.options.length)continue;
    h+='<div class="field"><label>'+esc(cat.label)+(cat.rw?'':' <span style="color:var(--faint);text-transform:none;letter-spacing:0">— from the sheet</span>')+'</label>';
    if(cat.rw){
      h+='<div class="tog-row">';
      for(var oi=0;oi<cat.options.length;oi++){
        var o=cat.options[oi],on=(s[cat.key]||[]).indexOf(o)>=0;
        if(cat.key==="status"&&(o===SHOT||o===PICKUP))continue;   // handled by the Completion row above
        h+='<button class="tog'+(on?' pos':'')+'" style="--tc:'+cat.color+'" onclick="togEdit(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
      }
      h+='</div>';
    }else{
      var vals=s[cat.key]||[];
      if(!vals.length)h+='<div style="font-size:11px;color:var(--faint)">—</div>';
      else{h+='<div>';for(var vi=0;vi<vals.length;vi++)h+='<span class="ro-chip">'+esc(vals[vi])+'</span>';h+='</div>'}
    }
    h+='</div>';
  }

  h+='<div class="field"><label>Scheduling Notes</label><textarea id="ed-notes" rows="3">'+esc(splitNotes(s.notes).notes)+'</textarea></div>';
  h+='<div class="ed-actions" style="display:flex;justify-content:space-between;margin-top:8px"><div style="display:flex;gap:8px">';
  if(canEdit())h+='<button class="mbtn gold" onclick="saveEdit()">Save</button>';
  else h+='<button class="mbtn gold" onclick="unlockThenEditor()">'+ICON.lock+' Unlock to edit</button>';
  h+='<button class="mbtn ghost" onclick="closeModal()">Close</button></div>';
  if(!isNew&&canEdit()){
    h+='<div style="display:flex;gap:6px">';
    if(s.shootDay)h+='<button class="mbtn ghost" onclick="unschedule(\''+s.uid+'\');closeModal()">Unschedule</button>';
    h+='<button class="mbtn red" onclick="deleteScene(\''+s.uid+'\')">Delete</button></div>';
  }
  h+='</div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
}
function togEdit(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx],s=window._ed;
  if(!s[catKey])s[catKey]=[];
  var i=s[catKey].indexOf(val);
  if(i>=0)s[catKey].splice(i,1);else s[catKey].push(val);
  renderEditor(!!s._new);
}
function setCx(n){window._ed.complexity=n;renderEditor(!!window._ed._new)}
/** Completion toggles in the editor. Keeps the typed pickup note across the re-render. */
function togFlagEd(flag){
  var s=window._ed;if(!s.status)s.status=[];
  var pkEl=document.getElementById("ed-pickup"),nEl=document.getElementById("ed-notes");
  var pk=pkEl?pkEl.value:splitNotes(s.notes).pickup,notes=nEl?nEl.value:splitNotes(s.notes).notes;
  var i=s.status.indexOf(flag);if(i>=0)s.status.splice(i,1);else s.status.push(flag);
  ensureStatusOption(flag);
  s.notes=joinNotes(notes,s.status.indexOf(PICKUP)>=0?pk:"");
  renderEditor(false);
  if(flag===PICKUP&&s.status.indexOf(PICKUP)>=0)setTimeout(function(){var el=document.getElementById("ed-pickup");if(el)el.focus({preventScroll:true})},40);
}

function saveEdit(){
  var s=window._ed;
  var dayEl=document.getElementById("ed-day");if(dayEl)s.shootDay=dayEl.value;
  var nEl=document.getElementById("ed-notes"),pkEl=document.getElementById("ed-pickup");
  if(nEl)s.notes=joinNotes(nEl.value,needsPickup(s)&&pkEl?pkEl.value:(needsPickup(s)?splitNotes(s.notes).pickup:""));
  var shEl=document.getElementById("ed-short");if(shEl)s.shortSummary=shEl.value;
  if(s._new){
    var sq=document.getElementById("ed-seq"),ti=document.getElementById("ed-title");
    if(sq)s.seqLabel=normalizeSeq(sq.value);if(ti)s.title=ti.value;
    if(!s.title.trim()){toast("Give the scene a title","err");return}
    s.seq=String(s.seqLabel).replace(/SEQ/i,"").trim();
    s.raw={cast:[],locations:[],props:[],extras:[],wardrobe:[],hairMakeup:[],stunts:[],vfx:[],vehicles:[]};
    s.name=(s.seqLabel?s.seqLabel+" — ":"")+s.title;
    delete s._new;
    scenes.push(s);
    scenes.sort(function(a,b){return seqNum(a)-seqNum(b)});  // matches the row the sheet inserts
  }else{
    for(var i=0;i<scenes.length;i++){if(scenes[i].uid===s.uid){s.name=(s.seqLabel?s.seqLabel+" — ":"")+s.title;scenes[i]=s;break}}
  }

  var fields={"SHOOTING DAY":s.shootDay||"","COMPLEXITY":s.complexity,"SCHED NOTES":s.notes||"",
              "SCENE SHORT SUMMARY":s.shortSummary||""};
  for(var key in RW_CATS)fields[RW_CATS[key]]=s[key]||[];

  // prose-column categories go over separately so the script can reconcile them
  var lists={};
  for(var lk in RW_LISTS)lists[lk]=s[lk]||[];

  closeModal();render();if(selDay)renderDayPanel(selDay);
  saveSceneFields(s,fields,lists).then(function(){toast("Scene saved","ok")});
}
/**
 * Deletes the scene's row from the Sequences tab. The script refuses if the row
 * has a written summary — those get deleted in the sheet, where undo exists.
 */
function deleteScene(uid){
  var s=getScene(uid);if(!s)return;
  if(!confirm('Delete '+(s.seqLabel||"this scene")+(s.title?' — '+s.title:'')+'?\n\n'+
              'This removes its row from the Sequences tab.'))return;

  var keep=[];
  for(var i=0;i<scenes.length;i++){if(scenes[i].uid!==uid)keep.push(scenes[i])}
  scenes=keep;
  closeModal();render();if(selDay)renderDayPanel(selDay);

  apiWrite({action:"deleteScene",uid:uid}).then(function(r){
    if(r&&r.error){toast(r.error,"err");loadFromSheet(true)}   // refused — put it back
    else toast("Scene deleted","ok");
  });
}

function closeModal(){document.getElementById("modalMount").innerHTML=""}

// ── SETTINGS ─────────────────────────────────────────────────
var sTab=0,sRen=null,sRenVal="",sMode="options";
function openSettings(){sTab=0;sRen=null;sMode="options";renderSettings()}

function renderSettings(){
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" style="padding:0;max-width:720px" onclick="event.stopPropagation()"><div class="settings-wrap">';
  h+='<div class="settings-nav"><div class="sn-title">Settings</div>';
  for(var i=0;i<catList.length;i++){
    h+='<div class="sn-item'+(sMode==="options"&&sTab===i?' active':'')+'" onclick="sTab='+i+';sMode=\'options\';sRen=null;renderSettings()">'+esc(catList[i].label)+' ('+catList[i].options.length+')</div>';
  }
  h+='<div style="border-top:1px solid var(--line-2);margin:12px 0"></div>';
  h+='<div class="sn-item'+(sMode==="categories"?' active':'')+'" style="font-weight:600" onclick="sMode=\'categories\';sRen=null;renderSettings()">Manage Categories</div>';
  h+='<div class="sn-item'+(sMode==="about"?' active':'')+'" onclick="sMode=\'about\';renderSettings()">About</div>';
  if(canEdit())h+='<div class="sn-item" style="color:var(--green);font-weight:600" onclick="saveRosters()">Save to Rosters</div>';
  else h+='<div class="sn-item" style="color:var(--muted)" onclick="unlockThenSettings()">'+ICON.lock+' Unlock to edit</div>';
  h+='<div class="sn-item" style="color:var(--red)" onclick="closeModal()">Close</div></div>';
  h+='<div class="settings-body">';

  if(sMode==="options"&&catList[sTab]){
    var cat=catList[sTab];
    h+='<h3 style="font-family:var(--font);font-size:18px;color:var(--ink-hi);font-weight:400;margin-bottom:6px">'+esc(cat.label)+'</h3>';
    h+='<div style="font-size:10px;color:var(--muted);margin-bottom:12px;line-height:1.6">These come from the <strong>Rosters</strong> tab. Merge a duplicate by moving its name into another row\'s <strong>ALIASES</strong> column in the sheet.<br>For a clear-out, use <strong>Project Hairpin &rarr; Rosters: remove duplicates</strong> (or <strong>remove unused values</strong>) in the spreadsheet menu.</div>';
    h+='<div style="display:flex;gap:8px;margin-bottom:14px"><input id="set-new" placeholder="Add new '+esc(cat.label).toLowerCase()+' option..." style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:13px;outline:none" onkeydown="if(event.key===\'Enter\')addOpt()"><button class="mbtn gold" style="padding:7px 14px" onclick="addOpt()">Add</button></div>';
    for(var i=0;i<cat.options.length;i++){
      var v=cat.options[i];
      h+='<div class="cat-row">';
      if(sRen===i){
        h+='<input id="set-ren" value="'+esc(sRenVal)+'" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid rgb(var(--amber-rgb) / 0.4);background:var(--bg);color:var(--ink);font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')renameOpt('+i+');if(event.key===\'Escape\'){sRen=null;renderSettings()}">';
        h+='<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameOpt('+i+')">Save</button>';
        h+='<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="sRen=null;renderSettings()">Esc</button>';
      }else{
        var cnt=0;for(var j=0;j<scenes.length;j++){if(scenes[j][cat.key]&&scenes[j][cat.key].indexOf(v)>=0)cnt++}
        var m=(cat.meta&&cat.meta[v])||{},na=(m.aliases||[]).length;
        h+='<span class="cr-name">'+esc(v)+
           (na?' <span style="color:var(--faint);font-size:9px" title="'+esc((m.aliases||[]).join(" · "))+'">+'+na+' alias'+(na===1?'':'es')+'</span>':'')+
           (m.note?' <span style="color:var(--faint);font-size:9px">'+esc(m.note)+'</span>':'')+'</span>';
        h+='<span class="cr-count">'+cnt+'&times;</span>';
        if(i>0)h+='<button class="cat-row cr-up" onclick="moveOpt('+i+',-1)">&#9650;</button>';
        if(i<cat.options.length-1)h+='<button class="cat-row cr-dn" onclick="moveOpt('+i+',1)">&#9660;</button>';
        h+='<button class="cat-row cr-ren" onclick="sRen='+i+';sRenVal=catList[sTab].options['+i+'];renderSettings()">Rename</button>';
        h+='<button class="cat-row cr-del" onclick="delOpt('+i+')">Del</button>';
      }
      h+='</div>';
    }
  }

  if(sMode==="categories"){
    h+='<h3 style="font-family:var(--font);font-size:18px;color:var(--ink-hi);font-weight:400;margin-bottom:14px">Manage Categories</h3>';
    h+='<div style="font-size:10px;color:var(--muted);margin-bottom:12px">Add, rename, reorder, or remove entire categories. Changes affect the scene editor, the day panel filter, and the highlight bar.</div>';
    h+='<div style="display:flex;gap:8px;margin-bottom:14px"><input id="cat-new-key" placeholder="Key (no spaces)" style="width:100px;padding:7px 10px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:12px;outline:none"><input id="cat-new-label" placeholder="Display name" style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:12px;outline:none"><input id="cat-new-color" placeholder="#color" value="var(--amber)" style="width:80px;padding:7px 10px;border-radius:5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:12px;outline:none"><button class="mbtn gold" style="padding:7px 14px" onclick="addCategory()">Add</button></div>';
    for(var i=0;i<catList.length;i++){
      var c=catList[i];
      h+='<div class="cat-row">';
      if(sRen===i){
        h+='<input id="cat-ren-label" value="'+esc(c.label)+'" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid rgb(var(--amber-rgb) / 0.4);background:var(--bg);color:var(--ink);font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')renameCat('+i+')">';
        h+='<input id="cat-ren-color" value="'+esc(c.color)+'" style="width:70px;padding:3px 7px;border-radius:4px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:11px;outline:none">';
        h+='<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameCat('+i+')">Save</button>';
        h+='<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="sRen=null;renderSettings()">Esc</button>';
      }else{
        h+='<div style="width:12px;height:12px;border-radius:3px;background:'+c.color+';flex-shrink:0"></div>';
        h+='<span class="cr-name">'+esc(c.label)+' <span style="color:var(--faint);font-size:10px">('+c.key+')</span>'+(c.rw?'':' <span style="color:var(--faint);font-size:9px">read-only</span>')+'</span>';
        h+='<span class="cr-count">'+c.options.length+' opts</span>';
        if(i>0)h+='<button class="cat-row cr-up" onclick="moveCat('+i+',-1)">&#9650;</button>';
        if(i<catList.length-1)h+='<button class="cat-row cr-dn" onclick="moveCat('+i+',1)">&#9660;</button>';
        h+='<button class="cat-row cr-ren" onclick="sRen='+i+';renderSettings()">Edit</button>';
        h+='<button class="cat-row cr-del" onclick="delCategory('+i+')">Del</button>';
      }
      h+='</div>';
    }
  }

  if(sMode==="about"){
    h+='<h3 style="font-family:var(--font);font-size:18px;color:var(--ink-hi);font-weight:400;margin-bottom:14px">About</h3>';
    h+='<div style="font-size:11px;color:var(--ink-3);line-height:1.8">';
    h+='The <strong>Sequences</strong> tab of the production document is the database. Each scene row carries its own <strong>SHOOTING DAY</strong>, so a scene can only ever be in one place.<br><br>';
    h+='Editable here: <strong>Short Summary, Shoot Day, Complexity, Cast, Locations, Props, Extras, Act, Camera, Lens, Time of Day, Lighting, Weather, Status, Notes</strong>.<br>';
    h+='The prose columns reconcile rather than overwrite &mdash; your own wording survives being edited from the app.<br><br>';
    h+='Read-only here, edited in the sheet: <strong>detailed summaries, sluglines, addresses, wardrobe, hair &amp; makeup, stunts, VFX</strong>.<br><br>';
    h+='Lists in the sheet split on a <strong>semicolon or a line break</strong>, never a comma.<br><br>';
    h+='<span style="color:var(--faint)">Scenes: '+scenes.length+' &middot; shoot days: '+shootDates().length+' &middot; revision: '+rev+'</span>';
    h+='</div>';
  }

  h+='</div></div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
  if(sRen!==null){var el=document.getElementById("set-ren")||document.getElementById("cat-ren-label");if(el)el.focus({preventScroll:true})}
}

function addOpt(){
  var el=document.getElementById("set-new"),v=el.value.trim();
  if(!v)return;
  var cat=catList[sTab];
  for(var i=0;i<cat.options.length;i++){          // loose match, so "Rope" won't
    if(nk(cat.options[i])===nk(v)){               // sit beside an existing "rope"
      toast('"'+cat.options[i]+'" is already there',"info");
      el.value="";return;
    }
  }
  cat.options.push(v);
  if(!cat.meta)cat.meta={};
  cat.meta[v]={color:"",note:"",aliases:[]};
  el.value="";renderSettings();
}
function delOpt(idx){
  var cat=catList[sTab],nm=cat.options[idx];
  // A value still written in a scene cell gets re-created on the next load, so
  // deleting it here alone would look like the delete silently failed.
  var users=[];
  for(var i=0;i<scenes.length;i++){
    if(scenes[i][cat.key]&&scenes[i][cat.key].indexOf(nm)>=0)users.push(scenes[i].seqLabel||scenes[i].seq);
  }
  if(users.length){
    var list=users.slice(0,8).join(", ")+(users.length>8?" +"+(users.length-8)+" more":"");
    if(!confirm('"'+nm+'" is still used by '+users.length+' scene'+(users.length===1?'':'s')+
                ':\n\n'+list+
                '\n\nDeleting it here will not stick — the sheet still has it, so it comes back on the next load.'+
                '\n\nUntick it on those scenes first. Delete anyway?'))return;
  }
  cat.options.splice(idx,1);
  if(cat.meta)delete cat.meta[nm];
  renderSettings();
}
function moveOpt(idx,dir){var o=catList[sTab].options;var t=o[idx];o[idx]=o[idx+dir];o[idx+dir]=t;renderSettings()}
function renameOpt(idx){
  var nw=document.getElementById("set-ren").value.trim(),old=catList[sTab].options[idx];
  if(!nw||nw===old){sRen=null;renderSettings();return}
  var cat=catList[sTab];
  cat.options[idx]=nw;
  if(cat.meta){                      // carry aliases and the note onto the new name
    cat.meta[nw]=cat.meta[old]||{color:"",note:"",aliases:[]};
    if(old!==nw)delete cat.meta[old];
  }
  var ck=cat.key;
  for(var i=0;i<scenes.length;i++){if(scenes[i][ck])for(var j=0;j<scenes[i][ck].length;j++){if(scenes[i][ck][j]===old)scenes[i][ck][j]=nw}}
  sRen=null;renderSettings();
}
function addCategory(){
  var key=document.getElementById("cat-new-key").value.trim().replace(/\s+/g,"_");
  var label=document.getElementById("cat-new-label").value.trim();
  var color=document.getElementById("cat-new-color").value.trim()||"#c49b2a";
  if(!key||!label)return;
  for(var i=0;i<catList.length;i++){if(catList[i].key===key){toast("Key already exists","err");return}}
  catList.push({key:key,label:label,color:color,options:[],rw:isRW(key)});
  renderSettings();
}
function delCategory(idx){
  if(!confirm("Delete category '"+catList[idx].label+"'? This won't remove data from existing scenes."))return;
  catList.splice(idx,1);if(sTab>=catList.length)sTab=Math.max(0,catList.length-1);renderSettings();
}
function moveCat(idx,dir){var t=catList[idx];catList[idx]=catList[idx+dir];catList[idx+dir]=t;renderSettings()}
function renameCat(idx){
  var nl=document.getElementById("cat-ren-label").value.trim(),nc=document.getElementById("cat-ren-color").value.trim();
  if(nl)catList[idx].label=nl;
  if(nc)catList[idx].color=nc;
  sRen=null;renderSettings();
}

keepScrollOn(["render","renderLeft","renderCal","renderDayPanel","renderEditor","renderSettings","renderLinksEditor","renderLockModal"]);
applyThemeButton();

// ── BOOT ─────────────────────────────────────────────────────
(function boot(){
  try{editKey=localStorage.getItem("hairpinEditKey")||""}catch(e){}
  applyLock();
  render();
  loadFromSheet().then(function(ok){ if(ok)startPolling() });
})();
</script>
