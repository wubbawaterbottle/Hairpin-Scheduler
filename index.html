<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Hairpin — Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','Helvetica Neue',sans-serif;background:#141210;color:#e8e0d6;min-height:100vh}
button,input,textarea,select{font-family:inherit}
.header{background:#1a1714;border-bottom:1px solid #2a2520;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:400;color:#e8d5a0}
.header .sub{font-size:9px;color:#8a7e72;text-transform:uppercase;letter-spacing:2px}
.hbtn{padding:6px 12px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid #3a342e;background:none;color:#a09585}
.hbtn.gold{border-color:#c49b2a66;background:#c49b2a22;color:#e8d5a0;font-weight:600}
.main{display:flex;height:calc(100vh - 56px)}
.left{width:260px;min-width:260px;border-right:1px solid #2a2520;overflow-y:auto;padding:12px;background:#18150f}
.left-title{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.chip{border-radius:5px;padding:5px 9px;margin-bottom:4px;cursor:grab;font-size:11px;color:#e8e0d6;transition:all .12s}
.chip:hover{transform:scale(1.01)}
.chip .name{font-weight:600;margin-bottom:1px}
.chip .tags{font-size:9px;color:#a09585;display:flex;flex-wrap:wrap;gap:3px}
.chip .tags span{background:rgba(255,255,255,.06);border-radius:2px;padding:0 3px}
.chip .tags .tod{color:#7aaad4;font-style:italic;background:none}
.cal-wrap{flex:1;overflow-y:auto;padding:14px}
.cal-nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px}
.cal-nav button{background:none;border:1px solid #3a342e;color:#a09585;width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:14px}
.cal-nav h2{font-family:'EB Garamond',Georgia,serif;font-size:18px;font-weight:400;color:#e8d5a0;min-width:160px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{text-align:center;font-size:9px;color:#6a5e52;padding:5px 0;text-transform:uppercase;letter-spacing:1px}
.cal-day{min-height:85px;border:1px solid rgba(42,37,32,.53);border-radius:5px;padding:4px;cursor:pointer;transition:all .12s;position:relative}
.cal-day:hover{border-color:#3a342e}
.cal-day.sel{border:1.5px solid #c49b2a;background:#2a2520}
.cal-day.we{background:rgba(26,23,20,.53)}
.cal-day .dnum{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.cal-day .dnum span{font-size:11px;font-weight:600;color:#a09585}
.cal-day.sel .dnum span{color:#e8d5a0}
.cal-day.we .dnum span{color:#6a5e52}
.cal-day .badge{font-size:7px;padding:1px 4px;border-radius:8px;font-weight:600}
.mini-chip{font-size:9px;padding:2px 4px;margin-bottom:1px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;color:#e8e0d6}
.stats{margin-top:14px;padding:12px;background:rgba(26,23,20,.53);border-radius:7px;border:1px solid #2a2520;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stats .s{text-align:center}
.stats .s .n{font-size:18px;font-weight:700}
.stats .s .l{font-size:8px;color:#8a7e72;text-transform:uppercase}
.daypanel{position:fixed;right:0;top:0;bottom:0;width:400px;background:#1e1b18;border-left:1px solid #3a342e;z-index:900;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.4);display:flex;flex-direction:column}
.daypanel .dp-head{padding:16px 20px;border-bottom:1px solid #3a342e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.daypanel .dp-head h2{font-family:'EB Garamond',Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400}
.daypanel .dp-body{flex:1;overflow-y:auto;padding:16px}
.dp-section{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600}
.dp-callsheet{padding:8px;background:rgba(20,18,16,.53);border-radius:5px;border:1px solid #3a342e;font-size:10px;color:#a09585;line-height:1.6;margin-top:8px}
.dp-callsheet strong{color:#c9b896}
.res-box{padding:12px;background:#141210;border-radius:8px;border:1px solid #3a342e;margin-bottom:12px}
.res-box .rb-title{font-size:11px;color:#e8d5a0;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.res-box .rb-hint{font-size:10px;color:#8a7e72;margin-bottom:8px}
.res-cat{margin-bottom:8px}
.res-cat .rc-label{font-size:9px;color:#6a5e52;text-transform:uppercase;margin-bottom:3px}
.tog-row{display:flex;flex-wrap:wrap;gap:4px}
.tog{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .12s;border:1px solid #3a342e;background:#1a1714;color:#8a7e72}
.tog.on{border-color:var(--tc,#c49b2a);background:color-mix(in srgb,var(--tc,#c49b2a) 13%,transparent);color:#e8d5a0}
.match-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.match-item .mi-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer}
.match-item .mi-info .mi-name{font-size:11px;color:#e8e0d6;font-weight:500}
.match-item .mi-info .mi-meta{font-size:9px;color:#8a7e72;margin-top:2px}
.match-item .mi-add{padding:4px 8px;border-radius:4px;border:1px solid rgba(74,158,110,.27);background:rgba(74,158,110,.07);color:#4a9e6e;font-size:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.asgn-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.asgn-row .ar-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:11px;color:#e8e0d6;font-weight:500}
.asgn-row .ar-rem{padding:3px 7px;border-radius:3px;border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040;font-size:9px;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;justify-content:center;align-items:center}
.modal{background:#1e1b18;border:1px solid #3a342e;border-radius:12px;width:92%;max-width:600px;max-height:88vh;overflow-y:auto;padding:24px}
.modal h2{font-family:'EB Garamond',Georgia,serif;font-size:20px;color:#e8d5a0;font-weight:400;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #3a342e}
.modal label{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
.modal input,.modal textarea{width:100%;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:13px;outline:none}
.modal textarea{resize:vertical}
.modal .field{margin-bottom:10px}
.mbtn{padding:7px 20px;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600}
.mbtn.gold{border:none;background:#c49b2a;color:#1a1714}
.mbtn.ghost{border:1px solid #3a342e;background:none;color:#a09585}
.mbtn.red{border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040;font-size:11px}
.settings-wrap{display:flex;overflow:hidden;border-radius:12px}
.settings-nav{width:160px;border-right:1px solid #3a342e;padding:20px 0;background:#1a1714;overflow-y:auto}
.settings-nav .sn-title{padding:0 14px 14px;font-size:16px;color:#e8d5a0;font-family:'EB Garamond',Georgia,serif}
.settings-nav .sn-item{padding:7px 14px;font-size:12px;cursor:pointer;color:#8a7e72;border-left:3px solid transparent;transition:all .12s}
.settings-nav .sn-item.active{color:#e8d5a0;background:#2a2520;border-left-color:#c49b2a}
.settings-body{flex:1;padding:20px;overflow-y:auto}
.cx-row{display:flex;gap:5px}
.cx-btn{width:48px;height:30px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer}
.legend{margin-top:14px;padding-top:10px;border-top:1px solid #2a2520}
.legend .lg-title{font-size:9px;color:#6a5e52;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.legend .lg-item{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.legend .lg-dot{width:8px;height:8px;border-radius:2px}
.legend .lg-label{font-size:9px;color:#8a7e72}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:6px;font-size:11px;z-index:2000;transition:all .3s;opacity:0;transform:translateY(10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#4a9e6e;color:#fff}
.toast.err{background:#c94040;color:#fff}
.toast.info{background:#c49b2a;color:#1a1714}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="header">
  <div>
    <h1>PROJECT HAIRPIN</h1>
    <div class="sub">Production Scheduler</div>
  </div>
  <div style="display:flex;gap:6px">
    <button class="hbtn" onclick="openSettings()">⚙ Settings</button>
    <button class="hbtn gold" onclick="openEditor(null)">+ New Scene</button>
  </div>
</div>
<div class="main">
  <div class="left" id="leftPanel"></div>
  <div class="cal-wrap" id="calWrap"></div>
  <div id="dayPanelMount"></div>
</div>
<div id="modalMount"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// PASTE YOUR APPS SCRIPT URL HERE
const API_URL = "https://script.google.com/macros/s/AKfycby9FrPqkOGFPcIOwHuDwk88ctBbe98Y6Wbw_MczLsuDQbY2SW5OlWJt8AtHvuDRon5b/exec";
// ═══════════════════════════════════════════════════════════════

// ─── DEFAULT CATEGORIES (used if sheet is empty) ─────────────
const DEFAULT_CATS = {
  cast:["Tom","Kim","Rhodes","Cobb/Drummond","Peter","Commissioner","Lawyer/Hadley","Forensics Officer"],
  locations:["Reese Air Force Base","Cook's Garage","Winery","Landfill","Police Station","McDougal Building","Kim's Apartment","Tom's Apartment","Donut Shop","Police Cruiser/Rural Road","Whataburger","Wind Farm/Dirt Field","Country Roads","The Void"],
  timeOfDay:["Dawn/Sunrise","Morning","Day","Afternoon","Sunset/Dusk","Night"],
  lighting:["Golden Hour","Blue Hour","Harsh Sun","Overcast OK","Controlled Interior","Moonlight/Night Ext","Practical Lights Only"],
  weather:["Clear Required","Any Weather","Overcast Preferred","Wind Needed"],
  props:["Tommy's Red Civic","Kim's Red Car","White Van","Peter's Truck","Police Cruiser","Pursuit Vehicles","Ambulances","The Machine","Kevlar Vest","Shotgun","Snub Revolver","Rifles","Neon Signs"],
  extras:["Winery Guards (3-5)","Cook's Bar Patrons (12)","Storage Bay Goons (3)","Burly Guard (1)","Landfill Mercs (3-4)","Reese Mercs (7)","Uniformed Police (4-6)","Ambulance Crew (2)","Night Receptionist (1)"]
};

// ─── STATE (starts empty — loads from sheet) ─────────────────
let cats = JSON.parse(JSON.stringify(DEFAULT_CATS));
let scenes = [];
let sched = {};
let yr = 2026, mo = 4;
let selDay = null;
let dragId = null, dragFromKey = null;

const CC={1:"#4a9e6e",2:"#6b9e4a",3:"#c49b2a",4:"#d4772a",5:"#c94040"};
const CL={1:"Simple",2:"Easy",3:"Medium",4:"Hard",5:"Major"};
const MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function firstDow(y,m){return new Date(y,m,1).getDay()}
function dk(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function dkey(d){return dk(yr,mo,d)}
function getScene(id){return scenes.find(function(s){return s.id===id})}
function scheduledSet(){return new Set(Object.values(sched).flat())}

// ─── JSONP ───────────────────────────────────────────────────
function api(params){
  return new Promise(function(resolve){
    var cb="jcb_"+Date.now()+"_"+Math.floor(Math.random()*10000);
    var t=setTimeout(function(){delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Request timed out"})},20000);
    window[cb]=function(data){clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve(data)};
    var sc=document.createElement("script");
    sc.src=API_URL+"?"+params+"&callback="+cb;
    sc.onerror=function(){clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Network error"})};
    document.body.appendChild(sc);
  });
}

// Small helper — send a write payload
function apiWrite(payload){
  return api("payload="+encodeURIComponent(JSON.stringify(payload)));
}

// ─── TOAST ───────────────────────────────────────────────────
function toast(msg,type){
  var t=document.getElementById("toast");
  t.textContent=msg;t.className="toast "+type+" show";
  setTimeout(function(){t.className="toast"},3000);
}

// ─── LOAD FROM SHEET ─────────────────────────────────────────
async function loadFromSheet(){
  var data = await api("action=getAll");
  if(data.error){toast("Load failed: "+data.error,"err");render();return}
  if(data.scenes && data.scenes.length>0) scenes=data.scenes;
  if(data.schedule) sched=data.schedule;
  if(data.cats){
    Object.keys(data.cats).forEach(function(k){if(data.cats[k].length>0)cats[k]=data.cats[k]});
  }
  toast("Loaded from Google Sheets","ok");
  render();
}

// ─── INDIVIDUAL SAVES (no bulk) ──────────────────────────────
async function saveSceneToSheet(scene){
  var r=await apiWrite({action:"saveScene",scene:scene});
  if(r.error) toast("Save failed: "+r.error,"err");
}

async function deleteSceneFromSheet(id){
  var r=await apiWrite({action:"deleteScene",id:id});
  if(r.error) toast("Delete failed: "+r.error,"err");
}

async function assignOnSheet(dateKey,sceneId){
  var r=await apiWrite({action:"assignScene",dateKey:dateKey,sceneId:sceneId});
  if(r.error) toast("Assign failed: "+r.error,"err");
}

async function unassignOnSheet(dateKey,sceneId){
  var r=await apiWrite({action:"unassignScene",dateKey:dateKey,sceneId:sceneId});
  if(r.error) toast("Unassign failed: "+r.error,"err");
}

async function moveOnSheet(fromKey,toKey,sceneId){
  var r=await apiWrite({action:"moveScene",fromKey:fromKey,toKey:toKey,sceneId:sceneId});
  if(r.error) toast("Move failed: "+r.error,"err");
}

async function saveCatsToSheet(){
  var r=await apiWrite({action:"saveCategories",cats:cats});
  if(r.error) toast("Settings save failed: "+r.error,"err");
  else toast("Settings saved","ok");
}

// ─── RENDER ──────────────────────────────────────────────────
function render(){renderLeft();renderCal();if(selDay)renderDayPanel(selDay)}

function renderLeft(){
  var el=document.getElementById("leftPanel");
  var sset=scheduledSet();
  var unsched=scenes.filter(function(s){return !sset.has(s.id)}).sort(function(a,b){return b.complexity-a.complexity||b.cast.length-a.cast.length});
  var h='<div class="left-title">Unscheduled ('+unsched.length+')</div>';
  unsched.forEach(function(s){
    h+='<div class="chip" draggable="true" ondragstart="startDrag(\''+s.id+'\',null)" onclick="openEditor(\''+s.id+'\')" style="background:linear-gradient(135deg,'+CC[s.complexity]+'22,'+CC[s.complexity]+'11);border:1.5px solid '+CC[s.complexity]+'55;border-left:4px solid '+CC[s.complexity]+'">';
    h+='<div class="name">'+esc(s.name)+'</div><div class="tags">';
    s.cast.forEach(function(c){h+='<span>'+esc(c)+'</span>'});
    s.timeOfDay.forEach(function(t){h+='<span class="tod">'+esc(t)+'</span>'});
    h+='</div></div>';
  });
  if(!unsched.length) h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:16px">No scenes yet — click + New Scene</div>';
  h+='<div class="legend"><div class="lg-title">Complexity</div>';
  [1,2,3,4,5].forEach(function(n){h+='<div class="lg-item"><div class="lg-dot" style="background:'+CC[n]+'"></div><div class="lg-label">'+CL[n]+'</div></div>'});
  h+='</div>';
  el.innerHTML=h;
}

function renderCal(){
  var el=document.getElementById("calWrap");
  var dim=daysIn(yr,mo),fd=firstDow(yr,mo);
  var sset=scheduledSet();
  var unsched=scenes.filter(function(s){return !sset.has(s.id)});
  var h='<div class="cal-nav"><button onclick="prevMo()">&#8249;</button><h2>'+MO[mo]+' '+yr+'</h2><button onclick="nextMo()">&#8250;</button></div>';
  h+='<div class="cal-grid">';
  DN.forEach(function(d){h+='<div class="cal-head">'+d+'</div>'});
  for(var i=0;i<fd;i++) h+='<div></div>';
  for(var i=1;i<=dim;i++){
    var k=dkey(i);
    var ds=(sched[k]||[]).map(getScene).filter(Boolean);
    var sel=selDay===i;
    var we=(fd+i-1)%7===0||(fd+i-1)%7===6;
    var tc=ds.reduce(function(a,s){return a+s.complexity},0);
    h+='<div class="cal-day'+(sel?' sel':'')+(we?' we':'')+'" onclick="selectDay('+i+')" ondragover="event.preventDefault()" ondrop="dropOnDay(event,'+i+')">';
    h+='<div class="dnum"><span>'+i+'</span>';
    if(ds.length) h+='<span class="badge" style="background:'+(tc>8?'#c9404033':'#c49b2a22')+';color:'+(tc>8?'#e8a0a0':'#c49b2a')+'">'+ds.length+'s</span>';
    h+='</div>';
    ds.slice(0,3).forEach(function(s){
      h+='<div class="mini-chip" draggable="true" ondragstart="event.stopPropagation();startDrag(\''+s.id+'\',\''+k+'\')" style="background:'+CC[s.complexity]+'22;border-left:2px solid '+CC[s.complexity]+'">'+esc(s.name)+'</div>';
    });
    if(ds.length>3) h+='<div style="font-size:8px;color:#6a5e52;text-align:center">+'+(ds.length-3)+'</div>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="stats">';
  var shootDays=Object.values(sched).filter(function(v){return v.length>0}).length;
  [{v:shootDays,l:"Shoot Days",c:"#e8d5a0"},{v:sset.size,l:"Scheduled",c:"#e8d5a0"},{v:unsched.length,l:"Remaining",c:unsched.length?"#c49b2a":"#4a9e6e"},{v:scenes.length,l:"Total",c:"#e8d5a0"}].forEach(function(o){
    h+='<div class="s"><div class="n" style="color:'+o.c+'">'+o.v+'</div><div class="l">'+o.l+'</div></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

// ─── DAY PANEL ───────────────────────────────────────────────
var dpAvail={cast:[],locations:[],timeOfDay:[],props:[],weather:[]};

function renderDayPanel(day){
  var k=dkey(day);
  var assigned=(sched[k]||[]).map(getScene).filter(Boolean);
  var sset=scheduledSet();
  var unsched=scenes.filter(function(s){return !sset.has(s.id)});
  var tc=assigned.reduce(function(a,s){return a+s.complexity},0);
  var hasF=dpAvail.cast.length||dpAvail.locations.length||dpAvail.timeOfDay.length||dpAvail.props.length||dpAvail.weather.length;
  var matches=!hasF?[]:unsched.filter(function(s){
    if(dpAvail.cast.length&&!s.cast.every(function(c){return dpAvail.cast.indexOf(c)>=0}))return false;
    if(dpAvail.locations.length&&!s.locations.some(function(l){return dpAvail.locations.indexOf(l)>=0}))return false;
    if(dpAvail.timeOfDay.length&&!s.timeOfDay.some(function(t){return dpAvail.timeOfDay.indexOf(t)>=0}))return false;
    if(dpAvail.props.length&&!s.props.every(function(p){return dpAvail.props.indexOf(p)>=0}))return false;
    if(dpAvail.weather.length&&!s.weather.some(function(w){return dpAvail.weather.indexOf(w)>=0||w==="Any Weather"}))return false;
    return true;
  }).sort(function(a,b){return b.complexity-a.complexity});

  var h='<div class="daypanel"><div class="dp-head"><h2>'+MO[mo]+' '+day+', '+yr+'</h2><button class="hbtn" onclick="closeDay()">&#10005;</button></div><div class="dp-body">';
  if(assigned.length){
    h+='<div class="dp-section">Shooting This Day ('+assigned.length+' &middot; complexity '+tc+')</div>';
    assigned.forEach(function(s){
      h+='<div class="asgn-row"><div class="ar-info" onclick="openEditor(\''+s.id+'\')" style="background:'+CC[s.complexity]+'15;border:1px solid '+CC[s.complexity]+'44;border-left:3px solid '+CC[s.complexity]+'">'+esc(s.name)+'</div><button class="ar-rem" onclick="remFromDay(\''+s.id+'\',\''+k+'\')">Remove</button></div>';
    });
    var allC=[],allL=[],allP=[],allE=[];
    assigned.forEach(function(s){s.cast.forEach(function(c){if(allC.indexOf(c)<0)allC.push(c)});s.locations.forEach(function(l){if(allL.indexOf(l)<0)allL.push(l)});s.props.forEach(function(p){if(allP.indexOf(p)<0)allP.push(p)});s.extras.forEach(function(e){if(allE.indexOf(e)<0)allE.push(e)})});
    h+='<div class="dp-callsheet"><strong>Cast:</strong> '+allC.join(", ")+'<br><strong>Locations:</strong> '+allL.join(", ")+'<br><strong>Props:</strong> '+(allP.join(", ")||"—")+'<br><strong>Extras:</strong> '+(allE.join(", ")||"—")+'</div><div style="height:16px"></div>';
  }
  h+='<div class="res-box"><div class="rb-title">What do you have this day?</div><div class="rb-hint">Toggle available resources — matching scenes appear below</div>';
  h+=togCat("cast","Cast Available",dpAvail.cast,"#c49b2a");
  h+=togCat("locations","Locations Accessible",dpAvail.locations,"#5ab87a");
  h+=togCat("timeOfDay","Time of Day",dpAvail.timeOfDay,"#7aaad4");
  h+=togCat("props","Props Available",dpAvail.props,"#d4772a");
  h+=togCat("weather","Weather Forecast",dpAvail.weather,"#8b7bc4");
  h+='</div>';
  if(hasF){
    h+='<div class="dp-section">Scenes That Fit ('+matches.length+')</div>';
    if(!matches.length) h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:12px">No unscheduled scenes match</div>';
    matches.forEach(function(s){
      h+='<div class="match-item"><div class="mi-info" onclick="openEditor(\''+s.id+'\')" style="background:'+CC[s.complexity]+'15;border:1px solid '+CC[s.complexity]+'44;border-left:3px solid '+CC[s.complexity]+'"><div class="mi-name">'+esc(s.name)+'</div><div class="mi-meta">'+s.cast.join(", ")+' &middot; '+s.locations.join(", ")+'</div></div><button class="mi-add" onclick="addToDay(\''+s.id+'\','+day+')">+ Add</button></div>';
    });
  } else {
    h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:16px">Select resources above to find matching scenes</div>';
  }
  h+='</div></div>';
  document.getElementById("dayPanelMount").innerHTML=h;
}

function togCat(key,label,current,color){
  var h='<div class="res-cat"><div class="rc-label">'+label+'</div><div class="tog-row">';
  cats[key].forEach(function(o){
    var on=current.indexOf(o)>=0;
    h+='<button class="tog'+(on?' on':'')+'" style="--tc:'+color+'" onclick="toggleAvail(\''+key+'\','+JSON.stringify(o)+')">'+esc(o)+'</button>';
  });
  return h+'</div></div>';
}

// ─── ACTIONS ─────────────────────────────────────────────────
function prevMo(){if(mo===0){mo=11;yr--}else mo--;render()}
function nextMo(){if(mo===11){mo=0;yr++}else mo++;render()}
function selectDay(d){selDay=selDay===d?null:d;dpAvail={cast:[],locations:[],timeOfDay:[],props:[],weather:[]};render();if(selDay)renderDayPanel(selDay)}
function closeDay(){selDay=null;document.getElementById("dayPanelMount").innerHTML="";render()}

function toggleAvail(key,val){
  var i=dpAvail[key].indexOf(val);
  if(i>=0)dpAvail[key].splice(i,1);else dpAvail[key].push(val);
  if(selDay)renderDayPanel(selDay);
}

function addToDay(sid,day){
  var k=dkey(day);
  if(!sched[k])sched[k]=[];
  if(sched[k].indexOf(sid)<0)sched[k].push(sid);
  render();if(selDay)renderDayPanel(selDay);
  assignOnSheet(k,sid);
}

function remFromDay(sid,k){
  if(sched[k])sched[k]=sched[k].filter(function(i){return i!==sid});
  if(sched[k]&&!sched[k].length)delete sched[k];
  render();if(selDay)renderDayPanel(selDay);
  unassignOnSheet(k,sid);
}

function startDrag(id,fromKey){dragId=id;dragFromKey=fromKey}
function dropOnDay(e,day){
  e.preventDefault();
  if(!dragId)return;
  var toK=dkey(day);
  if(dragFromKey){
    sched[dragFromKey]=(sched[dragFromKey]||[]).filter(function(i){return i!==dragId});
    if(!sched[dragFromKey].length)delete sched[dragFromKey];
    if(!sched[toK])sched[toK]=[];
    if(sched[toK].indexOf(dragId)<0)sched[toK].push(dragId);
    moveOnSheet(dragFromKey,toK,dragId);
  } else {
    if(!sched[toK])sched[toK]=[];
    if(sched[toK].indexOf(dragId)<0)sched[toK].push(dragId);
    assignOnSheet(toK,dragId);
  }
  dragId=null;dragFromKey=null;
  render();if(selDay)renderDayPanel(selDay);
}

// ─── EDITOR ──────────────────────────────────────────────────
function openEditor(id){
  var isNew=!id;
  var s=isNew?{id:"",name:"",cast:[],locations:[],timeOfDay:[],lighting:[],weather:[],props:[],extras:[],complexity:3,notes:""}:JSON.parse(JSON.stringify(getScene(id)));
  window._ed=s;
  renderEditor(isNew);
}

function renderEditor(isNew){
  var s=window._ed;
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">';
  h+='<h2>'+(isNew?'New Scene':'Edit Scene')+'</h2>';
  h+='<div class="field"><label>Scene Name</label><input id="ed-name" value="'+esc(s.name)+'" onchange="window._ed.name=this.value"></div>';
  var labels={cast:"Cast",locations:"Location",timeOfDay:"Time of Day",lighting:"Lighting",weather:"Weather",props:"Props & Vehicles",extras:"Extras"};
  ["cast","locations","timeOfDay","lighting","weather","props","extras"].forEach(function(k){
    h+='<div class="field"><label>'+labels[k]+'</label><div class="tog-row">';
    cats[k].forEach(function(o){
      var on=(s[k]||[]).indexOf(o)>=0;
      h+='<button class="tog'+(on?' on':'')+'" onclick="togEdit(\''+k+'\','+JSON.stringify(o)+')">'+esc(o)+'</button>';
    });
    h+='</div></div>';
  });
  h+='<div class="field"><label>Complexity</label><div class="cx-row">';
  [1,2,3,4,5].forEach(function(n){
    h+='<button class="cx-btn" onclick="setCx('+n+')" style="border:'+(s.complexity===n?'2px solid '+CC[n]:'1px solid #3a342e')+';background:'+(s.complexity===n?CC[n]+'33':'#1a1714')+';color:'+(s.complexity===n?CC[n]:'#8a7e72')+'">'+CL[n]+'</button>';
  });
  h+='</div></div>';
  h+='<div class="field"><label>Notes</label><textarea id="ed-notes" rows="3" onchange="window._ed.notes=this.value">'+esc(s.notes)+'</textarea></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:8px"><div style="display:flex;gap:8px"><button class="mbtn gold" onclick="saveEdit()">Save</button><button class="mbtn ghost" onclick="closeModal()">Cancel</button></div>';
  if(!isNew) h+='<button class="mbtn red" onclick="deleteEdit(\''+s.id+'\')">Delete</button>';
  h+='</div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
}

function togEdit(key,val){
  var s=window._ed;if(!s[key])s[key]=[];
  var i=s[key].indexOf(val);
  if(i>=0)s[key].splice(i,1);else s[key].push(val);
  renderEditor(!s.id);
}

function setCx(n){window._ed.complexity=n;renderEditor(!window._ed.id)}

function saveEdit(){
  var s=window._ed;
  s.name=document.getElementById("ed-name").value;
  s.notes=document.getElementById("ed-notes").value;
  if(!s.name.trim())return;
  if(!s.id)s.id="s"+Date.now();
  var idx=-1;
  for(var i=0;i<scenes.length;i++){if(scenes[i].id===s.id){idx=i;break}}
  if(idx>=0)scenes[idx]=s;else scenes.push(s);
  closeModal();render();if(selDay)renderDayPanel(selDay);
  saveSceneToSheet(s);
  toast("Scene saved","ok");
}

function deleteEdit(id){
  if(!confirm("Delete this scene?"))return;
  scenes=scenes.filter(function(s){return s.id!==id});
  Object.keys(sched).forEach(function(k){sched[k]=sched[k].filter(function(i){return i!==id});if(!sched[k].length)delete sched[k]});
  closeModal();render();if(selDay)renderDayPanel(selDay);
  deleteSceneFromSheet(id);
  toast("Scene deleted","ok");
}

function closeModal(){document.getElementById("modalMount").innerHTML=""}

// ─── SETTINGS ────────────────────────────────────────────────
var sTab="cast",sRen=null,sRenVal="";

function openSettings(){sTab="cast";sRen=null;renderSettings()}

function renderSettings(){
  var tabs=[{k:"cast",l:"Cast"},{k:"locations",l:"Locations"},{k:"timeOfDay",l:"Time of Day"},{k:"lighting",l:"Lighting"},{k:"weather",l:"Weather"},{k:"props",l:"Props"},{k:"extras",l:"Extras"}];
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" style="padding:0;max-width:680px" onclick="event.stopPropagation()"><div class="settings-wrap">';
  h+='<div class="settings-nav"><div class="sn-title">Settings</div>';
  tabs.forEach(function(t){h+='<div class="sn-item'+(sTab===t.k?' active':'')+'" onclick="sTab=\''+t.k+'\';sRen=null;renderSettings()">'+t.l+' ('+cats[t.k].length+')</div>'});
  h+='<div style="border-top:1px solid #3a342e;margin:12px 0"></div><div class="sn-item" style="color:#4a9e6e;font-weight:600" onclick="saveCatsToSheet()">Save Settings</div>';
  h+='<div class="sn-item" style="color:#c94040" onclick="closeModal()">Close</div></div>';
  h+='<div class="settings-body">';
  h+='<div style="display:flex;gap:8px;margin-bottom:14px"><input id="set-new" placeholder="Add new..." style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:13px;outline:none" onkeydown="if(event.key===\'Enter\')addCat()"><button class="mbtn gold" style="padding:7px 14px" onclick="addCat()">Add</button></div>';
  cats[sTab].forEach(function(v,i){
    h+='<div style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;margin-bottom:1px;background:'+(i%2?'rgba(26,23,20,.53)':'transparent')+'">';
    if(sRen===v){
      h+='<input id="set-ren" value="'+esc(sRenVal)+'" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid #c49b2a66;background:#141210;color:#e8e0d6;font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')renameCat(\''+esc(v)+'\')">';
      h+='<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameCat(\''+esc(v)+'\')">Save</button>';
      h+='<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="sRen=null;renderSettings()">Esc</button>';
    } else {
      h+='<span style="flex:1;font-size:12px;color:#e8e0d6">'+esc(v)+'</span>';
      h+='<span style="font-size:9px;color:#5a5248">'+scenes.filter(function(s){return Array.isArray(s[sTab])&&s[sTab].indexOf(v)>=0}).length+'&times;</span>';
      h+='<button style="padding:2px 7px;border-radius:3px;border:1px solid #3a342e;background:none;color:#a09585;font-size:10px;cursor:pointer" onclick="sRen=\''+esc(v)+'\';sRenVal=\''+esc(v)+'\';renderSettings()">Rename</button>';
      h+='<button style="padding:2px 7px;border-radius:3px;border:1px solid #c9404044;background:#c9404011;color:#c94040;font-size:10px;cursor:pointer" onclick="delCat(\''+esc(v)+'\')">Del</button>';
    }
    h+='</div>';
  });
  h+='<p style="font-size:10px;color:#5a5248;margin-top:12px">Renaming auto-updates all scenes. Click "Save Settings" to sync to Google Sheets.</p>';
  h+='</div></div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
  if(sRen){var el=document.getElementById("set-ren");if(el)el.focus()}
}

function addCat(){
  var el=document.getElementById("set-new");
  var v=el.value.trim();
  if(!v||cats[sTab].indexOf(v)>=0)return;
  cats[sTab].push(v);el.value="";renderSettings();
}

function delCat(v){
  cats[sTab]=cats[sTab].filter(function(x){return x!==v});
  renderSettings();
}

function renameCat(old){
  var nw=document.getElementById("set-ren").value.trim();
  if(!nw||nw===old){sRen=null;renderSettings();return}
  cats[sTab]=cats[sTab].map(function(x){return x===old?nw:x});
  scenes.forEach(function(s){if(Array.isArray(s[sTab]))s[sTab]=s[sTab].map(function(x){return x===old?nw:x})});
  sRen=null;renderSettings();
}

// ─── ESCAPE HTML ─────────────────────────────────────────────
function esc(s){if(!s)return"";var d=document.createElement("div");d.textContent=s;return d.innerHTML}

// ─── START ───────────────────────────────────────────────────
render();
loadFromSheet();
</script>
</body>
</html>
