<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Hairpin — Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','Helvetica Neue',sans-serif;background:#141210;color:#e8e0d6;min-height:100vh}
button,input,textarea,select{font-family:inherit}
.header{background:#1a1714;border-bottom:1px solid #2a2520;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-family:'EB Garamond',Georgia,serif;font-size:20px;font-weight:400;color:#e8d5a0}
.header .sub{font-size:9px;color:#8a7e72;text-transform:uppercase;letter-spacing:2px}
.hbtn{padding:6px 12px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid #3a342e;background:none;color:#a09585}
.hbtn.gold{border-color:#c49b2a66;background:#c49b2a22;color:#e8d5a0;font-weight:600}
.hbtn.live{border-color:rgba(74,158,110,.35);color:#4a9e6e}
.hbtn.live.busy{color:#c49b2a;border-color:#c49b2a55}
.main{display:flex;height:calc(100vh - 56px)}
.left{width:260px;min-width:260px;border-right:1px solid #2a2520;overflow-y:auto;padding:12px;background:#18150f}
.left-title{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.sort-sel{width:100%;margin-bottom:8px;padding:5px 8px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#a09585;font-size:11px;outline:none;cursor:pointer}
.sec-head{display:flex;align-items:center;gap:6px;padding:6px 4px;cursor:pointer;user-select:none;border-radius:4px}
.sec-head:hover{background:rgba(255,255,255,.03)}
.sec-head .sh-arrow{font-size:9px;color:#6a5e52}
.sec-head .sh-title{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;font-weight:600;flex:1}
.sec-head .sh-count{font-size:9px;padding:1px 7px;border-radius:9px;background:#c49b2a1f;color:#c49b2a;font-weight:700}
.sec-head.done .sh-count{background:rgba(74,158,110,.15);color:#4a9e6e}
.chip .cdate{float:right;font-size:9px;color:#c49b2a;font-weight:700;margin-left:6px}
.chip.hl-off{opacity:.25;filter:grayscale(1)}
.chip.hl-on{box-shadow:0 0 0 1px #c49b2a55}
.sec-div{height:1px;background:#2a2520;margin:12px 0 4px}
.sort-sel:hover{border-color:#c49b2a66;color:#e8d5a0}
.chip{border-radius:5px;padding:5px 9px;margin-bottom:4px;cursor:grab;font-size:11px;color:#e8e0d6;transition:all .12s}
.chip:hover{transform:scale(1.01)}
.chip .name{font-weight:600;margin-bottom:1px}
.chip .tags{font-size:9px;color:#a09585;display:flex;flex-wrap:wrap;gap:3px}
.chip .tags span{background:rgba(255,255,255,.06);border-radius:2px;padding:0 3px}
.chip .tags .tod{color:#7aaad4;font-style:italic;background:none}
.cal-wrap{flex:1;overflow-y:auto;padding:14px}
.cal-nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px}
.cal-nav button{background:none;border:1px solid #3a342e;color:#a09585;width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:14px}
.cal-nav h2{font-family:'EB Garamond',Georgia,serif;font-size:18px;font-weight:400;color:#e8d5a0;min-width:160px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-head{text-align:center;font-size:9px;color:#6a5e52;padding:5px 0;text-transform:uppercase;letter-spacing:1px}
.cal-day{min-height:102px;border:1px solid rgba(42,37,32,.53);border-radius:5px;padding:4px;cursor:pointer;transition:all .12s;position:relative}
.cal-day:hover{border-color:#3a342e}
.cal-day.sel{border:1.5px solid #c49b2a;background:#2a2520}
.cal-day.we{background:rgba(26,23,20,.53)}
.cal-day .dnum{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.cal-day .dnum span{font-size:11px;font-weight:600;color:#a09585}
.cal-day.sel .dnum span{color:#e8d5a0}
.cal-day.we .dnum span{color:#6a5e52}
.cal-day .badge{font-size:7px;padding:1px 4px;border-radius:8px;font-weight:600}
.cal-day .warn{position:absolute;bottom:2px;right:3px;font-size:8px;letter-spacing:1px}
.mini-chip{font-size:9px;padding:2px 4px;margin-bottom:1px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab;color:#e8e0d6}
/* highlight states */
.mini-chip.hl-on{filter:saturate(1.6) brightness(1.25);box-shadow:0 0 0 1px currentColor inset,0 0 8px -2px currentColor;font-weight:600}
.mini-chip.hl-off{opacity:.2;filter:grayscale(1)}
.cal-day.hl-dim{opacity:.55}
.cal-day.hl-hit{border-color:#c49b2a55}
.dnum .hl-count{font-size:7px;padding:1px 4px;border-radius:8px;font-weight:700;background:#c49b2a33;color:#e8d5a0;margin-left:3px}
/* highlight bar */
.hl-bar{margin-top:12px;background:rgba(26,23,20,.53);border:1px solid #2a2520;border-radius:7px;overflow:hidden}
.hl-head{padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.hl-head:hover{background:rgba(255,255,255,.02)}
.hl-head .hl-t{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;font-weight:600;flex:1}
.hl-head .hl-badge{font-size:9px;padding:2px 7px;border-radius:9px;background:#c49b2a22;color:#e8d5a0;font-weight:600}
.hl-head .hl-arrow{color:#6a5e52;font-size:10px}
.hl-body{padding:4px 12px 12px;border-top:1px solid #2a2520}
.hl-cat{margin-bottom:8px}
.hl-cat .hl-label{font-size:9px;color:#6a5e52;text-transform:uppercase;margin-bottom:3px;letter-spacing:.5px}
.hl-summary{margin-top:8px;padding:9px 10px;background:#141210;border:1px solid #3a342e;border-radius:6px;font-size:11px;color:#c9b896;line-height:1.7}
.hl-summary .hs-name{color:#e8d5a0;font-weight:600}
.hl-summary .hs-dates{color:#8a7e72;font-size:10px}
.hl-clear{padding:3px 10px;border-radius:4px;border:1px solid rgba(201,64,64,.3);background:rgba(201,64,64,.08);color:#c94040;font-size:10px;cursor:pointer;font-weight:600}
.stats{margin-top:14px;padding:12px;background:rgba(26,23,20,.53);border-radius:7px;border:1px solid #2a2520;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stats .s{text-align:center}
.stats .s .n{font-size:18px;font-weight:700}
.stats .s .l{font-size:8px;color:#8a7e72;text-transform:uppercase}
.daypanel{position:fixed;right:0;top:0;bottom:0;width:460px;background:#1e1b18;border-left:1px solid #3a342e;z-index:900;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.4);display:flex;flex-direction:column}
.daypanel .dp-head{padding:16px 20px;border-bottom:1px solid #3a342e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.daypanel .dp-head h2{font-family:'EB Garamond',Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400}
.daypanel .dp-body{flex:1;overflow-y:auto;padding:16px}
.dp-section{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;font-weight:600;border-bottom:1px solid #2a2520;padding-bottom:4px}
.dp-section:first-child{margin-top:0}
.dp-callsheet{padding:8px;background:rgba(20,18,16,.53);border-radius:5px;border:1px solid #3a342e;font-size:10px;color:#a09585;line-height:1.6;margin-top:8px}
.dp-callsheet strong{color:#c9b896}
/* call sheet */
.cs-top{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cs-stat{flex:1;min-width:76px;background:#141210;border:1px solid #3a342e;border-radius:6px;padding:7px 9px}
.cs-stat .v{font-size:15px;font-weight:700;color:#e8d5a0;line-height:1.2}
.cs-stat .l{font-size:8px;color:#6a5e52;text-transform:uppercase;letter-spacing:1px;margin-top:1px}
.cs-warn{padding:7px 10px;border-radius:5px;font-size:10px;margin-bottom:5px;line-height:1.5}
.cs-warn.amber{background:rgba(196,155,42,.1);border:1px solid rgba(196,155,42,.3);color:#e8d5a0}
.cs-warn.red{background:rgba(201,64,64,.1);border:1px solid rgba(201,64,64,.3);color:#e8a0a0}
.sc-card{border:1px solid #3a342e;border-radius:6px;margin-bottom:6px;overflow:hidden;background:#191613}
.sc-card .sc-h{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;cursor:pointer}
.sc-card .sc-h:hover{background:rgba(255,255,255,.02)}
.sc-seq{font-size:9px;font-weight:700;color:#1a1714;background:#c49b2a;border-radius:3px;padding:2px 5px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.sc-t{flex:1;min-width:0}
.sc-t .sc-name{font-size:12px;font-weight:600;color:#e8e0d6}
.sc-t .sc-slug{font-size:9px;color:#7a6e62;font-style:italic;margin-top:1px;word-break:break-word}
.sc-len{font-size:9px;color:#8a7e72;white-space:nowrap;flex-shrink:0;margin-top:2px}
.sc-body{padding:0 10px 10px;border-top:1px solid #2a2520;font-size:10px;line-height:1.65;color:#a09585}
.sc-body p{margin:8px 0 0;color:#c9b896;font-size:10.5px;line-height:1.7}
.sc-dept{margin-top:8px}
.sc-dept .dl{font-size:8px;color:#6a5e52;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.sc-dept .dv{color:#a09585;font-size:10px}
.cast-row{display:flex;align-items:baseline;gap:7px;padding:4px 8px;border-radius:4px;font-size:11px}
.cast-row:nth-child(odd){background:rgba(26,23,20,.5)}
.cast-row .cr-n{color:#e8d5a0;font-weight:600;min-width:96px}
.cast-row .cr-a{color:#8a7e72;font-size:10px;flex:1}
.cast-row .cr-s{color:#6a5e52;font-size:9px}
.loc-row{padding:6px 9px;background:#141210;border:1px solid #3a342e;border-radius:5px;margin-bottom:4px;font-size:11px}
.loc-row .lr-n{color:#e8d5a0;font-weight:600}
.loc-row .lr-a{color:#8a7e72;font-size:9.5px;margin-top:2px}
.loc-row .lr-s{font-size:9px;margin-top:2px}
.roll{font-size:10px;color:#a09585;line-height:1.7;padding:7px 9px;background:#141210;border:1px solid #3a342e;border-radius:5px;margin-bottom:5px}
.roll b{color:#c9b896;text-transform:uppercase;font-size:8px;letter-spacing:1px;display:block;margin-bottom:1px}
.res-box{padding:12px;background:#141210;border-radius:8px;border:1px solid #3a342e;margin-bottom:12px}
.res-box .rb-title{font-size:11px;color:#e8d5a0;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.res-box .rb-hint{font-size:10px;color:#8a7e72;margin-bottom:8px}
.res-cat{margin-bottom:8px}
.res-cat .rc-label{font-size:9px;color:#6a5e52;text-transform:uppercase;margin-bottom:3px}
.tog-row{display:flex;flex-wrap:wrap;gap:4px}
/* Three-state toggles: off (grey), on/positive (colored), negative/exclude (red) */
.tog{padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .12s;border:1px solid #3a342e;background:#1a1714;color:#8a7e72;user-select:none}
.tog.pos{border-color:var(--tc,#c49b2a);background:color-mix(in srgb,var(--tc,#c49b2a) 13%,transparent);color:#e8d5a0}
.tog.neg{border-color:#c94040;background:rgba(201,64,64,.15);color:#c94040;text-decoration:line-through}
.tog.ro{cursor:default;opacity:.85}
.ro-chip{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;background:#1a1714;border:1px solid #3a342e;color:#a09585;margin:0 3px 3px 0}
.match-item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.match-item .mi-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer}
.match-item .mi-info .mi-name{font-size:11px;color:#e8e0d6;font-weight:500}
.match-item .mi-info .mi-meta{font-size:9px;color:#8a7e72;margin-top:2px}
.match-item .mi-add{padding:4px 8px;border-radius:4px;border:1px solid rgba(74,158,110,.27);background:rgba(74,158,110,.07);color:#4a9e6e;font-size:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.asgn-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.asgn-row .ar-info{flex:1;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:11px;color:#e8e0d6;font-weight:500}
.asgn-row .ar-rem{padding:3px 7px;border-radius:3px;border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040;font-size:9px;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;justify-content:center;align-items:center}
.modal{background:#1e1b18;border:1px solid #3a342e;border-radius:12px;width:92%;max-width:600px;max-height:88vh;overflow-y:auto;padding:24px}
.modal h2{font-family:'EB Garamond',Georgia,serif;font-size:20px;color:#e8d5a0;font-weight:400;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #3a342e}
.modal label{font-size:10px;color:#8a7e72;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
.modal input,.modal textarea{width:100%;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:13px;outline:none}
.modal textarea{resize:vertical}
.modal .field{margin-bottom:10px}
.modal .ro-note{font-size:9px;color:#6a5e52;font-style:italic;margin-top:2px}
.mbtn{padding:7px 20px;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600}
.mbtn.gold{border:none;background:#c49b2a;color:#1a1714}
.mbtn.ghost{border:1px solid #3a342e;background:none;color:#a09585}
.mbtn.red{border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040;font-size:11px}
.settings-wrap{display:flex;overflow:hidden;border-radius:12px;max-height:80vh}
.settings-nav{width:180px;min-width:180px;border-right:1px solid #3a342e;padding:20px 0;background:#1a1714;overflow-y:auto}
.settings-nav .sn-title{padding:0 14px 14px;font-size:16px;color:#e8d5a0;font-family:'EB Garamond',Georgia,serif}
.settings-nav .sn-item{padding:7px 14px;font-size:12px;cursor:pointer;color:#8a7e72;border-left:3px solid transparent;transition:all .12s}
.settings-nav .sn-item.active{color:#e8d5a0;background:#2a2520;border-left-color:#c49b2a}
.settings-body{flex:1;padding:20px;overflow-y:auto}
.cx-row{display:flex;gap:5px}
.cx-btn{width:48px;height:30px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer}
.legend{margin-top:14px;padding-top:10px;border-top:1px solid #2a2520}
.legend .lg-title{font-size:9px;color:#6a5e52;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.legend .lg-item{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.legend .lg-dot{width:8px;height:8px;border-radius:2px}
.legend .lg-label{font-size:9px;color:#8a7e72}
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:6px;font-size:11px;z-index:2000;transition:all .3s;opacity:0;transform:translateY(10px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#4a9e6e;color:#fff}
.toast.err{background:#c94040;color:#fff}
.toast.info{background:#c49b2a;color:#1a1714}
.cat-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;margin-bottom:1px}
.cat-row:nth-child(odd){background:rgba(26,23,20,.53)}
.cat-row .cr-name{flex:1;font-size:12px;color:#e8e0d6}
.cat-row .cr-count{font-size:9px;color:#5a5248}
.cat-row button{padding:2px 7px;border-radius:3px;font-size:10px;cursor:pointer}
.cat-row .cr-ren{border:1px solid #3a342e;background:none;color:#a09585}
.cat-row .cr-del{border:1px solid rgba(201,64,64,.27);background:rgba(201,64,64,.07);color:#c94040}
.cat-row .cr-up,.cat-row .cr-dn{border:1px solid #3a342e;background:none;color:#8a7e72;padding:2px 5px;font-size:9px}
/* ═══ SIDEBAR TOGGLE / DRAWER ═══ */
.sb-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:790}
.left{transition:transform .18s ease}
.left:not(.open){display:none}

/* ═══ MOBILE ═══ */
@media (max-width:900px){
  .header{padding:10px 12px;gap:6px}
  .header h1{font-size:17px}
  .header .sub{font-size:8px;letter-spacing:1.2px}
  .hbtn{padding:8px 11px;font-size:12px}

  .main{height:calc(100vh - 52px)}

  /* sidebar becomes a slide-in drawer */
  .left{position:fixed;left:0;top:0;bottom:0;width:82%;max-width:320px;z-index:800;
        box-shadow:6px 0 28px rgba(0,0,0,.6);padding-top:14px}
  .left.open{display:block}
  .sb-backdrop.show{display:block}

  .cal-wrap{padding:10px 8px}
  .cal-nav h2{font-size:16px;min-width:120px}
  .cal-nav button{width:34px;height:34px}
  .cal-grid{gap:1px}
  .cal-day{min-height:78px;padding:3px;border-radius:4px}
  .cal-day .dnum span{font-size:10px}
  .mini-chip{font-size:8px;padding:2px 3px;line-height:1.25}
  .cal-head{font-size:8px;padding:4px 0}

  /* day panel takes the full screen */
  .daypanel{width:100%;max-width:100%;left:0}
  .daypanel .dp-head{padding:14px 14px}
  .daypanel .dp-body{padding:14px}

  /* bigger tap targets */
  .tog{padding:7px 12px;font-size:12px}
  .sort-sel{padding:8px;font-size:12px}
  .sec-head{padding:9px 4px}
  .mi-add,.ar-rem{padding:7px 10px;font-size:11px}

  /* modals fill the screen */
  .modal{width:96%;max-width:96%;max-height:92vh;padding:18px;border-radius:10px}
  .modal h2{font-size:18px}
  .settings-wrap{flex-direction:column;max-height:88vh}
  .settings-nav{width:100%;min-width:0;display:flex;flex-wrap:wrap;gap:2px;padding:10px;
                border-right:none;border-bottom:1px solid #3a342e}
  .settings-nav .sn-title{width:100%;padding:0 4px 8px}
  .settings-nav .sn-item{border-left:none;border-radius:5px;padding:7px 11px;font-size:12px}
  .settings-nav .sn-item.active{border-left:none;box-shadow:inset 0 0 0 1px #c49b2a66}
  .settings-body{padding:14px}

  .stats{gap:12px;padding:10px}
  .stats .s .n{font-size:16px}
  .hl-body{padding:4px 10px 12px}
  .toast{left:12px;right:12px;bottom:12px;text-align:center}
  .cat-row{flex-wrap:wrap}
  .cs-stat{min-width:64px}
  .cast-row{flex-wrap:wrap}
}

@media (max-width:420px){
  .cal-day{min-height:64px}
  .mini-chip{font-size:0;padding:3px 0;height:6px;border-radius:2px}
  .mini-chip.hl-on{height:8px}
  .cal-day .dnum span{font-size:11px}
  .left{width:88%}
}
@media print{
  .header,.left,.sb-backdrop,.res-box,.dp-head button,.cal-wrap{display:none!important}
  .daypanel{position:static;width:100%;border:none;box-shadow:none;background:#fff;color:#000}
  .daypanel *{color:#000!important;background:#fff!important;border-color:#ccc!important}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="header">
  <div><h1>PROJECT HAIRPIN</h1><div class="sub">Production Scheduler</div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="hbtn live" id="liveBtn" onclick="refreshNow()" title="Refresh from the sheet">&#8635; Live</button>
    <button class="hbtn gold" id="sbToggle" onclick="toggleSidebar()">&#9776; Scenes</button>
    <button class="hbtn" onclick="openSettings()">&#9881; Settings</button>
    <button class="hbtn gold" onclick="openEditor(null)">+ New Scene</button>
  </div>
</div>
<div class="sb-backdrop" id="sbBackdrop" onclick="toggleSidebar()"></div>
<div class="main">
  <div class="left" id="leftPanel"></div>
  <div class="cal-wrap" id="calWrap"></div>
  <div id="dayPanelMount"></div>
</div>
<div id="modalMount"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   PROJECT HAIRPIN — SCHEDULER v2

   The Sequences tab of the production document is the database. Each scene row
   carries its own SHOOTING DAY, so scheduling a scene is a single cell write and
   a scene can never be double-booked.

   After redeploying Code.gs, paste the new /exec URL here and commit.
   ══════════════════════════════════════════════════════════════════════════ */
var API_URL="https://script.google.com/macros/s/AKfycbzPaAa6pKBqS31UdOUPNN3dDGarSywyZ0sBY5TuiG4RYNF7LPGgXoZNxCwPC7xY4AcH/exec";

/* Simple columns the app owns outright — written as a plain value. */
var RW_CATS={lighting:"LIGHTING",timeOfDay:"TIME OF DAY",weather:"WEATHER",status:"STATUS"};

/* Categories that live in the sheet's prose columns. Editable here too, but the
   script reconciles rather than overwrites: wording you wrote stays put, unticked
   values are removed, and newly ticked ones are appended as plain names. */
var RW_LISTS={cast:1,locations:1,props:1,extras:1,act:1,camera:1,lens:1};
function isRW(k){return !!(RW_CATS[k]||RW_LISTS[k])}

var catList=[];        // [{key,label,color,options[],rw}]
var scenes=[];         // every scene; s.shootDay is the schedule
var days={};           // dateKey -> {label,call,wrap,notes}
var people=[];         // Cast & Producers (no contact details)
var locMeta=[];        // Locations tab
var settings={};
var rev=-1, polling=null, writesInFlight=0, refetchQueued=false;

var yr=2026,mo=8,selDay=null,dragId=null;
var sortMode="seq";    // unscheduled sort: seq | complexity | location
var sortModeS="date";  // scheduled sort: date | seq | complexity | location
var openUn=true, openSch=true;
var sidebarOpen=false;
var highlight={};
var hlOpen=true;
var openScene={};      // uid -> expanded on the call sheet

var CC={1:"#4a9e6e",2:"#6b9e4a",3:"#c49b2a",4:"#d4772a",5:"#c94040"};
var CL={1:"Simple",2:"Easy",3:"Medium",4:"Hard",5:"Major"};
var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function daysIn(y,m){return new Date(y,m+1,0).getDate()}
function firstDow(y,m){return new Date(y,m,1).getDay()}
function pad2(n){return n<10?"0"+n:""+n}
function mkdk(y,m,d){return y+"-"+pad2(m+1)+"-"+pad2(d)}
function dkey(d){return mkdk(yr,mo,d)}
function getScene(uid){for(var i=0;i<scenes.length;i++){if(scenes[i].uid===uid)return scenes[i]}return null}
function getCat(key){for(var i=0;i<catList.length;i++){if(catList[i].key===key)return catList[i]}return null}
function esc(s){if(s===0)return"0";if(!s)return"";var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function toast(msg,type){var t=document.getElementById("toast");t.textContent=msg;t.className="toast "+type+" show";setTimeout(function(){t.className="toast"},3000)}

/** Every scene sitting on a given date, in shooting order. */
function scenesOn(k){
  var out=[];
  for(var i=0;i<scenes.length;i++){if(scenes[i].shootDay===k)out.push(scenes[i])}
  out.sort(function(a,b){
    var ao=a.dayOrder===null||a.dayOrder===undefined?999:a.dayOrder;
    var bo=b.dayOrder===null||b.dayOrder===undefined?999:b.dayOrder;
    if(ao!==bo)return ao-bo;
    return seqNum(a)-seqNum(b);
  });
  return out;
}
function seqNum(s){var n=parseFloat(s.seq);return isNaN(n)?9999:n}
/** "30.75" or "seq 30.75" -> "SEQ 30.75", so column A stays consistent. */
function normalizeSeq(v){
  v=String(v||"").trim();
  if(!v)return"";
  var m=v.match(/([0-9]+(?:\.[0-9]+)?)/);
  return m?"SEQ "+m[1]:v;
}
function shootDates(){
  var set={},out=[];
  for(var i=0;i<scenes.length;i++){if(scenes[i].shootDay)set[scenes[i].shootDay]=1}
  for(var k in set)out.push(k);
  out.sort();return out;
}
function fmtMin(m){return Math.floor(m/60)+":"+pad2(m%60)}
function fmtDK(k){var p=String(k).split("-");if(p.length!==3)return k;return MO[parseInt(p[1],10)-1].slice(0,3)+" "+parseInt(p[2],10)}

// ── JSONP ────────────────────────────────────────────────────
function api(params){
  return new Promise(function(resolve){
    var cb="jcb_"+Date.now()+"_"+Math.floor(Math.random()*10000);
    var sc=document.createElement("script");var done=false;
    var t=setTimeout(function(){if(done)return;done=true;delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Timeout"})},25000);
    window[cb]=function(data){if(done)return;done=true;clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve(data)};
    sc.onerror=function(){if(done)return;done=true;clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);resolve({error:"Network error"})};
    sc.src=API_URL+"?"+params+"&callback="+cb;
    document.body.appendChild(sc);
  });
}
function apiWrite(p){
  writesInFlight++;setLive(true);
  return api("payload="+encodeURIComponent(JSON.stringify(p))).then(function(r){
    writesInFlight--;setLive(false);
    if(r&&r.rev!==undefined)rev=r.rev;      // our own write — don't refetch over it
    if(refetchQueued&&!writesInFlight){refetchQueued=false;loadFromSheet(true)}
    return r;
  });
}
function setLive(busy){
  var b=document.getElementById("liveBtn");if(!b)return;
  if(busy||writesInFlight>0)b.classList.add("busy");else b.classList.remove("busy");
}

// ── LOAD ─────────────────────────────────────────────────────
function loadFromSheet(quiet){
  return api("action=getAll").then(function(data){
    if(data.error){toast("Load failed: "+data.error,"err");render();return false}

    scenes=data.scenes||[];
    for(var i=0;i<scenes.length;i++){
      var s=scenes[i];
      s.id=s.uid;                                        // drag handlers use .id
      s.name=(s.seqLabel?s.seqLabel+" — ":"")+s.title;   // chips use .name
    }
    days=data.days||{};
    people=data.people||[];
    locMeta=data.locations||[];
    settings=data.settings||{};
    rev=data.rev;
    buildCatList(data.cats||{},data.order||[]);

    if(data.rosterAdded)toast(data.rosterAdded+" new value(s) added to Rosters","info");
    else if(!quiet)toast("Loaded "+scenes.length+" scenes","ok");
    render();
    return true;
  });
}

/**
 * catList is driven entirely by the Rosters tab.
 *
 * `options` is the plain list of names used for rendering. `meta` carries each
 * name's aliases and note alongside it, so saving from Settings round-trips them
 * instead of blanking columns D and E of the Rosters tab.
 */
function buildCatList(cats,order){
  function pack(key,label,color){
    var entries=cats[key]||[],opts=[],meta={};
    for(var j=0;j<entries.length;j++){
      opts.push(entries[j].name);
      meta[entries[j].name]={color:entries[j].color||"",note:entries[j].note||"",
                             aliases:entries[j].aliases||[]};
    }
    return {key:key,label:label,color:color,options:opts,meta:meta,rw:isRW(key)};
  }
  var list=[];
  for(var i=0;i<order.length;i++){
    var o=order[i];
    list.push(pack(o.key,o.label||o.key,o.color||"#c49b2a"));
  }
  // any roster category not named in _order still shows up
  for(var k in cats){
    var found=false;
    for(var i=0;i<list.length;i++){if(list[i].key===k){found=true;break}}
    if(!found)list.push(pack(k,k,"#8a7e72"));
  }
  catList=list;
}

// ── LIVE POLLING ─────────────────────────────────────────────
function startPolling(){
  if(polling)clearInterval(polling);
  polling=setInterval(checkRev,45000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)checkRev()});
}
function checkRev(){
  if(document.hidden)return;
  api("action=rev").then(function(r){
    if(!r||r.error||r.rev===undefined)return;
    if(r.rev===rev)return;
    if(writesInFlight>0){refetchQueued=true;return}   // never clobber an edit in flight
    loadFromSheet(true).then(function(){toast("Updated from the sheet","info")});
  });
}
function refreshNow(){loadFromSheet(true).then(function(){toast("Refreshed","ok")})}

// ── SAVES ────────────────────────────────────────────────────
function saveShootDay(uid,date){
  return apiWrite({action:"setShootDay",uid:uid,date:date||""}).then(function(r){
    if(r&&r.error)toast("Save failed: "+r.error,"err");
  });
}
function saveSceneFields(s,fields,lists){
  return apiWrite({action:"saveScene",scene:{uid:s.uid,seqLabel:s.seqLabel,title:s.title,
                                             fields:fields,lists:lists||null}})
    .then(function(r){if(r&&r.error)toast("Save failed: "+r.error,"err")});
}
function saveDayMeta(k,d){
  return apiWrite({action:"saveDay",day:{date:k,label:d.label,call:d.call,wrap:d.wrap,notes:d.notes}})
    .then(function(r){if(r&&r.error)toast("Save failed: "+r.error,"err")});
}
/** Loose match, mirroring normKey() in the Apps Script. */
function nk(s){
  return String(s||"").toUpperCase().replace(/’/g,"'").replace(/\([^)]*\)/g," ")
    .replace(/['.\-]/g,"").replace(/[^A-Z0-9 /&]/g," ").replace(/\s+/g," ").trim();
}

function saveRosters(){
  var rows=[],seen={};
  for(var i=0;i<catList.length;i++){
    var c=catList[i];
    for(var j=0;j<c.options.length;j++){
      var nm=c.options[j],m=(c.meta&&c.meta[nm])||{};
      var k=c.key+"|"+nk(nm);
      if(seen[k])continue;            // never write the same value twice
      seen[k]=true;
      // aliases and notes ride along untouched — losing them would break the
      // consolidation that maps "MR. DRUMMOND" onto "Cobb/Drummond"
      rows.push([c.key,nm,m.color||c.color,(m.aliases||[]).join("; "),m.note||""]);
    }
  }
  return apiWrite({action:"saveRosters",rows:rows}).then(function(r){
    if(r&&r.error)toast("Settings save failed: "+r.error,"err");else toast("Settings saved","ok");
  });
}

// ── RENDER ───────────────────────────────────────────────────
function render(){renderLeft();renderCal();if(selDay)renderDayPanel(selDay)}

function toggleSidebar(){sidebarOpen=!sidebarOpen;applySidebar()}
function applySidebar(){
  var el=document.getElementById("leftPanel"),bd=document.getElementById("sbBackdrop"),bt=document.getElementById("sbToggle");
  if(!el)return;
  if(sidebarOpen){el.classList.add("open");if(bd)bd.classList.add("show");if(bt)bt.classList.add("gold")}
  else{el.classList.remove("open");if(bd)bd.classList.remove("show");if(bt)bt.classList.remove("gold")}
}
function setSort(m){sortMode=m;renderLeft()}
function setSortS(m){sortModeS=m;renderLeft()}
function toggleSec(w){if(w==="un")openUn=!openUn;else openSch=!openSch;renderLeft()}

function alphaCmp(a,b){return String(a||"").localeCompare(String(b||""),undefined,{numeric:true,sensitivity:"base"})}
function sortFn(mode){
  if(mode==="date")return function(a,b){
    var da=a.shootDay||"9999",db=b.shootDay||"9999";
    if(da!==db)return da<db?-1:1;
    return seqNum(a)-seqNum(b);
  };
  if(mode==="complexity")return function(a,b){return (b.complexity||0)-(a.complexity||0)||seqNum(a)-seqNum(b)};
  if(mode==="location")return function(a,b){
    var la=(a.locations&&a.locations.length)?a.locations[0]:"~none";
    var lb=(b.locations&&b.locations.length)?b.locations[0]:"~none";
    return alphaCmp(la,lb)||seqNum(a)-seqNum(b);
  };
  return function(a,b){return seqNum(a)-seqNum(b)};
}

function chipHTML(s,dateLabel){
  var cls="chip";
  if(hlActive())cls+=hlMatch(s)?" hl-on":" hl-off";
  var h='<div class="'+cls+'" draggable="true" ondragstart="startDrag(\''+s.uid+'\')" onclick="openEditor(\''+s.uid+'\')" style="background:linear-gradient(135deg,'+CC[s.complexity]+'22,'+CC[s.complexity]+'11);border:1.5px solid '+CC[s.complexity]+'55;border-left:4px solid '+CC[s.complexity]+'">';
  h+='<div class="name">'+(dateLabel?'<span class="cdate">'+dateLabel+'</span>':'')+esc(s.name)+'</div><div class="tags">';
  for(var j=0;j<(s.cast||[]).length;j++)h+='<span>'+esc(s.cast[j])+'</span>';
  for(var j=0;j<(s.timeOfDay||[]).length;j++)h+='<span class="tod">'+esc(s.timeOfDay[j])+'</span>';
  return h+'</div></div>';
}
function sortSelect(fn,cur,opts){
  var h='<select class="sort-sel" onchange="'+fn+'(this.value)">';
  for(var i=0;i<opts.length;i++)h+='<option value="'+opts[i][0]+'"'+(cur===opts[i][0]?' selected':'')+'>'+opts[i][1]+'</option>';
  return h+'</select>';
}

function renderLeft(){
  var el=document.getElementById("leftPanel");
  var unsched=[],schd=[];
  for(var i=0;i<scenes.length;i++){if(scenes[i].shootDay)schd.push(scenes[i]);else unsched.push(scenes[i])}
  unsched.sort(sortFn(sortMode));
  schd.sort(sortFn(sortModeS));

  var h='<div class="sec-head" onclick="toggleSec(\'un\')">';
  h+='<span class="sh-arrow">'+(openUn?"&#9660;":"&#9654;")+'</span>';
  h+='<span class="sh-title">Unscheduled</span><span class="sh-count">'+unsched.length+'</span></div>';
  if(openUn){
    h+=sortSelect("setSort",sortMode,[["seq","Sort: Sequential"],["complexity","Sort: Complexity"],["location","Sort: Location"]]);
    for(var i=0;i<unsched.length;i++)h+=chipHTML(unsched[i],"");
    if(!unsched.length)h+='<div style="font-size:11px;color:#4a9e6e;text-align:center;padding:12px">All scenes scheduled</div>';
  }

  h+='<div class="sec-div"></div>';
  h+='<div class="sec-head done" onclick="toggleSec(\'sch\')">';
  h+='<span class="sh-arrow">'+(openSch?"&#9660;":"&#9654;")+'</span>';
  h+='<span class="sh-title">Scheduled</span><span class="sh-count">'+schd.length+'</span></div>';
  if(openSch){
    h+=sortSelect("setSortS",sortModeS,[["date","Sort: Shoot Date"],["seq","Sort: Sequential"],["complexity","Sort: Complexity"],["location","Sort: Location"]]);
    for(var i=0;i<schd.length;i++)h+=chipHTML(schd[i],fmtDK(schd[i].shootDay));
    if(!schd.length)h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:12px">Nothing scheduled yet</div>';
  }

  h+='<div class="legend"><div class="lg-title">Complexity</div>';
  for(var n=1;n<=5;n++)h+='<div class="lg-item"><div class="lg-dot" style="background:'+CC[n]+'"></div><div class="lg-label">'+CL[n]+'</div></div>';
  h+='</div>';
  el.innerHTML=h;
  applySidebar();
}

// ── HIGHLIGHT ────────────────────────────────────────────────
function hlActive(){for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v&&v.length)return true}return false}

/* AND, not OR. Toggling Rhodes then Peter highlights only the scenes that have
   BOTH of them — every selected value must be present, in every category. */
function hlMatch(s){
  for(var ci=0;ci<catList.length;ci++){
    var ck=catList[ci].key,sel=highlight[ck];
    if(!sel||!sel.length)continue;
    var sv=s[ck]||[];
    for(var j=0;j<sel.length;j++){if(sv.indexOf(sel[j])<0)return false}
  }
  return true;
}
function toggleHL(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx];
  if(!highlight[catKey])highlight[catKey]=[];
  var i=highlight[catKey].indexOf(val);
  if(i>=0)highlight[catKey].splice(i,1);else highlight[catKey].push(val);
  if(!highlight[catKey].length)delete highlight[catKey];
  renderCal();renderLeft();
}
function clearHL(){highlight={};renderCal();renderLeft()}
function toggleHLBar(){hlOpen=!hlOpen;renderCal()}
function hlDates(){
  var out=[],dts=shootDates();
  for(var i=0;i<dts.length;i++){
    var list=scenesOn(dts[i]);
    for(var j=0;j<list.length;j++){if(hlMatch(list[j])){out.push(dts[i]);break}}
  }
  return out;
}

function renderHLBar(){
  var on=hlActive(),n=0;
  for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v)n+=v.length}
  var h='<div class="hl-bar"><div class="hl-head" onclick="toggleHLBar()">';
  h+='<span class="hl-arrow">'+(hlOpen?"&#9660;":"&#9654;")+'</span>';
  h+='<span class="hl-t">Highlight Scenes</span>';
  if(on)h+='<span class="hl-badge">'+n+' active</span>';
  h+='</div>';
  if(hlOpen){
    h+='<div class="hl-body">';
    for(var ci=0;ci<catList.length;ci++){
      var cat=catList[ci];
      if(!cat.options.length)continue;
      h+='<div class="hl-cat"><div class="hl-label">'+esc(cat.label)+'</div><div class="tog-row">';
      for(var oi=0;oi<cat.options.length;oi++){
        var o=cat.options[oi];
        var sel=highlight[cat.key]&&highlight[cat.key].indexOf(o)>=0;
        h+='<button class="tog'+(sel?' pos':'')+'" style="--tc:'+cat.color+'" onclick="toggleHL(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
      }
      h+='</div></div>';
    }
    if(on){
      var total=0,dts=shootDates();
      for(var i=0;i<dts.length;i++){var L=scenesOn(dts[i]);for(var j=0;j<L.length;j++){if(hlMatch(L[j]))total++}}
      var hd=hlDates(),labels=[];
      for(var i=0;i<catList.length;i++){var v=highlight[catList[i].key];if(v&&v.length)labels=labels.concat(v)}
      var shown=hd.slice(0,14).map(fmtDK).join(" &middot; ");
      if(hd.length>14)shown+=" &middot; +"+(hd.length-14)+" more";
      h+='<div class="hl-summary"><span class="hs-name">'+esc(labels.join(" + "))+'</span> &mdash; '+total+' scene'+(total===1?"":"s")+' across '+hd.length+' shoot day'+(hd.length===1?"":"s");
      if(hd.length)h+='<br><span class="hs-dates">'+shown+'</span>';
      h+='</div><div style="margin-top:8px"><button class="hl-clear" onclick="clearHL()">Clear highlights</button></div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}

// ── CALENDAR ─────────────────────────────────────────────────
function dayMinutes(list){var m=0;for(var i=0;i<list.length;i++)m+=list[i].lengthMin||0;return m}
function dayUnlocked(list){
  for(var i=0;i<list.length;i++){
    var st=(list[i].locStatus||"").toLowerCase();
    if(!st||st.indexOf("need")>=0||st.indexOf("undecided")>=0||st.indexOf("decid")>=0)return true;
  }
  return false;
}
function dayLenses(list){
  var out=[];
  for(var i=0;i<list.length;i++)for(var j=0;j<(list[i].lens||[]).length;j++){
    if(out.indexOf(list[i].lens[j])<0)out.push(list[i].lens[j]);
  }
  return out;
}

function renderCal(){
  var el=document.getElementById("calWrap");
  var dim=daysIn(yr,mo),fd=firstDow(yr,mo);
  var HLON=hlActive();
  var warnMin=(parseFloat(settings.dayHoursWarn)||10)*60;
  var unschedCount=0,schedCount=0;
  for(var i=0;i<scenes.length;i++){if(scenes[i].shootDay)schedCount++;else unschedCount++}

  var h='<div class="cal-nav"><button onclick="prevMo()">&#8249;</button><h2>'+MO[mo]+' '+yr+'</h2><button onclick="nextMo()">&#8250;</button></div><div class="cal-grid">';
  for(var i=0;i<7;i++)h+='<div class="cal-head">'+DN[i]+'</div>';
  for(var i=0;i<fd;i++)h+='<div></div>';
  for(var d=1;d<=dim;d++){
    var k=dkey(d),ds=scenesOn(k);
    var sel=selDay===d,we=(fd+d-1)%7===0||(fd+d-1)%7===6;
    var mins=dayMinutes(ds);

    var hitCount=0;
    if(HLON){
      var hit=[],miss=[];
      for(var j=0;j<ds.length;j++){if(hlMatch(ds[j]))hit.push(ds[j]);else miss.push(ds[j])}
      hitCount=hit.length;ds=hit.concat(miss);
    }
    var cls="cal-day"+(sel?" sel":"")+(we?" we":"");
    if(HLON)cls+=hitCount?" hl-hit":" hl-dim";

    h+='<div class="'+cls+'" onclick="selectDay('+d+')" ondragover="event.preventDefault()" ondrop="dropOnDay(event,'+d+')">';
    h+='<div class="dnum"><span>'+d+'</span>';
    if(HLON&&hitCount)h+='<span class="hl-count">'+hitCount+'</span>';
    else if(ds.length){
      var over=mins>warnMin;
      h+='<span class="badge" style="background:'+(over?'#c9404033':'#c49b2a22')+';color:'+(over?'#e8a0a0':'#c49b2a')+'">'+(mins?fmtMin(mins):ds.length+"s")+'</span>';
    }
    h+='</div>';
    for(var j=0;j<Math.min(ds.length,4);j++){
      var s=ds[j],mc="mini-chip";
      if(HLON)mc+=hlMatch(s)?" hl-on":" hl-off";
      h+='<div class="'+mc+'" draggable="true" ondragstart="event.stopPropagation();startDrag(\''+s.uid+'\')" style="background:'+CC[s.complexity]+'22;border-left:2px solid '+CC[s.complexity]+';color:'+CC[s.complexity]+'">'+esc(s.name)+'</div>';
    }
    if(ds.length>4)h+='<div style="font-size:8px;color:#6a5e52;text-align:center">+'+(ds.length-4)+'</div>';
    if(ds.length&&dayUnlocked(ds))h+='<div class="warn" title="A location on this day is not confirmed">&#9888;</div>';
    h+='</div>';
  }
  h+='</div><div class="stats">';
  var arr=[{v:shootDates().length,l:"Shoot Days",c:"#e8d5a0"},
           {v:schedCount,l:"Scheduled",c:"#e8d5a0"},
           {v:unschedCount,l:"Remaining",c:unschedCount?"#c49b2a":"#4a9e6e"},
           {v:scenes.length,l:"Total",c:"#e8d5a0"}];
  for(var i=0;i<arr.length;i++)h+='<div class="s"><div class="n" style="color:'+arr[i].c+'">'+arr[i].v+'</div><div class="l">'+arr[i].l+'</div></div>';
  h+='</div>'+renderHLBar();
  el.innerHTML=h;
}

// ── DAY PANEL / CALL SHEET ───────────────────────────────────
var dpAvail={};
function initDpAvail(){dpAvail={};for(var i=0;i<catList.length;i++)dpAvail[catList[i].key]={pos:[],neg:[]}}

function collect(list,pick){
  var out=[];
  for(var i=0;i<list.length;i++){
    var v=pick(list[i])||[];
    for(var j=0;j<v.length;j++){if(out.indexOf(v[j])<0)out.push(v[j])}
  }
  return out;
}
function personFor(canonName){
  for(var i=0;i<people.length;i++){
    var p=people[i];if(p.group!=="Cast")continue;
    var role=(p.role||"").toLowerCase();
    if(role.indexOf(canonName.toLowerCase())>=0)return p;
    var parts=canonName.toLowerCase().split("/");
    for(var j=0;j<parts.length;j++){if(parts[j].trim()&&role.indexOf(parts[j].trim())>=0)return p}
  }
  return null;
}

function renderDayPanel(day){
  var k=dkey(day),assigned=scenesOn(k);
  var meta=days[k]||{label:"",call:"",wrap:"",notes:""};
  var unsched=[];for(var i=0;i<scenes.length;i++){if(!scenes[i].shootDay)unsched.push(scenes[i])}
  var mins=dayMinutes(assigned);
  var warnMin=(parseFloat(settings.dayHoursWarn)||10)*60;

  var hasF=false;
  for(var ci=0;ci<catList.length;ci++){var ck=catList[ci].key;if(!dpAvail[ck])dpAvail[ck]={pos:[],neg:[]};if(dpAvail[ck].pos.length||dpAvail[ck].neg.length){hasF=true;break}}

  var matches=[];
  if(hasF){
    for(var i=0;i<unsched.length;i++){
      var s=unsched[i],ok=true;
      for(var ci=0;ci<catList.length;ci++){
        var ck=catList[ci].key;
        if(!dpAvail[ck])continue;
        var pos=dpAvail[ck].pos,neg=dpAvail[ck].neg,sv=s[ck]||[];
        if(pos.length>0){var found=false;for(var j=0;j<sv.length;j++){if(pos.indexOf(sv[j])>=0){found=true;break}}if(!found){ok=false;break}}
        if(neg.length>0){for(var j=0;j<sv.length;j++){if(neg.indexOf(sv[j])>=0){ok=false;break}}if(!ok)break}
      }
      if(ok)matches.push(s);
    }
    matches.sort(function(a,b){return b.complexity-a.complexity});
  }

  var h='<div class="daypanel"><div class="dp-head"><h2>'+DN[new Date(yr,mo,day).getDay()]+' '+MO[mo]+' '+day+', '+yr+'</h2>';
  h+='<div style="display:flex;gap:5px"><button class="hbtn" onclick="window.print()" title="Print call sheet">&#128424;</button>';
  h+='<button class="hbtn" onclick="closeDay()">&#10005;</button></div></div><div class="dp-body">';

  if(assigned.length){
    var cams=collect(assigned,function(s){return s.camera});
    var lenses=dayLenses(assigned);
    var tc=0;for(var i=0;i<assigned.length;i++)tc+=assigned[i].complexity;

    h+='<div class="cs-top">';
    h+='<div class="cs-stat"><div class="v">'+(mins?fmtMin(mins):"—")+'</div><div class="l">Est. Hours</div></div>';
    h+='<div class="cs-stat"><div class="v">'+assigned.length+'</div><div class="l">Scenes</div></div>';
    h+='<div class="cs-stat"><div class="v">'+tc+'</div><div class="l">Complexity</div></div>';
    h+='</div>';

    if(mins>warnMin)h+='<div class="cs-warn red">Over '+(settings.dayHoursWarn||10)+' hours &mdash; '+fmtMin(mins)+' scheduled.</div>';
    if(lenses.length>1)h+='<div class="cs-warn amber">Two lens packages on one day: '+esc(lenses.join(" &middot; "))+'. Budget a rebuild.</div>';
    if(dayUnlocked(assigned))h+='<div class="cs-warn amber">A location on this day is not confirmed yet.</div>';

    h+='<div class="dp-section">Day</div>';
    h+='<div class="field" style="display:flex;gap:5px;margin-bottom:6px">';
    h+='<input id="dp-label" placeholder="Day label (e.g. Winery Night 1)" value="'+esc(meta.label)+'" style="flex:1;padding:6px 9px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none">';
    h+='<input id="dp-call" placeholder="Call" value="'+esc(meta.call)+'" style="width:64px;padding:6px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none;text-align:center">';
    h+='<input id="dp-wrap" placeholder="Wrap" value="'+esc(meta.wrap)+'" style="width:64px;padding:6px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none;text-align:center">';
    h+='<button class="mbtn gold" style="padding:6px 12px;font-size:11px" onclick="saveDayEdits(\''+k+'\')">Save</button></div>';
    if(cams.length)h+='<div style="font-size:10px;color:#8a7e72;margin-bottom:4px">Camera: <span style="color:#c9b896">'+esc(cams.join(", "))+'</span> &nbsp;·&nbsp; Lens: <span style="color:#c9b896">'+esc(lenses.join(", "))+'</span></div>';

    // Locations with address + lock status
    var locs=collect(assigned,function(s){return s.locations});
    if(locs.length){
      h+='<div class="dp-section">Locations</div>';
      for(var i=0;i<locs.length;i++){
        var addr="",stat="";
        for(var j=0;j<assigned.length;j++){
          if((assigned[j].locations||[]).indexOf(locs[i])>=0){
            if(!addr&&assigned[j].address)addr=assigned[j].address;
            if(!stat&&assigned[j].locStatus)stat=assigned[j].locStatus;
          }
        }
        var bad=!stat||stat.toLowerCase().indexOf("need")>=0||stat.toLowerCase().indexOf("undecided")>=0;
        h+='<div class="loc-row"><div class="lr-n">'+esc(locs[i])+'</div>';
        if(addr)h+='<div class="lr-a">'+esc(addr.replace(/\n+/g," · "))+'</div>';
        h+='<div class="lr-s" style="color:'+(bad?"#c49b2a":"#4a9e6e")+'">'+esc(stat||"Not confirmed")+'</div></div>';
      }
    }

    // Cast call
    var cast=collect(assigned,function(s){return s.cast});
    if(cast.length){
      h+='<div class="dp-section">Cast Call ('+cast.length+')</div>';
      for(var i=0;i<cast.length;i++){
        var inSeqs=[];
        for(var j=0;j<assigned.length;j++){if((assigned[j].cast||[]).indexOf(cast[i])>=0)inSeqs.push("SEQ "+assigned[j].seq)}
        var p=personFor(cast[i]);
        h+='<div class="cast-row"><span class="cr-n">'+esc(cast[i])+'</span>';
        h+='<span class="cr-a">'+esc(p?p.name:"")+(p&&p.availability?' <span class="cr-s">('+esc(p.availability.split("\n")[0])+')</span>':"")+'</span>';
        h+='<span class="cr-s">'+inSeqs.join(", ")+'</span></div>';
      }
    }

    // Scene cards
    h+='<div class="dp-section">Scenes</div>';
    for(var i=0;i<assigned.length;i++){
      var s=assigned[i],open=!!openScene[s.uid];
      h+='<div class="sc-card">';
      h+='<div class="sc-h" onclick="toggleScene(\''+s.uid+'\')">';
      h+='<span class="sc-seq" style="background:'+CC[s.complexity]+'">'+esc(s.seqLabel||("SEQ "+s.seq))+'</span>';
      h+='<div class="sc-t"><div class="sc-name">'+esc(s.title)+'</div><div class="sc-slug">'+esc(s.slugline)+'</div></div>';
      h+='<div class="sc-len">'+(s.length?esc(s.length.replace(/:00$/,"")):"—")+'</div></div>';
      if(open){
        h+='<div class="sc-body">';
        if(s.shortSummary)h+='<p style="color:#e8d5a0">'+esc(s.shortSummary)+'</p>';
        if(s.detail)h+='<p>'+esc(s.detail)+'</p>';
        var dept=[["Cast",s.raw.cast],["Extras",s.raw.extras],["Vehicles",s.raw.vehicles],
                  ["Props / Weapons",s.raw.props],["Wardrobe",s.raw.wardrobe],
                  ["Hair / Makeup",s.raw.hairMakeup],["Stunts / Action",s.raw.stunts],
                  ["VFX / SFX",s.raw.vfx]];
        for(var d2=0;d2<dept.length;d2++){
          if(!dept[d2][1]||!dept[d2][1].length)continue;
          h+='<div class="sc-dept"><div class="dl">'+dept[d2][0]+'</div><div class="dv">'+esc(dept[d2][1].join(" · "))+'</div></div>';
        }
        h+='<div style="display:flex;gap:5px;margin-top:10px">';
        h+='<button class="mbtn ghost" style="padding:4px 10px;font-size:10px" onclick="event.stopPropagation();openEditor(\''+s.uid+'\')">Edit scheduling</button>';
        h+='<button class="mbtn red" style="padding:4px 10px;font-size:10px" onclick="event.stopPropagation();unschedule(\''+s.uid+'\')">Unschedule</button></div>';
        h+='</div>';
      }
      h+='</div>';
    }

    // Department roll-ups
    h+='<div class="dp-section">Department Roll-up</div>';
    var rolls=[["Props / Weapons",collect(assigned,function(s){return s.raw.props})],
               ["Wardrobe",collect(assigned,function(s){return s.raw.wardrobe})],
               ["Hair / Makeup",collect(assigned,function(s){return s.raw.hairMakeup})],
               ["Stunts / Action",collect(assigned,function(s){return s.raw.stunts})],
               ["VFX / SFX",collect(assigned,function(s){return s.raw.vfx})],
               ["Extras",collect(assigned,function(s){return s.raw.extras})]];
    for(var i=0;i<rolls.length;i++){
      if(!rolls[i][1].length)continue;
      h+='<div class="roll"><b>'+rolls[i][0]+'</b>'+esc(rolls[i][1].join(" · "))+'</div>';
    }

    h+='<div class="dp-section">Day Notes</div>';
    h+='<textarea id="dp-notes" rows="2" placeholder="Generator on site, contract signed..." style="width:100%;padding:7px 9px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:11px;outline:none;resize:vertical">'+esc(meta.notes)+'</textarea>';
    h+='<button class="mbtn ghost" style="margin-top:5px;padding:5px 12px;font-size:11px" onclick="saveDayEdits(\''+k+'\')">Save notes</button>';
    h+='<div style="height:18px"></div>';
  }

  // Resource filter
  h+='<div class="res-box"><div class="rb-title">What do you have this day?</div>';
  h+='<div class="rb-hint">Click = available (include). Click again = exclude (red). Click again = off.</div>';
  for(var ci=0;ci<catList.length;ci++){
    var cat=catList[ci];
    if(!cat.options.length)continue;
    if(!dpAvail[cat.key])dpAvail[cat.key]={pos:[],neg:[]};
    h+='<div class="res-cat"><div class="rc-label">'+esc(cat.label)+'</div><div class="tog-row">';
    for(var oi=0;oi<cat.options.length;oi++){
      var o=cat.options[oi];
      var inPos=dpAvail[cat.key].pos.indexOf(o)>=0;
      var inNeg=dpAvail[cat.key].neg.indexOf(o)>=0;
      var cls2="tog";
      if(inPos)cls2+=" pos";else if(inNeg)cls2+=" neg";
      h+='<button class="'+cls2+'" style="--tc:'+cat.color+'" onclick="cycleAvail(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
    }
    h+='</div></div>';
  }
  h+='</div>';

  if(hasF){
    h+='<div class="dp-section">Scenes That Fit ('+matches.length+')</div>';
    if(!matches.length)h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:12px">No unscheduled scenes match</div>';
    for(var i=0;i<matches.length;i++){
      var s=matches[i];
      h+='<div class="match-item"><div class="mi-info" onclick="openEditor(\''+s.uid+'\')" style="background:'+CC[s.complexity]+'15;border:1px solid '+CC[s.complexity]+'44;border-left:3px solid '+CC[s.complexity]+'"><div class="mi-name">'+esc(s.name)+'</div><div class="mi-meta">'+esc((s.cast||[]).join(", "))+' &middot; '+esc((s.locations||[]).join(", "))+'</div></div><button class="mi-add" onclick="addToDay(\''+s.uid+'\','+day+')">+ Add</button></div>';
    }
  }else{
    h+='<div style="font-size:11px;color:#5a5248;text-align:center;padding:16px">Toggle resources above to find matching scenes</div>';
  }
  h+='</div></div>';
  document.getElementById("dayPanelMount").innerHTML=h;
}

function toggleScene(uid){openScene[uid]=!openScene[uid];if(selDay)renderDayPanel(selDay)}
function saveDayEdits(k){
  var l=document.getElementById("dp-label"),c=document.getElementById("dp-call"),
      w=document.getElementById("dp-wrap"),n=document.getElementById("dp-notes");
  var d={label:l?l.value:"",call:c?c.value:"",wrap:w?w.value:"",notes:n?n.value:""};
  days[k]=d;saveDayMeta(k,d).then(function(){toast("Day saved","ok")});
}
function cycleAvail(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx];
  if(!dpAvail[catKey])dpAvail[catKey]={pos:[],neg:[]};
  var inPos=dpAvail[catKey].pos.indexOf(val),inNeg=dpAvail[catKey].neg.indexOf(val);
  if(inPos>=0){dpAvail[catKey].pos.splice(inPos,1);dpAvail[catKey].neg.push(val)}
  else if(inNeg>=0){dpAvail[catKey].neg.splice(inNeg,1)}
  else{dpAvail[catKey].pos.push(val)}
  if(selDay)renderDayPanel(selDay);
}

// ── ACTIONS ──────────────────────────────────────────────────
function prevMo(){if(mo===0){mo=11;yr--}else mo--;render()}
function nextMo(){if(mo===11){mo=0;yr++}else mo++;render()}
function selectDay(d){selDay=selDay===d?null:d;initDpAvail();render();if(selDay)renderDayPanel(selDay)}
function closeDay(){selDay=null;document.getElementById("dayPanelMount").innerHTML="";render()}

/** Scheduling is one cell now — no source row to rewrite. */
function setDay(uid,dateKey){
  var s=getScene(uid);if(!s)return;
  s.shootDay=dateKey||"";
  render();if(selDay)renderDayPanel(selDay);
  saveShootDay(uid,dateKey||"");
}
function addToDay(uid,day){setDay(uid,dkey(day))}
function unschedule(uid){setDay(uid,"")}
function startDrag(uid){dragId=uid}
function dropOnDay(e,day){
  e.preventDefault();
  if(!dragId)return;
  var uid=dragId;dragId=null;
  setDay(uid,dkey(day));
}

// ── EDITOR ───────────────────────────────────────────────────
function openEditor(uid){
  var isNew=!uid;
  var s=isNew
    ? {uid:"s"+Date.now(),seqLabel:"",title:"",complexity:3,notes:"",shootDay:"",dayOrder:null,raw:{},_new:true}
    : JSON.parse(JSON.stringify(getScene(uid)));
  for(var i=0;i<catList.length;i++){if(!s[catList[i].key])s[catList[i].key]=[]}
  window._ed=s;renderEditor(isNew);
}
function renderEditor(isNew){
  var s=window._ed;
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">';
  h+='<h2>'+(isNew?'New Scene':esc(s.seqLabel||"")+' &mdash; '+esc(s.title))+'</h2>';

  if(isNew){
    h+='<div class="field"><label>SEQ</label><input id="ed-seq" placeholder="SEQ 30.75" value="'+esc(s.seqLabel)+'" onchange="window._ed.seqLabel=this.value">';
    h+='<div class="ro-note">Decimals are fine. The sheet inserts the row in scene order &mdash; 30.75 lands between 30.5 and 31.</div></div>';
    h+='<div class="field"><label>Scene Title</label><input id="ed-title" value="'+esc(s.title)+'" onchange="window._ed.title=this.value"></div>';
  }else if(s.slugline){
    h+='<div style="font-size:11px;color:#7a6e62;font-style:italic;margin-bottom:12px">'+esc(s.slugline)+
       (s.length?' &nbsp;·&nbsp; '+esc(s.length):'')+'</div>';
  }

  h+='<div class="field"><label>Shoot Day</label><input type="date" id="ed-day" value="'+esc(s.shootDay||"")+'" onchange="window._ed.shootDay=this.value">';
  h+='<div class="ro-note">Blank = unscheduled. Writes column X of the Sequences tab.</div></div>';

  h+='<div class="field"><label>Complexity</label><div class="cx-row">';
  for(var n=1;n<=5;n++)h+='<button class="cx-btn" onclick="setCx('+n+')" style="border:'+(s.complexity===n?'2px solid '+CC[n]:'1px solid #3a342e')+';background:'+(s.complexity===n?CC[n]+'33':'#1a1714')+';color:'+(s.complexity===n?CC[n]:'#8a7e72')+'">'+CL[n]+'</button>';
  h+='</div></div>';

  h+='<div style="font-size:10px;color:#6a5e52;line-height:1.6;margin:2px 0 12px;padding:7px 9px;background:#141210;border:1px solid #2a2520;border-radius:5px">';
  h+='Ticking these writes back to the sheet. Wording you already wrote is kept &mdash; a row reading <em style="color:#8a7e72">TOM (post-jump)</em> stays exactly that while Tom is ticked. Untick to remove; newly ticked names are added plainly for you to reword in the sheet.</div>';

  for(var ci=0;ci<catList.length;ci++){
    var cat=catList[ci];
    if(!cat.options.length)continue;
    h+='<div class="field"><label>'+esc(cat.label)+(cat.rw?'':' <span style="color:#5a5248;text-transform:none;letter-spacing:0">— from the sheet</span>')+'</label>';
    if(cat.rw){
      h+='<div class="tog-row">';
      for(var oi=0;oi<cat.options.length;oi++){
        var o=cat.options[oi],on=(s[cat.key]||[]).indexOf(o)>=0;
        h+='<button class="tog'+(on?' pos':'')+'" style="--tc:'+cat.color+'" onclick="togEdit(\''+cat.key+'\','+oi+')">'+esc(o)+'</button>';
      }
      h+='</div>';
    }else{
      var vals=s[cat.key]||[];
      if(!vals.length)h+='<div style="font-size:11px;color:#5a5248">—</div>';
      else{h+='<div>';for(var vi=0;vi<vals.length;vi++)h+='<span class="ro-chip">'+esc(vals[vi])+'</span>';h+='</div>'}
    }
    h+='</div>';
  }

  h+='<div class="field"><label>Scheduling Notes</label><textarea id="ed-notes" rows="3" onchange="window._ed.notes=this.value">'+esc(s.notes||"")+'</textarea></div>';
  h+='<div style="display:flex;justify-content:space-between;margin-top:8px"><div style="display:flex;gap:8px">';
  h+='<button class="mbtn gold" onclick="saveEdit()">Save</button><button class="mbtn ghost" onclick="closeModal()">Cancel</button></div>';
  if(!isNew&&s.shootDay)h+='<button class="mbtn red" onclick="unschedule(\''+s.uid+'\');closeModal()">Unschedule</button>';
  h+='</div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
}
function togEdit(catKey,idx){
  var cat=getCat(catKey);if(!cat)return;
  var val=cat.options[idx],s=window._ed;
  if(!s[catKey])s[catKey]=[];
  var i=s[catKey].indexOf(val);
  if(i>=0)s[catKey].splice(i,1);else s[catKey].push(val);
  renderEditor(!!s._new);
}
function setCx(n){window._ed.complexity=n;renderEditor(!!window._ed._new)}

function saveEdit(){
  var s=window._ed;
  var dayEl=document.getElementById("ed-day");if(dayEl)s.shootDay=dayEl.value;
  var nEl=document.getElementById("ed-notes");if(nEl)s.notes=nEl.value;
  if(s._new){
    var sq=document.getElementById("ed-seq"),ti=document.getElementById("ed-title");
    if(sq)s.seqLabel=normalizeSeq(sq.value);if(ti)s.title=ti.value;
    if(!s.title.trim()){toast("Give the scene a title","err");return}
    s.seq=String(s.seqLabel).replace(/SEQ/i,"").trim();
    s.raw={cast:[],locations:[],props:[],extras:[],wardrobe:[],hairMakeup:[],stunts:[],vfx:[],vehicles:[]};
    s.name=(s.seqLabel?s.seqLabel+" — ":"")+s.title;
    delete s._new;
    scenes.push(s);
    scenes.sort(function(a,b){return seqNum(a)-seqNum(b)});  // matches the row the sheet inserts
  }else{
    for(var i=0;i<scenes.length;i++){if(scenes[i].uid===s.uid){s.name=(s.seqLabel?s.seqLabel+" — ":"")+s.title;scenes[i]=s;break}}
  }

  var fields={"SHOOTING DAY":s.shootDay||"","COMPLEXITY":s.complexity,"SCHED NOTES":s.notes||""};
  for(var key in RW_CATS)fields[RW_CATS[key]]=s[key]||[];

  // prose-column categories go over separately so the script can reconcile them
  var lists={};
  for(var lk in RW_LISTS)lists[lk]=s[lk]||[];

  closeModal();render();if(selDay)renderDayPanel(selDay);
  saveSceneFields(s,fields,lists).then(function(){toast("Scene saved","ok")});
}
function closeModal(){document.getElementById("modalMount").innerHTML=""}

// ── SETTINGS ─────────────────────────────────────────────────
var sTab=0,sRen=null,sRenVal="",sMode="options";
function openSettings(){sTab=0;sRen=null;sMode="options";renderSettings()}

function renderSettings(){
  var h='<div class="modal-bg" onclick="closeModal()"><div class="modal" style="padding:0;max-width:720px" onclick="event.stopPropagation()"><div class="settings-wrap">';
  h+='<div class="settings-nav"><div class="sn-title">Settings</div>';
  for(var i=0;i<catList.length;i++){
    h+='<div class="sn-item'+(sMode==="options"&&sTab===i?' active':'')+'" onclick="sTab='+i+';sMode=\'options\';sRen=null;renderSettings()">'+esc(catList[i].label)+' ('+catList[i].options.length+')</div>';
  }
  h+='<div style="border-top:1px solid #3a342e;margin:12px 0"></div>';
  h+='<div class="sn-item'+(sMode==="categories"?' active':'')+'" style="font-weight:600" onclick="sMode=\'categories\';sRen=null;renderSettings()">Manage Categories</div>';
  h+='<div class="sn-item'+(sMode==="about"?' active':'')+'" onclick="sMode=\'about\';renderSettings()">About</div>';
  h+='<div class="sn-item" style="color:#4a9e6e;font-weight:600" onclick="saveRosters()">Save to Rosters</div>';
  h+='<div class="sn-item" style="color:#c94040" onclick="closeModal()">Close</div></div>';
  h+='<div class="settings-body">';

  if(sMode==="options"&&catList[sTab]){
    var cat=catList[sTab];
    h+='<h3 style="font-family:EB Garamond,Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400;margin-bottom:6px">'+esc(cat.label)+'</h3>';
    h+='<div style="font-size:10px;color:#8a7e72;margin-bottom:12px;line-height:1.6">These come from the <strong>Rosters</strong> tab. Merge a duplicate by moving its name into another row\'s <strong>ALIASES</strong> column in the sheet.<br>For a clear-out, use <strong>Project Hairpin &rarr; Rosters: remove duplicates</strong> (or <strong>remove unused values</strong>) in the spreadsheet menu.</div>';
    h+='<div style="display:flex;gap:8px;margin-bottom:14px"><input id="set-new" placeholder="Add new '+esc(cat.label).toLowerCase()+' option..." style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:13px;outline:none" onkeydown="if(event.key===\'Enter\')addOpt()"><button class="mbtn gold" style="padding:7px 14px" onclick="addOpt()">Add</button></div>';
    for(var i=0;i<cat.options.length;i++){
      var v=cat.options[i];
      h+='<div class="cat-row">';
      if(sRen===i){
        h+='<input id="set-ren" value="'+esc(sRenVal)+'" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid #c49b2a66;background:#141210;color:#e8e0d6;font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')renameOpt('+i+');if(event.key===\'Escape\'){sRen=null;renderSettings()}">';
        h+='<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameOpt('+i+')">Save</button>';
        h+='<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="sRen=null;renderSettings()">Esc</button>';
      }else{
        var cnt=0;for(var j=0;j<scenes.length;j++){if(scenes[j][cat.key]&&scenes[j][cat.key].indexOf(v)>=0)cnt++}
        var m=(cat.meta&&cat.meta[v])||{},na=(m.aliases||[]).length;
        h+='<span class="cr-name">'+esc(v)+
           (na?' <span style="color:#5a5248;font-size:9px" title="'+esc((m.aliases||[]).join(" · "))+'">+'+na+' alias'+(na===1?'':'es')+'</span>':'')+
           (m.note?' <span style="color:#5a5248;font-size:9px">'+esc(m.note)+'</span>':'')+'</span>';
        h+='<span class="cr-count">'+cnt+'&times;</span>';
        if(i>0)h+='<button class="cat-row cr-up" onclick="moveOpt('+i+',-1)">&#9650;</button>';
        if(i<cat.options.length-1)h+='<button class="cat-row cr-dn" onclick="moveOpt('+i+',1)">&#9660;</button>';
        h+='<button class="cat-row cr-ren" onclick="sRen='+i+';sRenVal=catList[sTab].options['+i+'];renderSettings()">Rename</button>';
        h+='<button class="cat-row cr-del" onclick="delOpt('+i+')">Del</button>';
      }
      h+='</div>';
    }
  }

  if(sMode==="categories"){
    h+='<h3 style="font-family:EB Garamond,Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400;margin-bottom:14px">Manage Categories</h3>';
    h+='<div style="font-size:10px;color:#8a7e72;margin-bottom:12px">Add, rename, reorder, or remove entire categories. Changes affect the scene editor, the day panel filter, and the highlight bar.</div>';
    h+='<div style="display:flex;gap:8px;margin-bottom:14px"><input id="cat-new-key" placeholder="Key (no spaces)" style="width:100px;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none"><input id="cat-new-label" placeholder="Display name" style="flex:1;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none"><input id="cat-new-color" placeholder="#color" value="#c49b2a" style="width:80px;padding:7px 10px;border-radius:5px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:12px;outline:none"><button class="mbtn gold" style="padding:7px 14px" onclick="addCategory()">Add</button></div>';
    for(var i=0;i<catList.length;i++){
      var c=catList[i];
      h+='<div class="cat-row">';
      if(sRen===i){
        h+='<input id="cat-ren-label" value="'+esc(c.label)+'" style="flex:1;padding:3px 7px;border-radius:4px;border:1px solid #c49b2a66;background:#141210;color:#e8e0d6;font-size:12px;outline:none" onkeydown="if(event.key===\'Enter\')renameCat('+i+')">';
        h+='<input id="cat-ren-color" value="'+esc(c.color)+'" style="width:70px;padding:3px 7px;border-radius:4px;border:1px solid #3a342e;background:#141210;color:#e8e0d6;font-size:11px;outline:none">';
        h+='<button class="mbtn gold" style="padding:3px 8px;font-size:10px" onclick="renameCat('+i+')">Save</button>';
        h+='<button class="mbtn ghost" style="padding:3px 6px;font-size:10px" onclick="sRen=null;renderSettings()">Esc</button>';
      }else{
        h+='<div style="width:12px;height:12px;border-radius:3px;background:'+c.color+';flex-shrink:0"></div>';
        h+='<span class="cr-name">'+esc(c.label)+' <span style="color:#5a5248;font-size:10px">('+c.key+')</span>'+(c.rw?'':' <span style="color:#5a5248;font-size:9px">read-only</span>')+'</span>';
        h+='<span class="cr-count">'+c.options.length+' opts</span>';
        if(i>0)h+='<button class="cat-row cr-up" onclick="moveCat('+i+',-1)">&#9650;</button>';
        if(i<catList.length-1)h+='<button class="cat-row cr-dn" onclick="moveCat('+i+',1)">&#9660;</button>';
        h+='<button class="cat-row cr-ren" onclick="sRen='+i+';renderSettings()">Edit</button>';
        h+='<button class="cat-row cr-del" onclick="delCategory('+i+')">Del</button>';
      }
      h+='</div>';
    }
  }

  if(sMode==="about"){
    h+='<h3 style="font-family:EB Garamond,Georgia,serif;font-size:18px;color:#e8d5a0;font-weight:400;margin-bottom:14px">About</h3>';
    h+='<div style="font-size:11px;color:#a09585;line-height:1.8">';
    h+='The <strong>Sequences</strong> tab of the production document is the database. Each scene row carries its own <strong>SHOOTING DAY</strong>, so a scene can only ever be in one place.<br><br>';
    h+='Editable here: <strong>Shoot Day, Complexity, Cast, Locations, Props, Extras, Act, Camera, Lens, Time of Day, Lighting, Weather, Status, Notes</strong>.<br>';
    h+='The prose columns reconcile rather than overwrite &mdash; your own wording survives being edited from the app.<br><br>';
    h+='Read-only here, edited in the sheet: <strong>summaries, sluglines, addresses, wardrobe, hair &amp; makeup, stunts, VFX</strong>.<br><br>';
    h+='Lists in the sheet split on a <strong>semicolon or a line break</strong>, never a comma.<br><br>';
    h+='<span style="color:#6a5e52">Scenes: '+scenes.length+' &middot; shoot days: '+shootDates().length+' &middot; revision: '+rev+'</span>';
    h+='</div>';
  }

  h+='</div></div></div></div>';
  document.getElementById("modalMount").innerHTML=h;
  if(sRen!==null){var el=document.getElementById("set-ren")||document.getElementById("cat-ren-label");if(el)el.focus()}
}

function addOpt(){
  var el=document.getElementById("set-new"),v=el.value.trim();
  if(!v)return;
  var cat=catList[sTab];
  for(var i=0;i<cat.options.length;i++){          // loose match, so "Rope" won't
    if(nk(cat.options[i])===nk(v)){               // sit beside an existing "rope"
      toast('"'+cat.options[i]+'" is already there',"info");
      el.value="";return;
    }
  }
  cat.options.push(v);
  if(!cat.meta)cat.meta={};
  cat.meta[v]={color:"",note:"",aliases:[]};
  el.value="";renderSettings();
}
function delOpt(idx){
  var cat=catList[sTab],nm=cat.options[idx];
  // A value still written in a scene cell gets re-created on the next load, so
  // deleting it here alone would look like the delete silently failed.
  var users=[];
  for(var i=0;i<scenes.length;i++){
    if(scenes[i][cat.key]&&scenes[i][cat.key].indexOf(nm)>=0)users.push(scenes[i].seqLabel||scenes[i].seq);
  }
  if(users.length){
    var list=users.slice(0,8).join(", ")+(users.length>8?" +"+(users.length-8)+" more":"");
    if(!confirm('"'+nm+'" is still used by '+users.length+' scene'+(users.length===1?'':'s')+
                ':\n\n'+list+
                '\n\nDeleting it here will not stick — the sheet still has it, so it comes back on the next load.'+
                '\n\nUntick it on those scenes first. Delete anyway?'))return;
  }
  cat.options.splice(idx,1);
  if(cat.meta)delete cat.meta[nm];
  renderSettings();
}
function moveOpt(idx,dir){var o=catList[sTab].options;var t=o[idx];o[idx]=o[idx+dir];o[idx+dir]=t;renderSettings()}
function renameOpt(idx){
  var nw=document.getElementById("set-ren").value.trim(),old=catList[sTab].options[idx];
  if(!nw||nw===old){sRen=null;renderSettings();return}
  var cat=catList[sTab];
  cat.options[idx]=nw;
  if(cat.meta){                      // carry aliases and the note onto the new name
    cat.meta[nw]=cat.meta[old]||{color:"",note:"",aliases:[]};
    if(old!==nw)delete cat.meta[old];
  }
  var ck=cat.key;
  for(var i=0;i<scenes.length;i++){if(scenes[i][ck])for(var j=0;j<scenes[i][ck].length;j++){if(scenes[i][ck][j]===old)scenes[i][ck][j]=nw}}
  sRen=null;renderSettings();
}
function addCategory(){
  var key=document.getElementById("cat-new-key").value.trim().replace(/\s+/g,"_");
  var label=document.getElementById("cat-new-label").value.trim();
  var color=document.getElementById("cat-new-color").value.trim()||"#c49b2a";
  if(!key||!label)return;
  for(var i=0;i<catList.length;i++){if(catList[i].key===key){toast("Key already exists","err");return}}
  catList.push({key:key,label:label,color:color,options:[],rw:isRW(key)});
  renderSettings();
}
function delCategory(idx){
  if(!confirm("Delete category '"+catList[idx].label+"'? This won't remove data from existing scenes."))return;
  catList.splice(idx,1);if(sTab>=catList.length)sTab=Math.max(0,catList.length-1);renderSettings();
}
function moveCat(idx,dir){var t=catList[idx];catList[idx]=catList[idx+dir];catList[idx+dir]=t;renderSettings()}
function renameCat(idx){
  var nl=document.getElementById("cat-ren-label").value.trim(),nc=document.getElementById("cat-ren-color").value.trim();
  if(nl)catList[idx].label=nl;
  if(nc)catList[idx].color=nc;
  sRen=null;renderSettings();
}

// ── BOOT ─────────────────────────────────────────────────────
(function boot(){
  render();
  loadFromSheet().then(function(ok){ if(ok)startPolling() });
})();
</script>
